  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}
.chat-dock.is-busy .chat-input { color: var(--text-3); }

@media (max-width: 900px) {
  /* Full width, and ABOVE the pinned recipe bar — which is itself fixed to the
     bottom edge on a phone. Overlapping it would bury the recipe the user just
     asked for behind the box they asked in. */
  .chat-dock {
    left: var(--s3);
    right: var(--s3);
    bottom: calc(var(--recipe-bar-height, 0px) + var(--s3));
  }
}
</style>

<body>

<!-- Loading state. The lazy shell fetches the catalog before anything is
     wired; until the workbench starts (body.workbench) or the boot fails
     (body.boot-failed, with its own Reload), this is all the page shows. -->
<div class="boot-status" id="boot-status" role="status">Loading the catalog…</div>

<!-- The native action buttons. uiStart (src/workbench.js) moves each one by id
     into the workbench header, its More menu or Your recipe, replaces its
     content and label, and then removes this header. Their ids and handlers
     (wired in _initApp, src/app.js) are the one implementation of each action. -->
<header class="app-bar">
  <button id="btn-undo" disabled></button>
  <button id="btn-redo" disabled></button>
  <button id="btn-attributions"></button>
  <button id="btn-traditions"></button>
  <button id="btn-saved"></button>
  <button id="btn-save"></button>
  <button id="btn-add"></button>
</header>

<main class="workspace">
  <aside id="workspace-sidebar" aria-label="Your recipe">
    <!-- Three zones: a fixed top (session name), a scrolling middle
         (#sidebar-scroll: filter, genre groups, suggestions — the shell adds
         Add genre / Add instrument and Recording environment), and a fixed
         bottom (recipe preview). The middle is the only scroll region, which is
         what lets the genre headers stick to the top and the recipe preview stay
         pinned to the bottom — both always reachable regardless of list length.
         src/workbench.js arranges these per presentation (sidebar or dock). -->
    <div id="sidebar-header"></div>
    <div id="sidebar-scroll">
      <div id="sidebar-filter"></div>
      <div id="sidebar-traditions"></div>
      <div id="sidebar-staple"></div>
    </div>
    <div id="sidebar-recipe-preview"></div>
  </aside>
  <section id="workspace-detail"></section>
</main>

<!-- Modal: traditions -->
<div class="modal-bg" id="modal-trad">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-trad-title">
    <div class="modal-head">
      <h2 id="modal-trad-title">Browse traditions</h2>
      <button class="icon-btn" data-close="modal-trad" data-tooltip="Close" data-tooltip-pos="bottom" aria-label="Close"><span data-icon="x" data-size="14"></span></button>
    </div>
    <div class="modal-search"><span class="search-adornment"><span data-icon="search" data-size="14"></span></span><input type="search" id="search-trad" placeholder="Search traditions…" autocomplete="off" aria-label="Search traditions"></div>
    <div class="modal-body" id="picker-trad"></div>
  </div>
</div>

<!-- Modal: save -->
<div class="modal-bg" id="modal-save">
  <div class="modal" style="max-width: 420px;" role="dialog" aria-modal="true" aria-labelledby="modal-save-title">
    <div class="modal-head">
      <h2 id="modal-save-title">Save workspace</h2>
      <button class="icon-btn" data-close="modal-save" data-tooltip="Close" data-tooltip-pos="bottom" aria-label="Close"><span data-icon="x" data-size="14"></span></button>
    </div>
    <div class="save-form">
      <label for="save-name">Name</label>
      <input type="text" id="save-name" placeholder="e.g. Hindustani electric experiment" autocomplete="off">
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close="modal-save">Cancel</button>
      <button class="btn btn-primary" id="save-confirm">Save</button>
    </div>
  </div>
</div>

<!-- Modal: saved list -->
<div class="modal-bg" id="modal-saved">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-saved-title">
    <div class="modal-head">
      <h2 id="modal-saved-title">Saved workspaces</h2>
      <button class="icon-btn" data-close="modal-saved" data-tooltip="Close" data-tooltip-pos="bottom" aria-label="Close"><span data-icon="x" data-size="14"></span></button>
    </div>
    <div class="modal-body" id="saved-body"></div>
  </div>
</div>

<div class="modal-bg" id="modal-recipe-stack">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-recipe-stack-title">
    <div class="modal-head">
      <h2 id="modal-recipe-stack-title">Recipe stack</h2>
      <button class="icon-btn" data-close="modal-recipe-stack" data-tooltip="Close" data-tooltip-pos="bottom" aria-label="Close"><span data-icon="x" data-size="14"></span></button>
    </div>
    <div class="modal-body" id="recipe-stack-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Modal: browse preface lexicon -->
<div class="modal-bg" id="modal-preface">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-preface-title">
    <div class="modal-head">
      <h2 id="modal-preface-title">Aesthetic preface — browse</h2>
      <button class="icon-btn" data-close="modal-preface" data-tooltip="Close" data-tooltip-pos="bottom" aria-label="Close"><span data-icon="x" data-size="14"></span></button>
    </div>
    <div class="modal-search"><span class="search-adornment"><span data-icon="search" data-size="14"></span></span><input type="search" id="search-preface" placeholder="Search prefaces by name or description…" autocomplete="off" aria-label="Search prefaces"></div>
    <div class="modal-body" id="preface-modal-body" style="padding: var(--s5);"></div>
  </div>
</div>

<!-- Modal: asset attributions (open-source license credits) -->
<div class="modal-bg" id="modal-attributions">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-attributions-title">
    <div class="modal-head">
      <h2 id="modal-attributions-title">Asset credits</h2>
      <button class="icon-btn" data-close="modal-attributions" data-tooltip="Close" data-tooltip-pos="bottom" aria-label="Close"><span data-icon="x" data-size="14"></span></button>
    </div>
    <div class="modal-body" id="attributions-body" style="padding: var(--s5); max-height: 70vh; overflow-y: auto;">
      <p style="margin: 0 0 var(--s4); color: var(--text-2); font-size: var(--fs-body);">
        The codex uses these open-source asset libraries.
      </p>
      <table id="attributions-table" style="width: 100%; font-size: var(--fs-body); border-collapse: collapse;">
        <thead><tr style="border-bottom: 1px solid var(--text-3); text-align: left;">
          <th style="padding: var(--s2) var(--s3);">Library</th>
          <th style="padding: var(--s2) var(--s3);">Used for</th>
          <th style="padding: var(--s2) var(--s3);">License</th>
          <th style="padding: var(--s2) var(--s3);">Source</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Ask-the-engine chat dock.
     Starts `hidden` and is revealed at boot ONLY if the backend answers
     /chat/status — the page is static (GitHub Pages) and cannot hold a model
     key, so the whole feature depends on a service that may be down, off, or
     unconfigured. Rendering the bar first and failing on submit would promise
     something the page cannot check; asking first costs one request. -->
<section class="chat-dock" id="chat-dock" hidden aria-label="Ask the engine">
  <div class="chat-panel" id="chat-panel" hidden>
    <div class="chat-panel-head">
      <button class="btn btn-ghost chat-reset" id="chat-reset" type="button"><span class="btn-label">New conversation</span></button>
      <button class="btn btn-ghost chat-reset" id="chat-recover" type="button">Saved runs</button>
    </div>
    <div class="chat-log" id="chat-log" role="log" aria-live="polite" aria-relevant="additions"></div>
  </div>
  <form class="chat-bar" id="chat-form" autocomplete="off">
    <select id="chat-domain" class="btn btn-secondary" aria-label="Task">
      <option value="recipe">Create recording recipe</option>
      <option value="recipe-browse">Browse stock recipes</option>
      <option value="lyrics">New song lyrics</option>
      <option value="lyrics-edit">Edit existing lyrics</option>
    </select>
    <!-- Keep in step with CHAT_MAX_MESSAGE in mcp/chat.js (and render.yaml). The
         attribute is a courtesy that stops the field accepting text the server
         will refuse; the server bound is the real one, since nothing stops a
         caller posting to /chat directly. mcp/test.mjs asserts the two agree. -->
    <textarea class="chat-input" id="chat-input" rows="3" maxlength="5000"
           aria-label="Describe the recording you want"
           aria-describedby="chat-count-sr"
           placeholder="Describe the recording recipe you want…"></textarea>
    <!-- Filled by _chatSyncCount in src/app.js, which reads the ceiling off the
         maxlength above rather than declaring it again — so the counter cannot
         name a bound different from the one the field enforces. Stays hidden
         until the field is 70% full; an empty bar has nothing to report, and on
         a phone a permanent "0 / 5000" would cost the task picker its width. -->
    <span class="chat-count" id="chat-count" hidden aria-hidden="true"></span>
    <span class="chat-count-sr" id="chat-count-sr" role="status" aria-live="polite"></span>
    <button class="btn btn-primary chat-send" id="chat-send" type="submit"><span class="btn-label">Ask</span></button>
  </form>
</section>

<!-- Datalist for preface autocomplete; populated at boot from PREFACE_LEXICON -->
<datalist id="preface-options"></datalist>
