     most fetchers will truncate or refuse it. Everything you need is linked here, in the

         https://mcp.codexmusica.com/mcp

<meta name="theme-color" content="#ffffff">
<!-- Theme preference, resolved before the first paint (src/theme.js). -->
<!--@THEME_BOOT-->
<style>
:root {
  /* Colours, font families, shadows and the body/micro sizes come from
     src/theme.css (:root[data-theme], set by theme.js before first paint)
     and src/workbench.css; this block holds the tokens nothing overrides. */
  /* Spacing — 4px grid */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s7: 32px; --s8: 40px; --s9: 56px;
  /* Type — modular scale, weight aliases, line-height aliases */
  --fs-display-hero: 28px;     /* boot-error h2 */
  --fs-display-card: 20px;     /* card instrument name */
  --fs-display-modal: 18px;    /* modal h2 */
  --fs-title:    15px;     /* card heading */
  /* The small steps were raised one pixel each (12/11/11 -> 13/12/12).
     They carry the browsable lists — preface chips, tradition rows, room names,
     descriptor strips — which is the reading this app actually asks of a person,
     and at 11-12px that is below where the web settled for body-ish text.
     WCAG sets no pixel minimum; what it requires is that text survive a 200%
     zoom, which these do (every size is a token, every layout is flex/grid).
     16px is the industry convention for prose, but these are dense scannable
     lists rather than paragraphs, so this is a nudge toward legibility, not a
     jump to prose sizing — deliberately one step, since the type scale's whole
     job is to keep the steps distinguishable from each other. */
  --fs-caption:  13px;     /* meta info, descriptor lines, footnotes */
  --fs-code:     12px;     /* monospace descriptor token strips */
  --fs-nano:     10px;     /* status pills, family micro-labels */
  --fs-display-detail: 26px;   /* detail-pane h1 title */
  --fw-regular:  400;
  --fw-medium:   500;
  --fw-semibold: 600;
  --lh-tight:    1.25;     /* headings */
  --lh-snug:     1.4;      /* dense body */
  --lh-normal:   1.5;      /* default body */
  /* Motion — single shared vocabulary */
  --t-fast: 100ms;         /* hover, immediate feedback */
  --t-norm: 150ms;         /* state changes, click confirms */
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  /* Radius */
  --r1: 4px; --r2: 6px; --r3: 8px; --r4: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--font-body); font-size: var(--fs-body); line-height: 1.5; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button { font: inherit; color: inherit; cursor: pointer; }
input { font: inherit; color: inherit; }
ul { list-style: none; }

/* Boot: the controls below are inert until the app starts, so they are not
   shown until then; the status says what is happening instead. */
.boot-status { display: none; }
body:not(.workbench):not(.boot-failed) > .boot-status { display: flex; position: fixed; inset: 0; align-items: center; justify-content: center; color: var(--text-3); font-size: var(--fs-body); background: var(--bg); z-index: 1; }
body:not(.workbench):not(.boot-failed) > .app-bar,
body:not(.workbench):not(.boot-failed) > main.workspace { visibility: hidden; }
body.boot-failed > .app-bar { display: none; }

/* App bar */
.app-bar { position: sticky; top: 0; z-index: 30; background: var(--header-glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: var(--s3) var(--s6); display: flex; align-items: center; justify-content: space-between; gap: var(--s4); }
/* Popup menu (the card's move-to-genre list). */
.more-menu {
  position: fixed;
  z-index: 120;
  min-width: 220px;
  padding: var(--s2);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r3);
  box-shadow: var(--shadow-modal);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.more-menu[hidden] { display: none; }
.more-menu-item {
  display: flex;
  align-items: center;
  gap: var(--s3);
  width: 100%;
  min-height: 44px;
  padding: 0 var(--s3);
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--text);
  font-size: var(--fs-body);
  text-align: left;
  cursor: pointer;
}
.more-menu-item:hover:not(:disabled) { background: var(--surface-2); }
.more-menu-item:disabled { opacity: 0.4; cursor: default; }
.more-menu-item svg { color: var(--text-3); flex-shrink: 0; }
.more-menu-backdrop { position: fixed; inset: 0; z-index: 119; }

/* Buttons */
.btn {
  /* `text-decoration: none` is here for any ANCHOR that wears this class. A
     <button> never underlines; an <a> does. */
  text-decoration: none;
  padding: 8px var(--s4);
  border-radius: var(--r2);
  border: 1px solid transparent;
  background: transparent;
  font-size: var(--fs-body);
  font-weight: var(--fw-medium);
  line-height: var(--lh-snug);
  transition: background var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease),
              color var(--t-fast) var(--ease),
              transform var(--t-fast) var(--ease);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
.btn:focus-visible { outline: 2px solid var(--color-blue); outline-offset: 2px; }
.btn:active:not(:disabled) { transform: translateY(0.5px); transition-duration: 50ms; }
.btn-primary {
  border-color: var(--color-blue);
}
.btn-primary:hover { background: var(--color-blue-hover); border-color: var(--color-blue-hover); }
.btn-secondary {
  background: var(--surface);
  color: var(--text);
  border-color: var(--border-strong);
}
.btn-secondary:hover { background: var(--surface-2); border-color: var(--text-3); }
.btn-ghost { background: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-danger { color: var(--color-red); }
.btn-danger:hover { background: var(--color-red-soft); }
/* Solid-red destructive button — used inside confirmDialog for the
   "yes, delete" action. The contrast against the muted modal panel makes
   the destructive choice unmissable, the inverse of the ghost-style
   "Cancel" button next to it. */
.btn-danger-solid {
  background: var(--color-red);
  color: var(--on-accent);
  border-color: var(--color-red);
}
.btn-danger-solid:hover {
  background: var(--color-red-hover);
  border-color: var(--color-red-hover);
  color: var(--on-accent);
}
.icon-btn { width: 28px; height: 28px; padding: 0; border-radius: var(--r2); background: transparent; border: none; color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease); cursor: pointer; }
.icon-btn:hover { background: var(--surface-3); color: var(--text); }
.icon-btn svg { width: 14px; height: 14px; }
.icon-inline { display: inline-flex; align-items: center; gap: var(--s2); }
.btn svg { width: 14px; height: 14px; flex-shrink: 0; }

/* Workspace — master-detail grid (Phase 1 of layout refactor).
   Sidebar is a fixed 320px column on desktop; below 900px it becomes ordinary
   page content and the tree is the page (see MOBILE MODEL further down).
   Detail pane fills remaining width and holds the selected instrument's tabs. */
.workspace {
  margin: 0;
}

#workspace-sidebar {
  border-right: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  /* Self-contained, viewport-tall pane. It sticks just beneath the (sticky)
     app bar while the page scrolls the detail pane, so its inner regions —
     the sticky genre headers up top and the pinned recipe stack at the
     bottom — stay reachable no matter how tall the detail content grows.
     The inner #sidebar-scroll owns the actual scrolling. */
  position: sticky;
  top: var(--app-bar-height, 56px);
  height: calc(100vh - var(--app-bar-height, 56px));
  align-self: start;
  overflow: hidden;
  padding: var(--s5) var(--s4);
  gap: var(--s4);
}

/* The scrolling middle zone. min-height:0 is required for a flex child to
   shrink below its content height and actually scroll. The negative side
   margins let the scroll viewport (and its scrollbar) reach the sidebar
   edges while the re-applied padding keeps rows aligned with the fixed
   top/bottom zones — and gives the sticky genre headers a full-width
   backdrop to cover rows scrolling underneath them. */
#sidebar-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: var(--s4);
  padding: 0 var(--s4);
}

#workspace-detail {
  overflow-y: auto;
  padding: var(--s5) var(--s6) var(--s9);
}

/* Sidebar internals — Phase 2 of layout refactor. Workspace header, filter
   input, tradition-grouped compact card rows, suggest-a-staple, recipe preview. */
.ws-name-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
.ws-name { font-family: var(--font-display); font-size: var(--fs-display-card); font-weight: var(--fw-semibold); color: var(--text); margin: 0; line-height: 1.2; min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ws-name-input { font-family: var(--font-display); font-size: var(--fs-display-card); font-weight: var(--fw-semibold); color: var(--text); background: transparent; border: none; border-bottom: 1px solid var(--accent); outline: none; padding: 0 0 2px 0; flex: 1; min-width: 0; }
.ws-rename { padding: 4px; }

.sidebar-search { position: relative; }
.sidebar-search input { width: 100%; padding: 8px 10px 8px 32px; font-size: var(--fs-body); border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
.sidebar-search .search-adornment { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; display: inline-flex; }

.sb-tradition-group { display: flex; flex-direction: column; gap: var(--s1); }
.sb-tradition-group + .sb-tradition-group { margin-top: var(--s3); }
/* Genre header. It sticks to the top of the scroll zone so the genre name
   stays visible while its instruments scroll underneath (quality-of-life: you
   always know which genre you're in). The name takes the first line; the meta
   cluster (status pill, count, movers, delete) wraps to its own line beneath,
   so the name is never crushed by the controls — even with the two-glyph icon
   prefix that previously squeezed it to an ellipsis. Opaque background so
   scrolled rows don't bleed through while it's stuck. */
.sb-tradition-header { display: flex; flex-wrap: wrap; align-items: center; gap: 4px var(--s2); cursor: pointer; padding: 6px 0; user-select: none; position: sticky; top: 0; z-index: 2; background: var(--surface); }
.sb-chev { display: inline-flex; transition: transform 150ms ease; color: var(--text-3); }
.sb-tradition-group.is-collapsed .sb-chev { transform: rotate(-90deg); }
.sb-tradition-name { font-weight: var(--fw-semibold); color: var(--text); font-size: var(--fs-body); flex: 1 1 auto; min-width: 0; line-height: 1.25; overflow: hidden; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.sb-status-pill { font-size: var(--fs-nano); font-weight: var(--fw-semibold); text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 8px; border-radius: 10px; }
.sb-status-pill.primary { background: var(--color-blue); color: var(--on-accent); }
.sb-status-pill.secondary { background: var(--surface-2); color: var(--text-2); }
.sb-tradition-count { font-size: var(--fs-caption); color: var(--text-3); margin-left: 4px; }
/* Mover buttons — always visible (vs delete which only appears on hover),
   because this is the primary affordance for "reorder my groups" that
   replaces the previously-confusing drag-to-reorder. Always-visible so the
   user never has to discover or hover. Disabled at edges (first group has
   no up-arrow, last has no down-arrow). */
.sb-tradition-move {
  background: transparent;
  border: none;
  padding: 2px 3px;
  color: var(--text-3);
  cursor: pointer;
  border-radius: var(--r1);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
}
.sb-tradition-move:hover:not([disabled]) { color: var(--text); background: var(--surface-2); }
.sb-tradition-move[disabled] { opacity: 0.25; cursor: default; }
.sb-tradition-move-up { margin-left: 4px; }
.sb-tradition-move-down { margin-left: 1px; }
.sb-tradition-delete { background: transparent; border: none; padding: 2px 4px; margin-left: 2px; color: var(--text-3); cursor: pointer; border-radius: var(--r1); opacity: 0; transition: opacity var(--t-fast) var(--ease), color var(--t-fast) var(--ease), background var(--t-fast) var(--ease); display: inline-flex; align-items: center; justify-content: center; }
.sb-tradition-header:hover .sb-tradition-delete,
.sb-tradition-header:focus-within .sb-tradition-delete { opacity: 0.7; }
.sb-tradition-delete:hover { opacity: 1 !important; color: var(--color-red); background: var(--surface-2); }
.sb-tradition-header[draggable="true"] { cursor: grab; }
.sb-tradition-header[draggable="true"]:active { cursor: grabbing; }
/* The drag preview sits under the pointer and therefore ON TOP of whatever it
   is about to be dropped into, so a hairline alone is easy to miss on a phone.
   The tint fills the whole target group and stays readable around the ghost. */
.sb-tradition-group.is-drag-over {
  box-shadow: inset 0 2px 0 0 var(--accent);
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  border-radius: var(--r2);
}
.sb-tradition-group.is-drag-over .sb-tradition-header { background: transparent; }
/* Directional drop indicators for group-onto-group reorder. Cursor in the
   top half of the target → line at top (drop above). Cursor in the bottom
   half → line at bottom (drop below). The visual treatment intentionally
   matches .is-drag-over so the user gets consistent feedback whether they
   intend a card-reparent (uses is-drag-over) or a group-reorder. */
.sb-tradition-group.is-drag-over-top { box-shadow: inset 0 2px 0 0 var(--accent); }
.sb-tradition-group.is-drag-over-bottom { box-shadow: inset 0 -2px 0 0 var(--accent); }

/* ── Drag preview (Pointer Events; see "DRAG AND DROP" in app.js) ──────────
   A clone of the row, following the pointer. `pointer-events: none` is load-
   bearing: the controller resolves drop targets with elementFromPoint, and a
   hit-testable ghost would sit under the pointer and answer every query with
   itself. */
.dnd-ghost {
  position: fixed;
  left: 0;
  top: 0;
  z-index: 300;
  pointer-events: none;
  opacity: 0.85;
  border-radius: var(--r2);
  background: var(--surface);
  box-shadow: var(--shadow-modal), 0 0 0 1px var(--accent);
  transition: none;
}
/* The row stays in place, dimmed, so the tree keeps its shape while you drag
   — collapsing it would reflow every genre under the finger mid-gesture. */
.sb-card.is-dragging,
.sb-tradition-header.is-dragging { opacity: 0.4; }
/* Cursor + selection only while a drag is live, so normal text selection in
   the tree is unaffected the rest of the time. */
body.is-dnd-active { cursor: grabbing; user-select: none; -webkit-user-select: none; }
body.is-dnd-active * { cursor: grabbing !important; }
/* Suppress the iOS/Android long-press callout on the drag handles — the long
   press is our pick-up gesture. Vertical panning stays available, so a swipe
   that starts on a row still scrolls the page. */
.sb-card,
.sb-tradition-header {
  touch-action: pan-y;
  -webkit-touch-callout: none;
}
.sb-card-pin { display: inline-flex; align-items: center; justify-content: center; color: var(--text-3); margin-right: 4px; }
.sb-card.is-pinned .sb-card-pin { color: var(--accent); }

.sb-tradition-cards { display: flex; flex-direction: column; gap: 2px; }
.sb-tradition-group.is-collapsed .sb-tradition-cards { display: none; }
.sb-tradition-group.is-collapsed .sb-add-to-tradition { display: none; }

.sb-card { display: flex; align-items: center; gap: var(--s2); padding: 8px; border: none; background: transparent; border-radius: 6px; cursor: pointer; text-align: left; width: 100%; transition: background 120ms ease; }
.sb-card:hover { background: var(--surface-2); }
/* Per-card duplicate / remove cluster at the card's bottom-right. The card is a
   <button>, so the cluster is a sibling sharing one grid cell; the inline detail
   panel mobile inserts after the card auto-places into the next row. */
.sb-card-row { display: grid; grid-template-columns: minmax(0, 1fr); }
.sb-card-row > .sb-card { grid-area: 1 / 1; padding-right: 64px; }
.sb-card-actions { grid-area: 1 / 1; justify-self: end; align-self: end; display: inline-flex; gap: 2px; margin: 0 6px 6px 0; z-index: 1; }
.sb-card-action { background: transparent; border: none; padding: 0; width: 26px; height: 26px; border-radius: var(--r1); color: var(--text-3); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; opacity: 0.55; transition: opacity var(--t-fast) var(--ease), color var(--t-fast) var(--ease), background var(--t-fast) var(--ease); }
.sb-card-row:hover .sb-card-action,
.sb-card-row:focus-within .sb-card-action,
.sb-card-row > .sb-card.is-selected ~ .sb-card-actions .sb-card-action { opacity: 1; }
.sb-card-action:hover { color: var(--text); background: var(--surface-2); }
.sb-card-action.is-danger:hover { color: var(--color-red); background: var(--color-red-soft); }
.sb-card.is-selected { background: var(--family-tint, var(--surface-2)); }
.sb-card-thumb { width: 32px; height: 32px; border-radius: 6px; background: var(--family-tint, var(--surface-2)); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.sb-card-thumb svg, .sb-card-thumb img { width: 24px; height: 24px; }
.sb-card-text { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.sb-card-line1 { font-size: var(--fs-body); color: var(--text); overflow: hidden; text-overflow: ellipsis;}
.sb-card-line1 .sb-preface { font-style: italic; color: var(--accent); margin-right: 4px; }
.sb-card-line1 .sb-name { color: var(--text); }
.sb-card-line2 { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
.sb-card-line2 .sb-family { font-size: var(--fs-nano); font-weight: var(--fw-semibold); text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-3); }

.sb-add-to-tradition { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px; border: 1px dashed var(--border); border-radius: 6px; background: transparent; color: var(--text-2); font-size: var(--fs-caption); cursor: pointer; transition: border-color 120ms, color 120ms; }
.sb-add-to-tradition:hover { border-color: var(--text-3); color: var(--text); }

/* Suggest a staple — Phase 7. Sibling-tradition recommendation card. */
.sb-staple { background: var(--color-blue-tint, #eef3fb); border: 1px solid var(--color-blue-border, #cfd9e8); border-radius: 8px; padding: var(--s3); display: flex; flex-direction: column; gap: var(--s2); }
.sb-staple-head { display: flex; align-items: center; gap: 6px; }
.sb-staple-refresh { padding: 4px; color: var(--color-blue); }
.sb-staple-refresh:hover { color: var(--text); }
.sb-staple-body { font-size: var(--fs-caption); color: var(--text-2); line-height: 1.4; }
.sb-staple-body .sb-staple-name { font-style: italic; color: var(--text); font-weight: var(--fw-medium); }
.sb-staple-add { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 6px 8px; border: 1px solid var(--color-blue-border, #cfd9e8); background: var(--surface); border-radius: 6px; color: var(--color-blue); font-size: var(--fs-caption); font-weight: var(--fw-medium); cursor: pointer; transition: background 120ms; }
.sb-staple-add:hover { background: var(--color-blue-soft); }

/* Parts list grid (Phase 4 of layout refactor). Matches the screenshot row
   anatomy: thumb / PART NAME caps / variant / dot-descriptors / N options →. */
.parts-list { display: flex; flex-direction: column; }
.part-row-grid { display: grid; grid-template-columns: 48px 130px 1fr auto auto; align-items: center; gap: var(--s4); padding: var(--s3) var(--s2); border-top: 1px solid var(--border); cursor: pointer; transition: background 120ms ease; }
.part-row-grid:first-child { border-top: none; }
.part-row-grid:hover { background: var(--surface-2); }
.part-row-grid.is-editing { background: var(--surface-2); }
.part-label-cell { font-size: var(--fs-micro); font-weight: var(--fw-semibold); text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.part-variant-cell { font-size: var(--fs-body); color: var(--text); font-weight: var(--fw-medium); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.part-descriptors-cell { font-size: var(--fs-caption); color: var(--text-2); text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 320px; }
.part-options-cell { display: inline-flex; align-items: center; gap: 4px; color: var(--text-3); font-size: var(--fs-caption); white-space: nowrap; }
.part-row-grid:hover .part-options-cell { color: var(--text); }
.part-variants-grid { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--s2); padding: var(--s3) 0 var(--s2); }
.part-variants-grid .variant-chip { text-align: left; }
/* Universal cross-instrument string materials: collapsed under a part's own
   variants. Display-only grouping — every material stays reachable. */
.part-expanded { grid-column: 1 / -1; margin-top: var(--s2); border-top: 1px dashed var(--border); }
.part-expanded > summary { font-size: var(--fs-micro); font-weight: var(--fw-semibold); text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-3); cursor: pointer; padding: var(--s2) 0; }
.part-expanded > summary:hover { color: var(--text); }
.part-expanded-grid { padding-top: 0; }

/* Sidebar recipe preview (Phase 8). Live compressRichRecipe output for the
   full workspace, with char counter against the 1000-char ceiling. */
/* Pinned bottom zone — a flex sibling after the scroll region, so it stays
   anchored to the bottom of the sidebar pane and is always reachable. */
#sidebar-recipe-preview { flex: 0 0 auto; padding-top: var(--s4); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: var(--s2); background: var(--surface); }
.rp-head { display: flex; align-items: center; gap: 6px; }
.rp-head .rp-label { font-size: var(--fs-micro); font-weight: var(--fw-semibold); text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-3); flex: 1; }
.rp-head .rp-count { font-size: var(--fs-micro); font-variant-numeric: tabular-nums; color: var(--text-3); }
.rp-head .rp-count.is-amber { color: var(--color-yellow-text); }
.rp-head .rp-count.is-red { color: var(--color-red); }
.rp-text { font-family: 'JetBrains Mono', monospace; font-size: var(--fs-code); line-height: 1.5; color: var(--text-2); max-height: 200px; overflow-y: auto; word-break: break-word; padding-right: 4px; }
.rp-text::-webkit-scrollbar { width: 4px; }
.rp-text::-webkit-scrollbar-thumb { background: var(--text-4); border-radius: 2px; }
.rp-text::-webkit-scrollbar-thumb:hover { background: var(--text-3); }
.rp-text::-webkit-scrollbar-track { background: transparent; }
.rp-empty { font-style: italic; color: var(--text-3); font-size: var(--fs-caption); }
.rp-copy:hover { color: var(--text); }
.rp-open { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--text-2); font-size: var(--fs-caption); cursor: pointer; transition: border-color 120ms, color 120ms; }
.rp-open:hover { border-color: var(--text-3); color: var(--text); }
/* Undo / redo live in the recipe bar only once it is pinned to the bottom of
   the viewport (<= 899px); on desktop the app bar already carries both. */
.rp-tool { display: none; }
/* The expander, though, earns its place at every width. Expanded, this panel
   runs ~290px — the recipe body alone is capped at 200 — and it is a flex
   sibling of #sidebar-scroll, so every one of those pixels is taken straight
   off the genre tree. On a workspace with half a dozen genres that is the
   difference between seeing the roster and scrolling for it. Collapsing keeps
   the head (label, live char count, copy) and the progress bar, which is the
   part you actually watch, and drops the body and the "open full stack" link,
   which are the parts you go and look at deliberately. */
#sidebar-recipe-preview.is-collapsed .rp-text,
#sidebar-recipe-preview.is-collapsed .rp-empty,
#sidebar-recipe-preview.is-collapsed .rp-open { display: none; }
/* The glyph is chevron-down — Lucide's chevron-up is not vendored, and icon()
   returns an empty string for an unknown name rather than failing loudly — so
   "up" is this one rotated. It points UP whenever pressing it would reveal
   more. The two layouts start from opposite states (desktop opens expanded,
   the phone sheet opens collapsed), so the rotation is stated per state rather
   than as a base rule with one exception. */
.rp-expand svg { transition: transform var(--t-norm) var(--ease); }
#sidebar-recipe-preview.is-collapsed .rp-expand svg { transform: rotate(180deg); }

/* Detail pane — Phase 3 of layout refactor. Right pane shows selected card. */
.detail-view { max-width: 1100px; margin: 0 auto; }
.detail-breadcrumb-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s5); }
.detail-breadcrumb { font-size: var(--fs-micro); font-weight: var(--fw-semibold); text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-3); display: flex; align-items: center; gap: var(--s2); cursor: pointer; }
.detail-breadcrumb:hover { color: var(--text-2); }
.detail-breadcrumb-status { display: inline-flex; align-items: center; gap: 4px; color: var(--color-blue); }
.detail-breadcrumb-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.detail-breadcrumb-status.secondary { color: var(--text-3); }
.detail-actions { display: flex; gap: var(--s1); align-items: center; }
.detail-actions .icon-btn { padding: 6px; color: var(--text-2); }
.detail-actions .icon-btn:hover { color: var(--text); }
.detail-actions .icon-btn.is-danger { color: var(--color-red); }

/* Stack signature strip — Phase 2 of UI Capability Inventory Plan.
 * Renders above the detail header when 2+ cards are in the workspace.
 * Surfaces the 4 traditions nearest the workspace centroid.
 * Visual weight intentionally low — informational strip, not focal. */
.detail-stack-signature {
  display: grid;
  align-items: center;
  gap: var(--s3);
  padding: var(--s3) var(--s4);
  margin-bottom: var(--s4);
  background: var(--surface-2);
  border-radius: var(--r2);
  border: 1px solid var(--surface-3);
}
.detail-stack-signature .dss-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.detail-stack-signature .dss-label {
  font-size: var(--fs-micro);
  font-weight: var(--fw-semibold);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-3);
}
.detail-stack-signature .dss-traditions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s1);
  align-items: center;
}
.detail-stack-signature .dss-trad {
  font-size: var(--fs-caption);
  font-weight: var(--fw-medium);
  color: var(--text-2);
  background: var(--surface-1, var(--surface));
  border: 1px solid var(--surface-3);
  border-radius: var(--r1);
  padding: 3px 8px;
  cursor: pointer;
  transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
}
.detail-stack-signature .dss-trad:hover {
  color: var(--text);
  background: var(--surface);
}
.detail-stack-signature .dss-empty {
  font-size: var(--fs-caption);
  font-style: italic;
  color: var(--text-3);
}
.detail-stack-signature .dss-browse {
  font-size: var(--fs-caption);
  font-weight: var(--fw-medium);
  color: var(--text-2);
  background: transparent;
  border: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  border-radius: var(--r1);
  transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
}
.detail-stack-signature .dss-browse:hover {
  color: var(--text);
  background: var(--surface);
}

.detail-header { display: grid; gap: var(--s4); align-items: start; margin-bottom: var(--s4); }
.detail-thumb { width: 80px; height: 80px; border-radius: 10px; background: var(--family-tint, var(--surface-2)); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.detail-thumb svg, .detail-thumb img { width: 56px; height: 56px; }
.detail-title-block { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.detail-title { font-family: var(--font-display); font-weight: var(--fw-semibold); line-height: 1.2; color: var(--text); }
.detail-title .detail-preface { font-style: italic; color: var(--accent); font-weight: var(--fw-regular); margin-right: 8px; }
/* Primary-card marker — small ANCHOR pill in the detail-title row.
   Surfaces when the displayed card is _determinePrimaryCard(app.cards).
   The sidebar's PRIMARY pill marks the tradition group at the tree level;
   this marks the card at the detail-pane level so the semantic travels
   with the user when they navigate into a card. Soft-blue ties it to the
   tradition family without competing with the instrument name. */
.detail-title .detail-primary-marker {
  display: inline-block;
  vertical-align: middle;
  margin-left: var(--s3);
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--color-blue-soft);
  color: var(--color-blue);
  font-family: var(--font-body);
  font-size: var(--fs-micro);
  font-weight: var(--fw-semibold);
  letter-spacing: 0.08em;
  line-height: 1.4;
  cursor: help;
}
.detail-subtitle { display: flex; align-items: center; gap: var(--s2); font-size: var(--fs-body); color: var(--text-2); }
.detail-subtitle .detail-family { font-size: var(--fs-micro); font-weight: var(--fw-semibold); text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-3); }
.detail-subtitle .detail-sep { color: var(--text-4); }

.detail-trait-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--s5); }
.trait-pill { display: inline-flex; align-items: center; padding: 4px 10px; background: var(--surface-2); border-radius: 12px; font-size: var(--fs-caption); color: var(--text-2); }

.detail-tab-bar { align-items: center; gap: var(--s5); border-bottom: 1px solid var(--border); margin-bottom: var(--s4); }
.detail-tab { display: inline-flex; align-items: center; border: none; background: transparent; cursor: pointer; color: var(--text-2); font-weight: var(--fw-medium); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 120ms, border-color 120ms; }
.detail-tab:hover { color: var(--text); }
.detail-tab.is-active { color: var(--text); font-weight: var(--fw-semibold); border-bottom-color: var(--accent); }

.detail-tab-content { min-height: 200px; }
.detail-tab-content > .composer-section:first-child { padding-top: 0; border-top: none; }
.detail-tab-content > .composer-section .composer-section-title { display: none; }

/* ===========================================================================
   MOBILE MODEL (<= 899px): ONE SCROLLING PAGE.

   The genre tree IS the page. Genres collapse inline (the .is-collapsed
   machinery is the same one the desktop sidebar uses), and tapping an
   instrument mounts #detail-view directly beneath that row — see
   _detailAnchorFor() in app.js. There is no drawer, no second pane and no
   master-detail split: on a phone those cost a tap and a mode each, and the
   thing you came to edit is never on screen at the same time as the thing
   you tapped.

   Everything the desktop can author is authorable here: the tree carries the
   roster + genre operations, the inline detail carries prefaces, variants,
   parts, environment and signal chain, and the workbench header and its More
   menu carry the rest.
   =========================================================================== */
@media (max-width: 899px) {
  /* Grid -> flow. The sidebar and the detail host stack in DOM order. */

  /* The pane stops being a viewport-tall sticky column with its own scroll
     region and becomes ordinary page content. Every one of these declarations
     undoes a desktop rule that only makes sense for a fixed-height column. */
  #workspace-sidebar {
    position: static;
    height: auto;
    overflow: visible;
    /* Structural backstop: nothing absolutely positioned inside the tree may
       re-open the layout viewport (a hover tooltip on a right-aligned button
       once did exactly that). `clip` rather than `hidden` — `hidden` would make
       this a scroll container and break the sticky genre headers. Declared with
       the shorthand above so it does not depend on block ordering. */
    overflow-x: clip;
    border-right: none;
    padding: var(--s3) var(--s3) 0;
    gap: var(--s3);
  }
  #sidebar-scroll {
    overflow: visible;   /* the PAGE scrolls now, not this box */
    min-height: 0;
    padding: 0;
  }

  /* Genre headers stick under the app bar rather than to the top of a pane
     that no longer scrolls. */
  .sb-tradition-header { top: var(--app-bar-height, 56px); background: var(--bg); }

  /* `html, body { height: 100% }` is the desktop app-shell assumption: the
     PAGE never scrolls there, the detail pane scrolls inside a viewport-tall
     frame. Here the page is the scroller, and a fixed-height body silently
     breaks `position: sticky` on the app bar — sticky is clamped to its
     containing block, so once you scrolled past ~844px the bar (and with it
     every action) slid off the top and never came back. */
  html, body { height: auto; min-height: 100%; }

  /* Clearance for the pinned recipe bar. #workspace-detail holds only the
     empty state once cards exist (the per-card detail mounts inside the
     tree), so both containers need it — whichever is the non-empty one. */
  #workspace-sidebar { padding-bottom: calc(var(--s6) + var(--recipe-bar-height, 64px)); }
  #workspace-detail  { padding: 0 var(--s3) calc(var(--s8) + var(--recipe-bar-height, 64px)); }
}

/* Empty state (the boot-error screen, _renderBootError in src/app.js) */
.empty-state { text-align: center; padding: var(--s9) var(--s5) var(--s7); max-width: 480px; margin: 0 auto; }
.empty-state h2 { font-family: var(--font-display); font-size: var(--fs-display-hero); font-weight: var(--fw-semibold); letter-spacing: -0.02em; margin-bottom: var(--s2); color: var(--text); font-variation-settings: "SOFT" 50, "opsz" 60; }
.empty-state p { color: var(--text-2); margin: 0 auto var(--s6); line-height: var(--lh-normal); }
.empty-state-actions { display: flex; gap: var(--s2); justify-content: center; flex-wrap: wrap; }

/* Pin button active state — when the card is pinned, the icon fills with
   the blue accent color. Mirrors the active treatment of other icon-toggles. */
.icon-btn.is-active { color: var(--color-blue); }
.icon-btn.is-active:hover { color: var(--color-blue); background: var(--color-blue-soft); }
/* Pin specifically — when active, fill the pin head (second path of the
   Lucide pin icon) so the toggled state reads as a "stuck-in" pushpin.
   The first path (M12 17v5) is the post and stays stroke-only. */
.icon-btn.is-active svg path:nth-of-type(2) { fill: currentColor; }
/* Destructive icon-buttons — render red at rest, not just on hover. Parallel
   to .btn-danger for text buttons; applied to trash/delete icon buttons so
   the destructive intent is visible at a glance instead of revealed on hover. */
.icon-btn.is-danger { color: var(--color-red); }
.icon-btn.is-danger:hover { color: var(--color-red); background: var(--color-red-soft); }

/* Signature state */
/* Family identity is shown as a small colored dot + tinted family name,
   replacing the previous icon approach. Color is set via the inline
   --family-color custom property (one of the 11 FAMILY_COLORS hues set
   in bottom-template JS); the dot uses it directly, the text uses it at
   a slightly desaturated rendering via opacity to keep the card calm. */

/* Composer state */

.composer-section { padding: var(--s5) 0; border-bottom: 1px solid var(--border); }
.composer-section:last-child { border-bottom: none; }
.composer-section-title { font-size: var(--fs-micro); font-weight: var(--fw-semibold); text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-3); margin-bottom: var(--s4); }
.composer-section-title-aside { font-weight: var(--fw-regular); text-transform: none; letter-spacing: 0; color: var(--text-3); }

/* Preface section — aesthetic claim, one layer above the brick list */
/* Inline SVG icons — no font dependency, works in sandboxed iframes
   and offline. Replaces former Material Symbols ligature approach. */
.icon-svg {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  vertical-align: middle;
  user-select: none;
  pointer-events: none;
  color: currentColor;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.preface-section .preface-row { display: flex; gap: var(--s3); align-items: center; margin-bottom: var(--s2); }
.preface-input-wrap { position: relative; flex: 1; display: flex; align-items: center; }
.preface-input-wrap .preface-input { flex: 1; padding-right: 32px; }
/* Suppress the native datalist arrow that some Chrome versions still render —
   we have our own custom arrow that actually opens a useful popup. !important
   because the user-agent stylesheet's specificity wins otherwise. */
.preface-input::-webkit-calendar-picker-indicator,
.preface-input::-webkit-list-button {
  display: none !important;
  opacity: 0;
  width: 0;
  height: 0;
  pointer-events: none;
  -webkit-appearance: none;
  appearance: none;
}
.preface-input { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font-family: var(--font-mono); font-size: var(--fs-body); }
.preface-input:focus { outline: none; border-color: var(--color-blue); box-shadow: 0 0 0 2px var(--color-blue-soft); }
.preface-clear { padding: 4px 10px; font-size: var(--fs-title); line-height: 1; }
.preface-browse { padding: 6px 12px; font-size: var(--fs-caption); }
.preface-hint { font-size: var(--fs-micro); color: var(--text-3); line-height: 1.5; min-height: 16px; }
.preface-hint-empty { font-style: italic; color: var(--text-3); }
/* Reachability fan — chip strip showing nearby-reachable prefaces. Renders
   below the preface input + hint. Each chip is a quick-pick that fires
   commitPrefaceChange, routing through the inverse algorithm. The current
   preface (if it's in the top 7) carries the .selected + .is-current
   modifier and inherits the card's family color for the tint, reinforcing
   identity continuity with the card's left-edge accent stripe. */
.preface-fan {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: var(--s3);
}
.preface-fan-chip { font-family: var(--font-mono); font-size: var(--fs-micro); cursor: pointer; }
.preface-fan-chip.is-current {
  background: var(--family-color, var(--text));
  border-color: var(--family-color, var(--text));
}

/* Shifts panel — explanation of the most recent inverse-driven configuration
   shift on a card. Surfaces the data captured in inverseConfigureForPreface
   so users can see WHY each axis swapped to its new value: every change row
   shows the from→to label plus the specific target tokens this axis swap
   uniquely contributed. Mounted below the reachability fan in the preface
   section. Persists until manually dismissed via × or replaced on the next
   inverse run. Session-only state — not saved with the workspace. */
.preface-shifts-panel {
  margin-top: var(--s3);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  padding: var(--s3);
  font-size: var(--fs-micro);
}
.preface-shifts-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--s2);
}
.preface-shifts-title { font-weight: var(--fw-medium); color: var(--text-2); }
.preface-shifts-close {
  background: transparent;
  border: 0;
  color: var(--text-3);
  cursor: pointer;
  padding: 2px;
  border-radius: var(--r1);
  display: inline-flex;
  align-items: center;
}
.preface-shifts-close:hover { color: var(--text); background: var(--surface-3); }
.preface-shifts-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}
.preface-shifts-row { display: flex; flex-direction: column; gap: 3px; }
.preface-shifts-axis { color: var(--text-2); }
.preface-shifts-axis-label { font-weight: var(--fw-medium); }
.preface-shifts-from { color: var(--text-3); }
.preface-shifts-tokens { display: flex; flex-wrap: wrap; gap: 4px; }
.preface-shifts-token {
  font-family: var(--font-mono);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 5px;
  color: var(--text);
  font-size: var(--fs-code);
}
.preface-shifts-tokens-empty { font-style: italic; color: var(--text-3); font-size: var(--fs-micro); }

/* UpSet plot — descriptor-intersection visualization in the recipe-stack
   modal at 4+ cards. SVG-based, hand-rolled, no dependencies. Bars and
   dots use existing palette tokens; per-set dot color comes from the
   card's FAMILY_COLORS lookup (set inline on each circle), reinforcing
   the identity language used by the card left-edge accent stripes. */
.upset-section {
  margin-top: var(--s5);
  padding-top: var(--s4);
  border-top: 1px solid var(--border);
}
.upset-section-title {
  font-size: var(--fs-caption);
  font-weight: var(--fw-medium);
  color: var(--text-2);
  margin-bottom: var(--s3);
}
.upset-svg {
  max-width: 100%;
  height: auto;
  display: block;
}
.upset-bar {
  transition: opacity var(--t-fast) var(--ease);
}
.upset-col:hover .upset-bar { opacity: 0.75; }
.upset-empty {
  color: var(--text-3);
  font-style: italic;
  font-size: var(--fs-caption);
  margin: 0;
}
.upset-truncation-note {
  font-size: var(--fs-micro);
  color: var(--text-3);
  font-style: italic;
  margin: var(--s2) 0 0;
}

/* Signature head: preface chip — italic distinguishes from instrument name.
   Color inherits from parent; the dedup-cascade animation in Phase 6 will
   wash this element in soft blue when the rule fires. */

/* Chips — for variant selection */
.chip { padding: 5px 10px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-2); font-size: var(--fs-caption); font-weight: var(--fw-medium); transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease); line-height: 1.3; }
.chip:hover { border-color: var(--text-3); color: var(--text); }
.chip.selected { background: var(--text); color: var(--surface); border-color: var(--text); }
/* Variant-picker chips — wider than a plain chip, with inline descriptor
   tokens beneath the variant name. The descriptors are color-coded: tokens
   already in the card's descriptor stack are de-emphasized (kept), tokens
   the swap would ADD are normal weight and pop on hover, signaling the
   delta-effect of clicking. Replaces the previous title="..." browser
   tooltip with always-visible inline preview. */
.variant-chip { padding: 6px 10px; border-radius: var(--r2); text-align: left; max-width: 320px; }
.variant-chip .variant-chip-name { display: block; font-size: var(--fs-caption); font-weight: var(--fw-medium); }
.variant-chip .variant-chip-descrs { display: flex; flex-wrap: wrap; gap: 3px 6px; margin-top: 3px; }
.variant-chip .variant-chip-descr { font-size: var(--fs-micro); line-height: 1.2; }
.variant-chip .variant-chip-descr.is-kept { color: var(--text-4); }
.variant-chip .variant-chip-descr.is-new { color: var(--text-3); }
/* is-lost: descriptor in current variant but not in candidate — the swap
   would remove it. Strikethrough + warm-decay color so the user sees
   what disappears alongside what's gained. Never appears on the selected
   chip (whose current === candidate). */
.variant-chip .variant-chip-descr.is-lost {
  color: var(--text-4);
  text-decoration: line-through;
  text-decoration-color: var(--text-3);
  text-decoration-thickness: 1px;
}
.variant-chip:hover .variant-chip-descr.is-new { color: var(--color-blue); font-weight: var(--fw-medium); }
.variant-chip:hover .variant-chip-descr.is-lost { color: var(--text-3); }
.variant-chip.selected .variant-chip-descr.is-kept,
.variant-chip.selected .variant-chip-descr.is-new { color: var(--surface); opacity: 0.7; }
.chip-block { padding: 8px var(--s3); border-radius: var(--r2); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: var(--fs-body); font-weight: var(--fw-medium); transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); text-align: left; line-height: 1.35; }
.chip-block:hover { border-color: var(--text-3); }
.chip-block.selected { background: var(--text); color: var(--surface); border-color: var(--text); }
.chip-block .chip-block-sub { display: block; font-size: var(--fs-micro); font-weight: var(--fw-regular); color: var(--text-3); margin-top: 2px; font-family: var(--font-mono); letter-spacing: -0.005em; }
.chip-block.selected .chip-block-sub { color: color-mix(in srgb, var(--surface) 72%, transparent); }

/* Environment items */
.env-options { margin-top: var(--s3); padding-top: var(--s3); grid-column: 1 / -1; display: flex; flex-direction: column; gap: var(--s1); }

/* Chain visual */
.chain-flow { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; }
.chain-stage { padding: var(--s2) 6px; border: 1px solid var(--border); border-radius: var(--r1); background: var(--surface-2); cursor: pointer; transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease); display: flex; flex-direction: column; align-items: stretch; gap: 2px; min-width: 0; text-align: left; }
.chain-stage:hover { border-color: var(--text-3); background: var(--surface); }
.chain-stage.set { background: var(--surface); border-color: var(--border-strong); }
.chain-stage.editing { border-color: var(--text); background: var(--surface); box-shadow: 0 0 0 1px var(--text); }
.chain-stage-label { font-size: var(--fs-micro); font-weight: var(--fw-semibold); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); }
.chain-stage-value { font-size: var(--fs-micro); color: var(--text); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.chain-stage-value.empty { color: var(--text-3); font-style: italic; }
.chain-edit-panel { margin-top: var(--s3); padding: var(--s4); background: var(--surface-2); border-radius: var(--r2); border: 1px solid var(--border); }
.chain-edit-title { font-size: var(--fs-caption); font-weight: var(--fw-semibold); color: var(--text-2); margin-bottom: var(--s2); }
.chain-edit-hint { font-size: var(--fs-micro); color: var(--text-3); margin-bottom: var(--s3); }
.chain-edit-options { display: flex; flex-direction: column; gap: var(--s1); }
.chain-family-header { margin: 10px 2px 2px; font-size: var(--fs-micro); font-weight: var(--fw-semibold); letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.55; }

/* Inline option filter (tuning / room / chain expanded pickers) + collapsible clusters */
.inline-filter { display: flex; align-items: center; gap: 6px; margin-bottom: var(--s2); }
.inline-filter-icon { display: inline-flex; color: var(--text-3); }
.inline-filter-input { flex: 1; min-width: 0; padding: 5px 8px; border: 1px solid var(--border-strong); border-radius: var(--r2); font-size: var(--fs-caption); background: var(--surface); }
.inline-filter-input:focus { outline: none; border-color: var(--color-blue); box-shadow: 0 0 0 2px var(--color-blue-soft); }
.inline-filter-count { font-size: var(--fs-micro); color: var(--text-3); white-space: nowrap; font-family: var(--font-mono); }
.env-cluster-head { display: flex; align-items: center; gap: 6px; width: 100%; background: none; border: none; cursor: pointer; padding: var(--s3) 0 4px; text-align: left; }
.env-cluster-head:hover .env-cluster-name { color: var(--text); }
.env-cluster-chevron { display: inline-flex; color: var(--text-3); transition: transform var(--t-fast) var(--ease); }
.env-cluster.collapsed .env-cluster-chevron { transform: rotate(-90deg); }
.env-cluster.collapsed .env-cluster-items { display: none; }
.env-cluster-name { font-size: var(--fs-micro); font-weight: var(--fw-semibold); text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); }
.env-cluster-count { font-size: var(--fs-micro); color: var(--text-3); font-family: var(--font-mono); }
.env-cluster-items { display: flex; flex-direction: column; gap: var(--s1); }

/* Card actions footer */
/* Drift suggestions panel */
.drift-panel { margin-top: var(--s4); padding: var(--s4); background: var(--surface-2); border-radius: var(--r3); border: 1px solid var(--border); }
.drift-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--s3); gap: var(--s3); flex-wrap: wrap; }
.drift-head-label { font-size: var(--fs-caption); color: var(--text-2); }
.drift-head-label svg { color: var(--color-blue); flex-shrink: 0; }
.drift-head-actions { display: flex; gap: var(--s2); }
.drift-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--s2); }
.drift-card { padding: var(--s3); border: 1px solid var(--border); border-radius: var(--r2); background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
.drift-card-axis { font-size: var(--fs-micro); font-weight: var(--fw-semibold); text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-blue); }
.drift-card-value { font-size: var(--fs-caption); font-weight: var(--fw-medium); color: var(--text); line-height: 1.3; }
.drift-card-descr { font-family: var(--font-mono); font-size: var(--fs-micro); color: var(--text-3); flex: 1; line-height: 1.5; letter-spacing: -0.005em; }
.drift-card-walk { padding: 5px var(--s2); font-size: var(--fs-micro); font-weight: var(--fw-medium); border: 1px solid var(--border-strong); background: var(--surface); border-radius: var(--r1); align-self: flex-start; transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); }
.drift-card-walk:hover { background: var(--text); color: var(--surface); border-color: var(--text); }

/* Stack panel */
.stack-panel { margin-top: var(--s4); padding: var(--s4); background: var(--surface-2); border-radius: var(--r3); border: 1px solid var(--border); }
.stack-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s3); flex-wrap: wrap; }
.stack-head-label { font-size: var(--fs-caption); font-weight: var(--fw-semibold); color: var(--text); }
.stack-format { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r1); padding: 2px; }
.stack-format button { padding: 3px 8px; border-radius: 3px; border: none; background: transparent; font-size: var(--fs-micro); font-weight: var(--fw-medium); color: var(--text-3); transition: all var(--t-fast) var(--ease); }
.stack-format button.active { background: var(--text); color: var(--surface); }
.stack-format button:not(.active):hover { color: var(--text); }
.stack-text { font-family: var(--font-mono); font-size: var(--fs-caption); line-height: 1.7; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r2); padding: var(--s3); max-height: 240px; overflow-y: auto; word-break: break-word; letter-spacing: -0.005em; }
.stack-actions { display: flex; gap: var(--s2); margin-top: var(--s3); }

/* Modal */
.modal-bg { position: fixed; inset: 0; -webkit-backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center; z-index: 100; padding: var(--s5); }
.modal-bg.open { display: flex; }
.modal { border-radius: var(--r4); box-shadow: var(--shadow-modal); width: 100%; max-width: 720px; max-height: calc(100vh - var(--s8)); display: flex; flex-direction: column; overflow: hidden; transform: scale(0.96); opacity: 0; transition: transform var(--t-norm) var(--ease-out), opacity var(--t-norm) var(--ease-out); }
.modal-bg.open .modal { transform: scale(1); opacity: 1; }
.modal-empty { text-align: center; padding: var(--s7) var(--s5); color: var(--text-3); }
.modal-empty svg { margin-bottom: var(--s3); }
.modal-empty p { font-size: var(--fs-caption); margin: 0; }
/* Empty-state for picker/list bodies — same role as .modal-empty but
   plain text only, no icon. Used by loading states and "no matches"
   messages in pickers, similarity drill-downs, and the recipe-stack
   modal body. Add .is-italic for the recipe-stack variant where the
   message reads as a tone-down rather than a label. */
.empty-msg { color: var(--text-3); padding: var(--s5); text-align: center; }
.empty-msg.is-italic { font-style: italic; }
/* Inline italic muted — used for "(not set)" placeholders and short
   "Nothing configured yet" inline messages where italic carries the
   "this isn't real content" cue. Applied to spans/inline contexts; the
   block-level analog is .empty-msg.is-italic. */
.muted-italic { color: var(--text-3); font-style: italic; }
/* Small uppercase section labels — micro size, semibold, tracked.
   Used to introduce sub-sections inside picker drill-downs ("Closest
   on", etc.). */
.label-micro-cap { font-size: var(--fs-micro); font-weight: var(--fw-semibold); text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); margin-bottom: 4px; margin-top: var(--s2); }
.modal-head { padding: var(--s4) var(--s5); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
.modal-head h2 { font-family: var(--font-display); font-size: var(--fs-display-modal); font-weight: var(--fw-semibold); letter-spacing: -0.005em; font-variation-settings: "SOFT" 50, "opsz" 30; }
.modal-search { padding: var(--s3) var(--s5); border-bottom: 1px solid var(--border); position: relative; }
.modal-search input { width: 100%; padding: 8px var(--s3) 8px var(--s7); border: 1px solid var(--border-strong); border-radius: var(--r2); font-size: var(--fs-body); background: var(--surface); transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease); }
.modal-search input:focus { outline: none; border-color: var(--color-blue); box-shadow: 0 0 0 2px var(--color-blue-soft); }
.modal-search .search-adornment { position: absolute; left: calc(var(--s5) + var(--s3)); top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; display: inline-flex; }
.modal-search .search-adornment svg { width: 14px; height: 14px; }
.modal-body { overflow-y: auto; flex: 1; padding: var(--s5); }
.modal-foot { padding: var(--s3) var(--s5); border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: var(--s2); background: var(--surface-2); }

/* Preface browse modal — categorized, collapsible, searchable */
.preface-toolbar { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s4); flex-wrap: wrap; }
.preface-toolbar-count { font-size: var(--fs-caption); color: var(--text-3); }
.preface-toolbar-actions { display: flex; gap: var(--s2); }
.preface-toolbar-actions button { font-size: var(--fs-micro); color: var(--text-2); padding: 3px 9px; border: 1px solid var(--border-strong); border-radius: var(--r2); background: var(--surface); transition: border-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
.preface-toolbar-actions button:hover { border-color: var(--text-3); color: var(--text); }
.preface-recent { margin-bottom: var(--s4); }
.preface-recent-label, .preface-cat-title { font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); font-weight: var(--fw-semibold); }
.preface-recent-items, .preface-cat-items { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s3); }
.preface-cat { margin-bottom: var(--s2); border-top: 1px solid var(--border); padding-top: var(--s3); }
.preface-cat:first-child { border-top: none; padding-top: 0; }
.preface-cat-head { display: flex; align-items: center; gap: var(--s2); width: 100%; cursor: pointer; padding: 3px 0; background: none; border: none; text-align: left; }
.preface-cat-head:hover .preface-cat-title { color: var(--text); }
.preface-cat-chevron { display: inline-flex; color: var(--text-3); transition: transform var(--t-fast) var(--ease); }
.preface-cat.collapsed .preface-cat-chevron { transform: rotate(-90deg); }
.preface-cat.collapsed .preface-cat-items { display: none; }
.preface-cat-count { font-size: var(--fs-micro); color: var(--text-3); font-weight: var(--fw-regular); font-family: var(--font-mono); }
.preface-empty { color: var(--text-3); font-style: italic; padding: var(--s5) 0; text-align: center; }

/* Confirm dialog — compact modal for destructive-action confirmation. Smaller
   max-width than the full modals (which run wide for picker grids), action
   row at bottom, message body. Built dynamically by confirmDialog() in the
   bottom-template JS; replaces native confirm() which browsers can suppress. */
.confirm-dialog { max-width: 440px; }
.confirm-dialog-body { padding: var(--s4) var(--s5) var(--s5); }
.confirm-dialog-msg { margin: 0 0 var(--s5); color: var(--text-2); font-size: var(--fs-body); line-height: 1.5; }
.confirm-dialog-actions { display: flex; justify-content: flex-end; gap: var(--s2); }

/* Saved list */
.saved-grid { display: flex; flex-direction: column; gap: var(--s2); }
.saved-item { padding: var(--s3) var(--s4); border: 1px solid var(--border); border-radius: var(--r2); background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
.saved-name { font-size: var(--fs-body); font-weight: var(--fw-medium); }
.saved-meta { font-size: var(--fs-micro); color: var(--text-3); margin-top: 2px; }
.saved-actions { display: flex; gap: var(--s1); }

/* Save dialog input */
.save-form { padding: var(--s5); }
.save-form label { display: block; font-size: var(--fs-micro); font-weight: var(--fw-semibold); text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); margin-bottom: 6px; }
.save-form input { width: 100%; padding: 8px var(--s3); border: 1px solid var(--border-strong); border-radius: var(--r2); font-size: var(--fs-body); }
.save-form input:focus { outline: none; border-color: var(--color-blue); box-shadow: 0 0 0 2px var(--color-blue-soft); }

/* Toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%) translateY(8px); background: var(--text); color: var(--surface); padding: 8px var(--s4); border-radius: var(--r2); font-size: var(--fs-caption); font-weight: var(--fw-medium); box-shadow: var(--shadow-modal); opacity: 0; transition: opacity var(--t-norm) var(--ease), transform var(--t-norm) var(--ease); pointer-events: none; display: inline-flex; align-items: center; gap: var(--s2); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast svg { width: 14px; height: 14px; flex-shrink: 0; }
.toast-success { background: var(--color-green); }
.toast-error   { background: var(--color-red); }

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border: 2px solid transparent; background-clip: padding-box; border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-strong); background-clip: padding-box; }

/* ============================================================================
   RESPONSIVE TIERS

   THE MODEL below 900px is one scrolling page (see "MOBILE MODEL" above the
   .workspace rules): the genre tree is the page, genres collapse inline, and
   the instrument detail mounts under the row that opened it.

   That model is what sizes the app bar. The previous revision kept all eight
   desktop controls and made them fit — a horizontal scroll strip of unlabelled
   icon squares. It fit, and it was unusable: seven glyphs with no words, one of
   which ("Traditions") was the only way to add a genre. The controls are now
   split by how often a phone needs them instead:

     app bar      + Genre, + Instrument   the two authoring entry points, both
                                          with a real word on them
     recipe bar   undo, redo, copy        pinned to the bottom, thumb-reachable,
                                          on screen at every scroll position
     More menu    saved, credits          session-level, not per-edit

   Every desktop capability is reachable — nothing is dropped, and no capability
   depends on a control that is `display: none` at that width. check_mobile_layout.js
   asserts this per capability rather than per button id.

   TIERS — the same three width literals this stylesheet already used:
     899   compact   the width the workspace collapses to one column
     700   phone     the narrowest header and modal tier
     599   micro     legibility floor + one-hand detail-header layout

   TOUCH SIZING IS NOT GATED ON `pointer: coarse`. It used to be, which meant a
   narrow desktop WINDOW got the phone layout with 28px targets — the emulation
   flag, not the layout, decided ergonomics. Below 900px the layout is the phone
   layout, so it gets phone target sizes unconditionally.

   DESKTOP: every rule below is inside a max-width query — nothing here can
   match at >= 900px.
   ========================================================================= */


/* ===========================================================================
   TIER 1 — compact (<= 899px): tablet + phone
   =========================================================================== */
@media (max-width: 899px) {


  /* --- App bar ---------------------------------------------------------- */
  .app-bar { padding: var(--s2) var(--s3); gap: var(--s2); }
  .app-bar .icon-btn { flex: none; }

  /* Undo/redo are re-exposed in the pinned recipe bar by proxy controls that
     forward their click to the buttons hidden here, so there is still exactly
     one click handler per action (src/workbench.css shows #btn-save in the
     workbench header). */
  #btn-undo, #btn-redo, #btn-attributions, #btn-saved, #btn-save { display: none; }

  /* --- Inline instrument detail ------------------------------------------
     #detail-view mounts inside .sb-tradition-cards, directly after the card
     that opened it. It reads as that row expanding, not as a second pane. */
  #sidebar-traditions #detail-view {
    max-width: none;
    margin: var(--s1) 0 var(--s3);
    padding: var(--s3);
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--family-color, var(--color-blue));
    border-radius: var(--r2);
  }
  #sidebar-traditions #detail-view .detail-breadcrumb-row { margin-bottom: var(--s3); }
  /* The breadcrumb names the genre you are already sitting inside. Its action
     cluster (duplicate / pin / remove) is the half worth keeping. */
  #sidebar-traditions #detail-view .detail-breadcrumb { display: none; }
  #sidebar-traditions #detail-view .detail-actions { margin-left: auto; }
  /* The row that opened the panel stays visually attached to it. */
  .sb-card.is-selected { position: relative; z-index: 1; }

  /* --- Card tab row ------------------------------------------------------
     Intrinsically-sized tabs in a scrolling row, so no label breaks mid-word
     inside the narrow inline panel. `overflow-y: hidden` is required — with
     `overflow-x: auto` alone, overflow-y computes to auto and clips the
     active underline. */
  .detail-tab-bar {
    gap: var(--s4);
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
    scroll-padding-inline: var(--s4);
    scrollbar-width: none;
    -ms-overflow-style: none;
    border-bottom: none;
    box-shadow: inset 0 -1px 0 var(--border);
  }
  .detail-tab-bar::-webkit-scrollbar { width: 0; height: 0; display: none; }
  .detail-tab-bar :focus-visible { outline-offset: -2px; }
  .detail-tab { flex: none; margin-bottom: 0; }

  /* --- Recipe: pinned bottom sheet ---------------------------------------
     Was the bottom zone of a viewport-tall sidebar, which on a phone meant it
     lived at the end of a drawer. Now it is fixed to the bottom edge: the
     char count is always in view while you edit, and Copy / Undo / Redo are
     one thumb-tap from any scroll position. Tapping the head expands it. */
  #sidebar-recipe-preview {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 60;
    padding: var(--s2) var(--s3) calc(var(--s2) + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border);
    box-shadow: var(--shadow-2);
    gap: var(--s2);
  }
  #sidebar-recipe-preview:empty { display: none; }
  .rp-head { gap: var(--s1); }
  /* The label carried `flex: 1`; with it hidden the count takes over pushing
     the tool cluster to the right edge. */
  .rp-head .rp-label { display: none; }
  .rp-head .rp-count { margin-right: auto; }
  .rp-tool, .rp-expand { display: inline-flex; }
  /* Collapsed: head + progress only. The body is the expanded half. */
  #sidebar-recipe-preview .rp-text,
  #sidebar-recipe-preview .rp-open { display: none; }
  #sidebar-recipe-preview.is-expanded .rp-text { display: block; max-height: 40vh; }
  #sidebar-recipe-preview.is-expanded .rp-open { display: flex; }
  /* This sheet opens CLOSED, the inverse of the desktop panel, so its resting
     chevron is the flipped one — it points up because pressing it reveals more.
     Stated here rather than as a base rule precisely because the two layouts
     disagree about which state is the default. */
  .rp-expand svg { transform: rotate(180deg); }
  #sidebar-recipe-preview.is-expanded .rp-expand svg { transform: rotate(0deg); }

  /* The stack-signature strip is dropped on mobile. It is a three-column
     desktop grid (info | browse) that reflows to stacked
     rows at this width, costing ~40% of the first screenful of the panel
     before a single editable control — and it is read-only context, not an
     authoring surface. Authoring parity is unaffected: roster, genres,
     prefaces, variants, parts, environment and signal chain are all still
     here. What goes with it is the nearest-traditions "Browse near" jump;
     the same traditions remain reachable through the Traditions browser. */
  .detail-stack-signature { display: none; }

  /* The toast is fixed at `bottom: var(--s5)`, which is now underneath the
     pinned recipe bar — it covered Undo/Redo/Copy for its whole 3s lifetime.
     Sit it on top of the bar instead. */

  /* --- Hover tooltips are dead weight here, and they were widening the page -
     `[data-tooltip]::after` is an always-rendered, `white-space: nowrap`,
     absolutely-positioned bubble kept at opacity 0 until :hover. A touch
     device has no hover, so it could never be seen — but it is still laid
     out, and `data-tooltip-pos="left"` (which the tradition mover/delete
     buttons ask for) has no implementation, so those bubbles render
     centred-above and spill past the right edge. The desktop sidebar is
     `overflow: hidden` and clipped them; this layout scrolls the page
     instead, so a 133px bubble on a right-aligned 44px button pushed the
     document to 468px and Chrome scaled the whole app to 83%.

     Every control that carries data-tooltip also carries aria-label, so the
     accessible name is unaffected. */
  [data-tooltip]::after { content: none; }
  /* --- Touch target sizing (unconditional at this width — see header) ----- */
  .icon-btn { min-width: 44px; min-height: 44px; }
  .app-bar .icon-btn { width: 44px; height: 44px; }
  .sb-card { min-height: 44px; }
  .sb-card-row > .sb-card { padding-right: 96px; }
  .sb-card-action { width: 44px; height: 44px; opacity: 1; }
  .sb-tradition-header { min-height: 44px; }
  .sb-tradition-move,
  .sb-tradition-delete { min-width: 44px; min-height: 44px; }
  /* Was `opacity: 0` until :hover — invisible, and therefore unreachable, on a
     device that has no hover state at all. */
  .sb-tradition-delete { opacity: 0.7; }
  .sidebar-search input,
  .modal-search input { min-height: 44px; }
  .sb-add-to-tradition,
  .rp-open { min-height: 44px; }
  /* `min-height` ONLY — never `display: inline-flex`, which would flip these
     from block-level flex containers to shrink-to-fit and collapse two-line
     chips (`.chip-block-sub` is display: block and belongs UNDER its label). */
  .chip, .chip-block, .dss-trad,
  .empty-state .btn { min-height: 44px; }
}


/* ===========================================================================
   TIER 2 — phone (<= 700px)
   =========================================================================== */
@media (max-width: 700px) {

  .app-bar { padding: var(--s1) var(--s2); gap: var(--s1); }

  /* Content grids. `minmax(0, 1fr)` rather than `1fr` removes each track's
     min-content floor, so a long unbreakable token cannot re-open the layout
     viewport. The chain drops to two columns: eight was a desktop-width row,
     and four still overflowed inside the inline detail panel. */
  .chain-flow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .modal      { max-width: 100%; max-height: 92vh; }
  .modal-head, .modal-body, .modal-foot, .modal-search {
    padding-left: var(--s4);
    padding-right: var(--s4);
  }
}


/* ===========================================================================
   TIER 3 — micro (<= 599px)
   =========================================================================== */
@media (max-width: 599px) {

  /* Legibility floor: nothing below 12px on a phone. A scoped override of the
     shared scale — the desktop type ramp is untouched. */
  :root { --fs-nano: 12px; --fs-code: 12px;}

  /* Tighter tab row. */
  .detail-tab-bar { gap: var(--s3); }

  /* Two columns: the thumb and the title. */
}


/* ===== Material feedback — micro-animations on state changes =====
   Currently used:
   - preface-shift: a preface changed because the dedup rule rippled
   The reduced-motion media query at the bottom honors user preference and
   collapses all animation/transition durations to ~0. */

@keyframes preface-shift {
  0%   { background: var(--color-blue-soft); }
  100% { background: transparent; }
}
.preface-shifted {
  /* 800ms must match UI_TIMING_MS.PREFACE_SHIFT in the bottom-template JS,
     which removes this class at the same instant the animation ends. */
  animation: preface-shift 800ms var(--ease-out);
  border-radius: var(--r2);
  padding: 0 4px;
  margin: 0 -4px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ===== Tooltip primitive =====
   Apply to any element with `data-tooltip="text"`. Appears on hover AND on
   keyboard focus (the second is the accessibility win over the native
   `title=` attribute). Default position is above the element; opt into below
   with `data-tooltip-pos="bottom"` for elements near the top of the viewport.
   
   The bubble uses Google's tooltip surface color (dark grey #3c4043) with
   white text — readable against any background underneath. Delay before
   appearing is 400ms to avoid showing during quick mouse passes, which is
   the Material Design tooltip convention. */
[data-tooltip] { position: relative; }
[data-tooltip]::after {
  content: attr(data-tooltip);
  position: absolute;
  left: 50%;
  bottom: calc(100% + 8px);
  transform: translateX(-50%) translateY(2px);
  background: var(--surface-inverse);
  color: var(--text-inverse);
  font-size: var(--fs-micro);
  font-weight: var(--fw-medium);
  line-height: var(--lh-tight);
  padding: 5px 9px;
  border-radius: var(--r2);
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
  transition-delay: 0ms;
  z-index: 250;
  box-shadow: var(--shadow-2);
}
[data-tooltip]:hover::after,
[data-tooltip]:focus-visible::after {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  transition-delay: 400ms;
}
[data-tooltip-pos="bottom"]::after {
  bottom: auto;
  top: calc(100% + 8px);
  transform: translateX(-50%) translateY(-2px);
}
[data-tooltip-pos="bottom"]:hover::after,
[data-tooltip-pos="bottom"]:focus-visible::after {
  transform: translateX(-50%) translateY(0);
}
/* Left — for controls sitting at the right edge of a clipping container. The
   sidebar's tradition mover/delete buttons ask for this; until it existed they
   fell back to the centred-above default and were clipped by the sidebar's
   `overflow: hidden` (and, before the tooltips were suppressed below 900px,
   pushed the phone layout viewport open). */
[data-tooltip-pos="left"]::after {
  bottom: auto;
  top: 50%;
  left: auto;
  right: calc(100% + 8px);
  transform: translateY(-50%) translateX(2px);
}
[data-tooltip-pos="left"]:hover::after,
[data-tooltip-pos="left"]:focus-visible::after {
  transform: translateY(-50%) translateX(0);
}

/* ── Ask-the-engine chat dock ──────────────────────────────────────────────
   Docked bottom-right on desktop, full-width above the pinned recipe bar on a
   phone. It sits at z-index 25 — under the app bar (30) and under modals, so
   it can never cover a control the app already owns.

   The transcript panel is a SEPARATE element above the input row rather than a
   scrolling region the bar sits inside, because the bar has to stay at a fixed
   height and reachable while the log grows. */
.chat-dock {
  z-index: 25;
  right: var(--s5);
  bottom: var(--s5);
}
/* `display: flex` above outranks the UA's `[hidden] { display: none }`, so both
   of these would render while still marked hidden — the dock before the backend
   had been reached at all, and an empty transcript panel before the first
   message. The attribute is the state; these two rules are what make it mean
   anything once the elements are laid out as flex containers. */
.chat-dock[hidden],
.chat-panel[hidden] { display: none; }
.chat-panel {
  background: var(--surface);
  overflow: hidden;
}
.chat-panel-head {
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
  flex: 0 0 auto;
}
/* EVERY font-size IN THIS PANEL IS A TOKEN, and that is not only house style.
   The seven literals that used to be here — 10px, 11px and 12px — sat OUTSIDE
   the type scale, so the phone legibility floor at the bottom of Tier 3
   (`:root { --fs-nano: 12px; --fs-code: 12px; --fs-micro: 12px; }`, "nothing
   below 12px on a phone") could not reach them: the chat panel rendered its
   tool pills at 10px and its meta lines at 11px on a 390px screen, under a
   floor the rest of the app honours. `scripts/tandem.js`'s "no hardcoded
   font-size or font-weight" check is what named them, and it is the reason
   that check exists rather than being a lint preference. 11px is not a step on
   the ramp at all; it maps to --fs-micro, the nearest one the floor lifts. */
.chat-reset { padding: 4px 8px; font-size: var(--fs-micro); }
.chat-log {
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: var(--s3);
}
.chat-msg-you { align-self: flex-end; max-width: 85%; border-radius: 10px 10px 2px 10px; padding: var(--s2) var(--s3); }
.chat-msg-engine { align-self: flex-start; max-width: 100%; color: var(--text); }
.chat-msg-error { align-self: stretch; color: var(--accent); border-left: 2px solid var(--accent); padding-left: var(--s3); }
.chat-msg-note { align-self: stretch; color: var(--text-3); font-size: var(--fs-micro); }

/* The recipe is the deliverable, so it gets a block of its own rather than
   living inside the prose: monospace, selectable, and copyable in one action.
   `white-space: pre-wrap` because the recipe string is reproduced VERBATIM and
   collapsing its spaces would silently alter the thing the whole tool exists
   to produce. */
.chat-recipe {
  margin-top: var(--s2);
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface-2);
}
.chat-recipe-text {
  margin: 0;
  padding: var(--s3);
  font-family: var(--font-mono, ui-monospace, monospace);
  font-size: var(--fs-code);
  line-height: 1.55;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  overflow-y: auto;
}
.chat-recipe-foot {
  display: flex;
  align-items: center;
  gap: var(--s2);
  padding: var(--s2) var(--s3);
  border-top: 1px solid var(--border);
  color: var(--text-3);
}
.chat-recipe-foot .btn { padding: 3px 8px; font-size: var(--fs-micro); margin-left: auto; }

/* The tool trace. Shown because this app's whole claim is that the recipe is
   derived, not invented — naming the calls that produced it is the cheapest
   possible evidence, and it is what makes a wrong answer diagnosable. */
.chat-tools { display: flex; flex-wrap: wrap; gap: 4px; margin-top: var(--s2); }
.chat-tool {
  font-family: var(--font-mono, ui-monospace, monospace);
  padding: 2px 6px;
  border-radius: 999px;
  background: var(--surface-3);
  color: var(--text-2);
}
.chat-tool.is-error { background: var(--accent); color: var(--on-accent); }
/* A lyric grade with banned pairs standing: not an error — the call answered —
   but a verdict the user must see even when the reply relays none of it. */
.chat-tool.is-alert { background: var(--accent); color: var(--on-accent); }

.chat-bar {
  background: var(--surface);
}
.chat-input {
  flex: 1 1 auto;
  font-size: var(--fs-body);
  color: var(--text);
}
.chat-input:focus { outline: none; }
.chat-input::placeholder { color: var(--text-3); }
.chat-send { border-radius: 999px; padding: 8px 16px; flex: 0 0 auto; }
/* Character counter against the field's own maxlength. Same three bands and the
   same amber as .rp-count in the sidebar recipe preview, because it is the same
   idea — a ceiling you are approaching — and the two should not read as two
   different conventions. `flex: 0 0 auto` so it never gets squeezed into an
   ellipsis; the input carries min-width:0 and does the shrinking. No `display`
   here: the `hidden` attribute is how it stays out of the way, and any display
   value would outrank the UA's [hidden] rule. */
.chat-count {
  flex: 0 0 auto;
  font-size: var(--fs-micro);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  color: var(--text-3);
}
.chat-count.is-amber { color: var(--color-yellow-text); }
.chat-count.is-red { color: var(--color-red); }
/* Screen-reader-only live region for the same information. The visible counter
   is aria-hidden: a live region that fires on every keystroke is unusable, so
   the announcements below are emitted only when a band CHANGES. */
.chat-count-sr {
  position: absolute;
  width: 1px;
