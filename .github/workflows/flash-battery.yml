name: Flash battery

# Runs scripts/flash_battery.mjs against the LIVE chat deployment and uploads
# the JSONL transcripts as an artifact. Manual-only (workflow_dispatch): a
# battery round spends real Gemini credit through the site's own rate-limited
# /chat path, so a round is always a deliberate act, never a push side-effect.
#
# WHY A WORKFLOW AT ALL: the analyst's own container may sit behind a network
# egress policy that cannot reach the Render host (GitHub is allowlisted,
# onrender.com is not), while a GitHub runner has open egress. The driver is
# the same committed instrument either way; only where it runs moves.

on:
  workflow_dispatch:
    inputs:
      songs:
        description: 'How many songs to drive (briefs cycle)'
        default: '3'
        required: false
      turns:
        description: 'Max user turns per song (M-224: 25 — round 14 folded 34 answers in six turns and nine could not hold the loop)'
        default: '25'
        required: false
      pace:
        description: 'Seconds between requests (the site allows ~30/hr/IP)'
        default: '130'
        required: false

      wait_for_live:
        description: 'Wait until the live connector advertises this tree (mcp/check_live.mjs exit 0) before the first turn (M-225: the deploy job only queues the build)'
        default: 'false'
        required: false

      live_commit:
        description: 'M-230: with wait_for_live, also require /health to report this commit (the merge sha on main) — a change that touches no tool leaves the surface identical, and the surface alone matched the OLD deployment'
        default: ''
        required: false
concurrency:
  group: flash-battery
  cancel-in-progress: false

jobs:
  battery:
    runs-on: ubuntu-latest
    # DERIVED from what a round may now legitimately spend, not guessed: the
    # M-163 driver continues past parked (exit 3) stops, so a single-song
    # round can use its whole turn budget, and round 6 measured a legitimate
    # turn at 16m49s (grade + revise chains inside one /chat response). Nine
    # turns at that worst-observed pace is ~150 min; 300 covers it with the
    # same 2x margin check_deploy_memory.js uses, under the 6h Actions cap.
    # The old 120 was sized for the 130s-pace multi-song shape and would kill
    # the job mid-round — taking the transcript with it.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # M-225: "ACCEPTED IS NOT DEPLOYED" (deploy-connector.yml's own words) —
      # the deploy job only queues Render's build, and nothing reports when the
      # new process is serving. mcp/check_live.mjs asks the live server what it
      # advertises and exits 0 only when that matches THIS tree, so a round
      # dispatched with wait_for_live=true starts its first turn against the
      # build it was meant to measure and not the one before it. Bounded at
      # 45 minutes; a wait that runs out is a red job, not a round against the
      # wrong server.
      - name: Wait until the live connector matches this tree
        if: inputs.wait_for_live == 'true'
        run: |
          (cd mcp && npm ci --no-audit --no-fund)
          deadline=$((SECONDS + 2700))
          n=0
          while :; do
            n=$((n + 1))
            set +e
            out=$(node mcp/check_live.mjs --commit="${{ inputs.live_commit }}" 2>&1); rc=$?
            set -e
            if [ "$rc" = "0" ]; then
              echo "::notice title=battery wait-for-live::live connector matches this tree${{ inputs.live_commit && ' and reports the expected commit' || '' }} after $n probe(s), ${SECONDS}s"
              break
            fi
            echo "probe $n: check_live exit $rc — $(echo "$out" | tail -1 | cut -c1-160)"
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error title=battery wait-for-live::the live connector did not match this tree inside 45 minutes (last exit $rc)"
              exit 1
            fi
            sleep 30
          done
      - name: Drive the battery against the live deployment
        run: |
          node scripts/flash_battery.mjs \
            --out=battery-out \
            --songs=${{ inputs.songs }} \
            --turns=${{ inputs.turns }} \
            --pace=${{ inputs.pace }}
      # The analyst's container cannot reach the artifact blob store either
      # (same egress policy that motivated this workflow), but it CAN read job
      # logs — so the transcripts are also printed here, size-guarded. The
      # artifact remains the canonical full record.
      - name: Print the transcripts into the log (the analyst reads logs)
        if: always()
        run: |
          for f in battery-out/summary.json battery-out/*.jsonl; do
            [ -f "$f" ] || continue
            echo "═══ $f ═══"
            head -c 400000 "$f"
            echo
          done
      - name: Upload the transcripts (the record IS the deliverable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flash-battery-transcripts
          path: battery-out/
          retention-days: 30
