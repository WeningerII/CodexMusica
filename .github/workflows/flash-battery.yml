name: Flash battery

# Paid, manual measurement. A schema-only smoke is mcp/check_live.mjs without
# --commit; this workflow always verifies a specific implementation before it
# spends credit. Checkpoints carry signed continuation capabilities and are
# uploaded as artifacts, never printed into the public job log.
on:
  workflow_dispatch:
    inputs:
      songs:
        description: 'Songs to drive; all must satisfy the selected expected outcome'
        default: '1'
        required: false
      turns:
        description: 'Maximum user turns per song'
        default: '25'
        required: false
      pace:
        description: 'Seconds between requests (the site allows about 30/hr/IP)'
        default: '130'
        required: false
      expect:
        description: 'finished requires every song; turn-wall requires a signed wall checkpoint; survey records coverage only'
        type: choice
        options: [finished, turn-wall, survey]
        default: finished
      wait_for_live:
        description: 'Wait up to 45 minutes for the pinned build; false checks once and refuses a mismatch'
        type: boolean
        default: true
      live_commit:
        description: 'Required full 40-character commit SHA to measure'
        required: true
      resume_run:
        description: 'Optional Actions run ID whose battery artifact should be resumed'
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: flash-battery
  cancel-in-progress: false

jobs:
  battery:
    runs-on: ubuntu-latest
    # A driver-side aggregate deadline subtracts setup/deploy waiting and
    # leaves five minutes for final records and upload before this hard wall.
    timeout-minutes: 355
    steps:
      - name: Record job deadline and validate the measured SHA
        env:
          LIVE_COMMIT: ${{ inputs.live_commit }}
        run: |
          echo "BATTERY_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          if ! [[ "$LIVE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::live_commit must be a full lowercase 40-character SHA'
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.live_commit }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore a prior checkpoint
        if: inputs.resume_run != ''
        uses: actions/download-artifact@v4
        with:
          name: flash-battery-transcripts
          path: battery-out/
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
      - name: Verify the live implementation
        env:
          LIVE_COMMIT: ${{ inputs.live_commit }}
          WAIT_FOR_LIVE: ${{ inputs.wait_for_live }}
        run: |
          mkdir -p battery-out
          node -e 'require("fs").writeFileSync("battery-out/preflight.json", JSON.stringify({expected_commit:process.env.LIVE_COMMIT,started:new Date().toISOString(),phase:"checking_live"},null,2))'
          (cd mcp && npm ci --no-audit --no-fund)
          deadline=$((SECONDS + 2700))
          while :; do
            if node mcp/check_live.mjs --commit="$LIVE_COMMIT"; then
              break
            fi
            if [ "$WAIT_FOR_LIVE" != 'true' ] || [ "$SECONDS" -ge "$deadline" ]; then
              echo '::error::the live connector did not match the pinned build; no paid request was sent'
              exit 1
            fi
            sleep 30
          done
      - name: Drive the battery against the pinned deployment
        env:
          LIVE_COMMIT: ${{ inputs.live_commit }}
          SONGS: ${{ inputs.songs }}
          TURNS: ${{ inputs.turns }}
          PACE: ${{ inputs.pace }}
          EXPECT: ${{ inputs.expect }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: |
          remaining=$((BATTERY_JOB_STARTED + 355 * 60 - $(date +%s) - 300))
          if [ "$remaining" -le 0 ]; then
            echo '::error::no time remains before the upload reserve'
            exit 1
          fi
          resume=()
          if [ -n "$RESUME_RUN" ]; then resume=(--resume); fi
          node scripts/flash_battery.mjs \
            --out=battery-out \
            --commit="$LIVE_COMMIT" \
            --require-recovery \
            --songs="$SONGS" \
            --turns="$TURNS" \
            --pace="$PACE" \
            --expect="$EXPECT" \
            --max-runtime="$remaining" \
            "${resume[@]}"
      - name: Print verdicts and transcripts without continuation capabilities
        if: always()
        run: |
          for f in battery-out/summary.json battery-out/song[0-9]*.jsonl; do
            case "$f" in *.attempts.jsonl) continue ;; esac
            [ -f "$f" ] || continue
            echo "═══ $f ═══"
            head -c 400000 "$f"
            echo
          done
      - name: Upload the transcripts and resumable checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flash-battery-transcripts
          path: battery-out/
          retention-days: 30
