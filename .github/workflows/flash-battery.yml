name: Flash battery

# Paid, manual measurement. A bare mcp/check_live.mjs call checks initialization
# and tool metadata; this workflow verifies build, readiness and settings before it
# spends credit. Checkpoints carry signed continuation capabilities and are
# encrypted before artifact upload; only an allowlisted aggregate reaches logs.
on:
  workflow_dispatch:
    inputs:
      songs:
        description: 'Songs to drive; all must satisfy the selected expected outcome'
        default: '1'
        required: false
      turns:
        description: 'Maximum user turns per song'
        default: '25'
        required: false
      pace:
        description: 'Seconds between requests (the site allows about 30/hr/IP)'
        default: '130'
        required: false
      mode:
        description: 'raw drives the plain ask "Write a song" with "keep going" as the only continuation — the honest measure of whether the product works for a person; probe drives the five feature briefs with process coaching (M-274)'
        type: choice
        options: [raw, probe]
        default: raw
      expect:
        description: 'finished requires every song; turn-wall requires a signed wall checkpoint and successful continuation; survey records coverage only'
        type: choice
        options: [finished, turn-wall, survey]
        default: finished
      wait_for_live:
        description: 'Wait up to 45 minutes for the pinned build; false checks once and refuses a mismatch'
        type: boolean
        default: true
      live_commit:
        description: 'Required full 40-character commit SHA to measure'
        required: true
      resume_run:
        description: 'Optional Actions run ID whose battery artifact should be resumed'
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: flash-battery
  cancel-in-progress: false

jobs:
  battery:
    runs-on: ubuntu-latest
    # A driver-side aggregate deadline subtracts setup/deploy waiting and
    # leaves five minutes for final records and upload before this hard wall.
    timeout-minutes: 355
    steps:
      - name: Validate recovery encryption before any paid request
        env:
          LIVE_COMMIT: ${{ inputs.live_commit }}
          BATTERY_RECOVERY_KEY: ${{ secrets.BATTERY_RECOVERY_KEY }}
        run: |
          if ! [[ "$BATTERY_RECOVERY_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo '::error::Configure BATTERY_RECOVERY_KEY as 32 random bytes encoded by 64 hexadecimal characters before running or resuming a battery'
            exit 1
          fi
          echo "BATTERY_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          if ! [[ "$LIVE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::live_commit must be a full lowercase 40-character SHA'
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.live_commit }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Select the latest remotely acknowledged checkpoint
        id: prior
        if: inputs.resume_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_RUN: ${{ inputs.resume_run }}
        run: |
          [[ "$PRIOR_RUN" =~ ^[0-9]+$ ]] || { echo 'Invalid prior run ID'; exit 1; }
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_RUN/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | select(.name == "flash-battery-recovery" or (.name | startswith("flash-battery-checkpoint-"))) | .id' | sort -nr | head -1)
          [ -n "$id" ] || { echo 'No retained encrypted checkpoint exists'; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Download the acknowledged encrypted checkpoint
        if: inputs.resume_run != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.prior.outputs.id }}
          merge-multiple: true
          path: battery-sealed-in/
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
      - name: Authenticate and restore the prior checkpoint
        if: inputs.resume_run != ''
        env:
          BATTERY_RECOVERY_KEY: ${{ secrets.BATTERY_RECOVERY_KEY }}
        run: node scripts/battery_archive.mjs open --archive=battery-sealed-in/battery-recovery.enc --out=battery-out
      - name: Verify the live implementation
        env:
          LIVE_COMMIT: ${{ inputs.live_commit }}
          WAIT_FOR_LIVE: ${{ inputs.wait_for_live }}
        run: |
          umask 077
          mkdir -p battery-out
          node -e 'require("fs").writeFileSync("battery-out/preflight.json", JSON.stringify({expected_commit:process.env.LIVE_COMMIT,started:new Date().toISOString(),phase:"checking_live"},null,2))'
          (cd mcp && npm ci --no-audit --no-fund)
          deadline=$((SECONDS + 2700))
          while :; do
            if node mcp/check_live.mjs --commit="$LIVE_COMMIT" --ready --config=render; then
              break
            fi
            if [ "$WAIT_FOR_LIVE" != 'true' ] || [ "$SECONDS" -ge "$deadline" ]; then
              echo '::error::the live connector did not match the pinned build; no paid request was sent'
              exit 1
            fi
            sleep 30
          done
      - name: Install the pinned remote checkpoint client
        run: npm ci --prefix scripts/battery-actions --ignore-scripts --no-audit --no-fund
      - name: Expose the scoped Actions artifact runtime to the driver
        uses: actions/github-script@v7
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error(`Artifact runtime is missing ${name}`);
              if (name.endsWith('TOKEN')) core.setSecret(value);
              core.exportVariable(name, value);
            }
      - name: Prove archive encryption before paid work and retain a sealed baseline
        env:
          BATTERY_RECOVERY_KEY: ${{ secrets.BATTERY_RECOVERY_KEY }}
        run: |
          umask 077
          mkdir -p battery-sealed
          node scripts/battery_archive.mjs --check-key
          node scripts/battery_archive.mjs seal --source=battery-out --out=battery-sealed/battery-recovery.enc > battery-sealed/manifest.json.tmp
          mv battery-sealed/manifest.json.tmp battery-sealed/manifest.json
      - name: Retain the encrypted baseline remotely before paid work
        uses: actions/upload-artifact@v4
        with:
          name: flash-battery-checkpoint-baseline
          path: battery-sealed/battery-recovery.enc
          if-no-files-found: error
          retention-days: 7
      - name: Drive the battery against the pinned deployment
        env:
          BATTERY_RECOVERY_KEY: ${{ secrets.BATTERY_RECOVERY_KEY }}
          LIVE_COMMIT: ${{ inputs.live_commit }}
          SONGS: ${{ inputs.songs }}
          TURNS: ${{ inputs.turns }}
          PACE: ${{ inputs.pace }}
          EXPECT: ${{ inputs.expect }}
          MODE: ${{ inputs.mode }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: |
          umask 077
          remaining=$((BATTERY_JOB_STARTED + 355 * 60 - $(date +%s) - 300))
          if [ "$remaining" -le 0 ]; then
            echo '::error::no time remains before the upload reserve'
            exit 1
          fi
          resume=()
          if [ -n "$RESUME_RUN" ]; then resume=(--resume); fi
          raw=()
          if [ "$MODE" = "raw" ]; then raw=(--raw); fi
          set +e
          node scripts/flash_battery.mjs \
            --out=battery-out \
            --commit="$LIVE_COMMIT" \
            --require-recovery \
            --require-remote-recovery \
            --songs="$SONGS" \
            --turns="$TURNS" \
            --pace="$PACE" \
            --expect="$EXPECT" \
            --max-runtime="$remaining" \
            "${raw[@]}" \
            "${resume[@]}" >> battery-out/driver.log 2>&1
          rc=$?
          set -e
          echo "Battery process exited with status $rc; full details remain in the encrypted recovery artifact."
          exit "$rc"
      - name: Seal the latest records without removing the local evidence
        id: seal
        if: always()
        env:
          BATTERY_RECOVERY_KEY: ${{ secrets.BATTERY_RECOVERY_KEY }}
        run: |
          umask 077
          if [ ! -d battery-out ]; then exit 0; fi
          mkdir -p battery-sealed
          if node scripts/battery_archive.mjs seal --source=battery-out --out=battery-sealed/battery-recovery.enc > battery-sealed/manifest.json.tmp; then
            mv battery-sealed/manifest.json.tmp battery-sealed/manifest.json
          else
            rm -f battery-sealed/manifest.json.tmp
            echo '::error::Latest archive sealing failed. Local evidence and any previously sealed archive are preserved; plaintext will not be uploaded.'
            exit 1
          fi
      - name: Record archive freshness without private content
        if: always()
        env:
          LATEST_SEAL_SUCCEEDED: ${{ steps.seal.outcome == 'success' }}
        run: |
          node -e 'const fs=require("fs"); const p="battery-sealed/manifest.json"; if(fs.existsSync(p)){const m=JSON.parse(fs.readFileSync(p,"utf8")); m.latest_seal_succeeded=process.env.LATEST_SEAL_SUCCEEDED==="true"; fs.writeFileSync(p,JSON.stringify(m,null,2)+"\n",{mode:0o600});}'
      - name: Print only safe aggregate outcomes
        if: always()
        run: node scripts/battery_archive.mjs summary --source=battery-out
      - name: Upload only encrypted recovery data and its public manifest
        if: always() && hashFiles('battery-sealed/battery-recovery.enc') != ''
        uses: actions/upload-artifact@v4
        with:
          name: flash-battery-recovery
          path: |
            battery-sealed/battery-recovery.enc
            battery-sealed/manifest.json
          if-no-files-found: error
          retention-days: 30
