name: Deploy connector to Render

# Promotes the exact qualified image digest to the migrated image-backed service.
# Desired settings live in mcp/production-config.json; the legacy render.yaml
# is retained solely for migration reference. See mcp/IMAGE_RELEASE.md.
# deploy_guard.sh refuses an older commit after main advances.

on:
  workflow_run:
    # TWO PRODUCERS OF EVIDENCE, AND THE DEPLOY LISTENS TO BOTH (M-287). CI's
    # push run is the first half; the manual Production qualification is the
    # second, dispatched by a person after CI has finished. Listening only to
    # CI meant every merge's deploy run fired before the qualification could
    # exist and went red on its absence -- six in a row, 2026-09-12 to 09-14 --
    # and the real deploy was always a manual dispatch afterwards. Now the
    # CI-completion run stands down (green, saying what it waits for) and the
    # qualification's completion is what deploys.
    workflows: ['CI', 'Production qualification']
    types: [completed]
    branches: [main] # only qualified main commits can be promoted
  workflow_dispatch: {}

permissions:
  contents: read
  # Exact CI evidence and its tested image artifact are read with the job token.
  actions: read

# Serialized, and NOT cancel-in-progress: a deploy POST that has been accepted
# cannot be un-sent, so cancelling a run mid-flight would leave Render building
# a tree this workflow believes it abandoned.
concurrency:
  group: deploy-connector
  cancel-in-progress: false

jobs:
  deploy:
    # A CI run that FAILED, was cancelled, or was skipped must not deploy —
    # that is the whole point of the file. `workflow_dispatch` is allowed
    # through for the manual case (a deploy hook rotated, a Render build lost),
    # and it still passes the guard below.
    #
    # AND A CI RUN THAT NO PUSH STARTED MUST NOT DEPLOY EITHER — 2026-09-01,
    # `MISSING.md` M-187. `workflow_run` fires on EVERY completed CI run whose
    # head branch is main, and CI has two crons (`17 4 * * *` nightly,
    # `0 6 * * 1` weekly) and a manual dispatch, all of which run on main's
    # UNCHANGED tip. MEASURED off the run list (`gh run list
    # --workflow=deploy-connector.yml --json headSha,createdAt,conclusion`):
    # deploy runs #22-#26 all deployed 1206fe25 — five deploys of one sha in
    # 38 h (2026-08-30 20:46Z to 2026-09-01 10:43Z). #22 was the merge's own
    # push run (CI #1176); #23 a manual dispatch (CI #1177); #24, #25 and #26
    # scheduled runs (CI #1180, #1179, #1183). Each rebuilt the image and
    # restarted the live process to serve the bytes it was already serving.
    # The guard below cannot see this: it asks whether the sha is main's tip,
    # and an unchanged tip IS the tip. `event == 'push'` is the condition, and
    # it would have stood four of the five down. The head_repository equality
    # beside it is the trust half sync-pages.yml argues in full (a fork branch
    # literally named `main` satisfies `branches: [main]`); here the guard
    # would have gone RED on a sha it cannot resolve rather than deployed it,
    # which is noise rather than a hole, and still the wrong answer.
    #
    # Each verified CI attempt can produce a distinct tested image for the same
    # commit. A same-SHA receipt cannot stand down that immutable promotion;
    # serialization and the main-tip ordering guard remain authoritative.
    #
    # For the qualification, the trust condition CI's `push` is comes from
    # `QUALIFICATION_EVENTS` in `scripts/verify_ci.mjs`; the evidence step below
    # still resolves the PUSH CI run at the same SHA, so a qualification cannot
    # promote a commit whose CI never ran.
    #
    # AND THIS EXPRESSION IS THE THIRD READER OF THAT SET, WHICH THE SET'S OWN
    # COMMENT DID NOT KNOW -- 2026-09-18, doctrine 1. It declares itself read in
    # TWO places that must never disagree (the run lookup and the acceptance
    # predicate) and names neither this file nor `qualification-backstop.yml`. A
    # workflow `if` cannot import a JavaScript constant, so the spelling is
    # copied here and the copy went stale the day the nightly schedule landed:
    # `workflow_dispatch` alone, against a checker that had been widened to
    # accept `schedule` in the same sitting. MEASURED on main at `fae14b1b`:
    # deploy run 177 (2026-09-18 07:09Z) fired on the FIRST scheduled
    # qualification this repository has ever had succeed and was SKIPPED by this
    # line -- the nightly could not deploy, silently, with nothing red anywhere.
    # A copy cannot be removed; it can be CHECKED, and
    # `mcp/test_release_gates.mjs` now requires this expression to name exactly
    # the members of `QUALIFICATION_EVENTS`.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           ((github.event.workflow_run.name == 'CI' &&
             github.event.workflow_run.event == 'push') ||
            (github.event.workflow_run.name == 'Production qualification' &&
             (github.event.workflow_run.event == 'workflow_dispatch' ||
              github.event.workflow_run.event == 'schedule')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # fetch-depth 0 is load-bearing: deploy_guard.sh asks `merge-base` and
      # `rev-list --count` about the distance between two commits, and a
      # shallow clone answers neither.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve the commit CI validated
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA=$(git rev-parse HEAD)
            echo "manual dispatch — using checked-out HEAD"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            echo "${{ github.event.workflow_run.name }} run ${{ github.event.workflow_run.id }} succeeded on $SHA"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # THREE ANSWERS HERE TOO: 0 with both halves of the evidence, 10 with
      # CI's half and no qualification at this SHA yet (qualified=no, a clean
      # stand-down -- the qualification's own completion re-enters this
      # workflow), anything else a real error. A qualification that exists
      # and failed is the third case, and it is red on purpose.
      - name: Require exact trusted CI evidence, including manual dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.sha.outputs.sha }}
        id: evidence
        run: |
          set +e
          node scripts/verify_ci.mjs "$TESTED_SHA" --production > verified-ci.json
          rc=$?
          set -e
          case $rc in
            0)
              echo "qualified=yes" >> "$GITHUB_OUTPUT"
              echo "run_id=$(node -p 'JSON.parse(require("fs").readFileSync("verified-ci.json")).run_id')" >> "$GITHUB_OUTPUT"
              echo "qualification_run_id=$(node -p 'JSON.parse(require("fs").readFileSync("verified-ci.json")).qualification.run_id')" >> "$GITHUB_OUTPUT"
              echo "qualification_attempt=$(node -p 'JSON.parse(require("fs").readFileSync("verified-ci.json")).qualification.run_attempt')" >> "$GITHUB_OUTPUT"
              echo "release_id=${{ github.repository_id }}:$(node -p 'JSON.parse(require("fs").readFileSync("verified-ci.json")).run_id'):$(node -p 'JSON.parse(require("fs").readFileSync("verified-ci.json")).run_attempt'):lyrics-image" >> "$GITHUB_OUTPUT"
              ;;
            10)
              # THE REASON IS THE SCRIPT'S, NOT A PARAPHRASE -- the same rule
              # the deploy guard's own stand-down already follows below. This
              # sentence used to be a literal reading "no Production
              # qualification exists there yet", which since 2026-09-18 is one
              # of TWO stand-downs: absent, and running. Reading `stand_down`
              # out of the evidence keeps them apart without a second copy of
              # either sentence (doctrine 1).
              echo "qualified=no" >> "$GITHUB_OUTPUT"
              WHY=$(node -p 'JSON.parse(require("fs").readFileSync("verified-ci.json")).stand_down')
              echo "why=STAND DOWN — CI is green at $TESTED_SHA. $WHY A Production qualification on main deploys by itself when it completes." >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "verify_ci.mjs failed with $rc"
              exit $rc
              ;;
          esac

      - name: Download the exact verified run's image manifest
        if: steps.evidence.outputs.qualified == 'yes'
        uses: actions/download-artifact@v4
        with:
          name: lyrics-image
          run-id: ${{ steps.evidence.outputs.run_id }}
          github-token: ${{ github.token }}
          path: verified-image

      - name: Download the complete qualification from its verified attempt
        if: steps.evidence.outputs.qualified == 'yes'
        uses: actions/download-artifact@v4
        with:
          name: production-qualification-${{ steps.evidence.outputs.qualification_attempt }}
          run-id: ${{ steps.evidence.outputs.qualification_run_id }}
          github-token: ${{ github.token }}
          path: verified-qualification

      - name: Bind complete qualification to the tested image source
        if: steps.evidence.outputs.qualified == 'yes'
        run: node scripts/verify_qualification.mjs verified-qualification/qualification.json verified-image/lyrics-image.json verified-ci.json

      - name: Require immutable image promotion configuration
        if: steps.evidence.outputs.qualified == 'yes'
        env:
          IMAGE_REPOSITORY: ${{ vars.RENDER_IMAGE_REPOSITORY }}
          TESTED_SHA: ${{ steps.sha.outputs.sha }}
          VERIFIED_RELEASE_ID: ${{ steps.evidence.outputs.release_id }}
        run: |
          node scripts/image_release.mjs url verified-image/lyrics-image.json "$TESTED_SHA" "$IMAGE_REPOSITORY" "$VERIFIED_RELEASE_ID" > image-url.txt

      # THREE ANSWERS, NEVER COLLAPSED (the shape mcp/check_live.mjs uses):
      # 0 DEPLOY, 10 STAND DOWN — named, and since M-289 never on the bare ground
      # that main moved on — and any other code a
      # real error. A stand-down is not a failure and must not paint the run
      # red, or people learn to ignore the colour. The guard's own first line
      # is carried to the Stood down step so the reason is the guard's, not a
      # paraphrase.
      # WHAT IS THE CONNECTOR ACTUALLY SERVING? (M-289.) The guard below decides
      # whether this promotion ADVANCES the live service or rolls it backwards,
      # and it can only ask that question against a live commit. /health is
      # ground truth about the running process; CI records are an inference
      # about what was once asked for, which is a different thing and was wrong
      # for 33 h while every workflow stayed green.
      #
      # AN UNREACHABLE SERVER IS NOT A FAILURE HERE. It is UNKNOWN, and the
      # guard falls back to the tip-of-main rule it has always applied, which
      # is no weaker than before this step existed. So this step never fails
      # the run: it prints what happened and hands on an empty sha.
      - name: What the live connector is serving
        if: steps.evidence.outputs.qualified == 'yes'
        id: live
        env:
          MCP_LIVE_URL: ${{ vars.CONNECTOR_URL != '' && format('{0}/mcp', vars.CONNECTOR_URL) || '' }}
        run: |
          npm --prefix mcp ci --no-audit --no-fund
          set +e
          sha=$(node mcp/check_live.mjs --print-commit 2>/tmp/live-err.txt)
          rc=$?
          set -e
          if [ "$rc" = 0 ] && [ -n "$sha" ]; then
            echo "the live connector reports commit $sha"
          else
            sha=""
            echo "the live commit is UNKNOWN — the guard falls back to the tip-of-main rule:"
            sed 's/^/  /' /tmp/live-err.txt || true
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: May this verified image be deployed? (the main ordering guard)
        if: steps.evidence.outputs.qualified == 'yes'
        id: guard
        env:
          # Passed here rather than on the command line so the legacy
          # LAST_DEPLOYED_SHA="" BUILT_SHA=... invocation stays exactly as the
          # image-promotion contract in mcp/test.mjs reads it.
          LIVE_SHA: ${{ steps.live.outputs.sha }}
        run: |
          set +e
          out=$(LAST_DEPLOYED_SHA="" BUILT_SHA="${{ steps.sha.outputs.sha }}" scripts/deploy_guard.sh --verbose 2>&1)
          rc=$?
          set -e
          echo "$out"
          case $rc in
            0)  echo "go=yes" >> "$GITHUB_OUTPUT" ;;
            10) echo "go=no"  >> "$GITHUB_OUTPUT"
                echo "why=$(printf '%s\n' "$out" | grep -m1 'STAND DOWN')" >> "$GITHUB_OUTPUT" ;;
            *)  echo "deploy_guard failed with $rc"; exit $rc ;;
          esac

      # A MISSING SECRET MUST BE LOUD. Without this step an unset hook makes
      # curl POST to the empty string, and the most likely outcome is a job
      # that looks like it deployed and did not — the silent-failure class this
      # whole file exists to end. It is checked only on the path that would use
      # it, so a stand-down never fails for a secret it was never going to send.
      - name: The deploy hook must be configured
        if: steps.guard.outputs.go == 'yes'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "REFUSED — the repository secret RENDER_DEPLOY_HOOK_URL is unset."
            echo
            echo "  The migrated service must disable alternate deployment routes. This is the"
            echo "  path to a deploy. With no hook the connector silently stops"
            echo "  tracking main — which the nightly's mcp/check_live.mjs would"
            echo "  eventually report as DRIFT, hours later and one layer away."
            echo
            echo "  Render dashboard -> migrated IMAGE-backed service -> Settings -> Deploy Hook,"
            echo "  then add the URL as the repository secret RENDER_DEPLOY_HOOK_URL."
            exit 1
          fi

      # Promote exactly the image tested in the verified run. The ordering guard
      # prevents a completed older run from rolling the service back.
      - name: Deploy
        if: steps.guard.outputs.go == 'yes'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          # This hook must belong to an image-backed service configured for the
          # same repository. Render rejects imgURL on mismatched repositories.
          image_url=$(cat image-url.txt)
          code=$(curl --max-time 60 -sS -o /tmp/deploy.json -w '%{http_code}' --get \
            --data-urlencode "imgURL=$image_url" -X POST "$HOOK")
          echo "HTTP $code"
          cat /tmp/deploy.json 2>/dev/null || true
          echo
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "REFUSED — Render did not accept the deploy (HTTP $code)."
            echo "  The connector is still serving whatever it served before this run."
            exit 1
          fi
          echo "Render accepted a deploy of $SHA."
          echo "Waiting for the live identity, readiness and configuration checks below."

      # THE ADDRESS IS CONFIGURATION, NOT CODE (M-278). The image-backed
      # service Render created on 2026-09-11 answers at
      # codex-musica-mcp-tc72.onrender.com; the legacy Git-backed service kept
      # codex-musica-mcp.onrender.com when it was renamed, because Render ties
      # the subdomain to the service, not the name. Run 74 polled the old
      # address for 30 minutes and read Render's HTML page instead of JSON.
      # `vars.CONNECTOR_URL` names the service this workflow verifies; unset,
      # check_live.mjs falls back to the address the product documents.
      - name: Verify the deployed runtime
        if: steps.guard.outputs.go == 'yes'
        env:
          TESTED_SHA: ${{ steps.sha.outputs.sha }}
          MCP_LIVE_URL: ${{ vars.CONNECTOR_URL != '' && format('{0}/mcp', vars.CONNECTOR_URL) || '' }}
        run: |
          npm --prefix mcp ci --no-audit --no-fund
          deadline=$((SECONDS + 1800))
          until node mcp/check_live.mjs --commit="$TESTED_SHA" --ready --config=render --image-manifest=verified-image/lyrics-image.json; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo '::error::Render did not serve the verified commit and configuration within 30 minutes'
              exit 1
            fi
            sleep 30
          done

      # A STAND-DOWN SAYS HOW FAR BEHIND IT LEAVES THE CONNECTOR (M-289). The
      # sentence this step used to print — "the newer commit's own
      # qualification deploys it" — was true until M-287 moved the deploy onto
      # the MANUALLY dispatched qualification, and false every day after: no
      # qualification exists at the newer commit unless a person makes one, so
      # the run promised a deploy nothing was going to perform and went green.
      # Live sat on 42f020e6 for 33 h while main reached 64d32b20. Naming the
      # distance, and naming who has to act, is what makes that visible at the
      # moment it becomes true instead of in a nightly hours later.
      - name: Stood down
        if: steps.evidence.outputs.qualified == 'no' || steps.guard.outputs.go == 'no'
        env:
          WHY: ${{ steps.evidence.outputs.why || steps.guard.outputs.why }}
          LIVE_SHA: ${{ steps.live.outputs.sha }}
          TESTED_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          echo "No deploy. ${WHY}"
          echo
          echo "Why a run reaches here: no Production qualification exists yet at this"
          echo "commit; or this tree would move the live connector BACKWARDS; or Render"
          echo "already serves exactly this sha (M-187 (b))."
          echo
          if [ -n "$LIVE_SHA" ] && git rev-parse --verify --quiet "$LIVE_SHA^{commit}" >/dev/null; then
            behind=$(git rev-list --count "$LIVE_SHA..origin/main" 2>/dev/null || echo '?')
            echo "THE CONNECTOR IS LEFT ON $LIVE_SHA, $behind commit(s) behind main."
          else
            echo "THE CONNECTOR IS LEFT WHERE IT WAS (live commit unknown to this run)."
          fi
          echo
          echo "NOTHING IS SCHEDULED TO CLOSE THAT GAP. The qualification is dispatched by"
          echo "a person, so main advancing does not produce one: dispatch 'Production"
          echo "qualification' on main's current tip and its completion deploys by itself."
          echo "Since M-289 the guard no longer demands that the qualified commit still BE"
          echo "the tip — any commit that advances the live one ships — so a qualification"
          echo "that finishes after a merge lands is no longer wasted."
