name: Deploy connector to Render

# Promotes the exact qualified image digest to the migrated image-backed service.
# Desired settings live in mcp/production-config.json; the legacy render.yaml
# is retained solely for migration reference. See mcp/IMAGE_RELEASE.md.
# deploy_guard.sh refuses an older commit after main advances.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main] # only qualified main commits can be promoted
  workflow_dispatch: {}

permissions:
  contents: read
  # Exact CI evidence and its tested image artifact are read with the job token.
  actions: read

# Serialized, and NOT cancel-in-progress: a deploy POST that has been accepted
# cannot be un-sent, so cancelling a run mid-flight would leave Render building
# a tree this workflow believes it abandoned.
concurrency:
  group: deploy-connector
  cancel-in-progress: false

jobs:
  deploy:
    # A CI run that FAILED, was cancelled, or was skipped must not deploy —
    # that is the whole point of the file. `workflow_dispatch` is allowed
    # through for the manual case (a deploy hook rotated, a Render build lost),
    # and it still passes the guard below.
    #
    # AND A CI RUN THAT NO PUSH STARTED MUST NOT DEPLOY EITHER — 2026-09-01,
    # `MISSING.md` M-187. `workflow_run` fires on EVERY completed CI run whose
    # head branch is main, and CI has two crons (`17 4 * * *` nightly,
    # `0 6 * * 1` weekly) and a manual dispatch, all of which run on main's
    # UNCHANGED tip. MEASURED off the run list (`gh run list
    # --workflow=deploy-connector.yml --json headSha,createdAt,conclusion`):
    # deploy runs #22-#26 all deployed 1206fe25 — five deploys of one sha in
    # 38 h (2026-08-30 20:46Z to 2026-09-01 10:43Z). #22 was the merge's own
    # push run (CI #1176); #23 a manual dispatch (CI #1177); #24, #25 and #26
    # scheduled runs (CI #1180, #1179, #1183). Each rebuilt the image and
    # restarted the live process to serve the bytes it was already serving.
    # The guard below cannot see this: it asks whether the sha is main's tip,
    # and an unchanged tip IS the tip. `event == 'push'` is the condition, and
    # it would have stood four of the five down. The head_repository equality
    # beside it is the trust half sync-pages.yml argues in full (a fork branch
    # literally named `main` satisfies `branches: [main]`); here the guard
    # would have gone RED on a sha it cannot resolve rather than deployed it,
    # which is noise rather than a hole, and still the wrong answer.
    #
    # Each verified CI attempt can produce a distinct tested image for the same
    # commit. A same-SHA receipt cannot stand down that immutable promotion;
    # serialization and the main-tip ordering guard remain authoritative.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # fetch-depth 0 is load-bearing: deploy_guard.sh asks `merge-base` and
      # `rev-list --count` about the distance between two commits, and a
      # shallow clone answers neither.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve the commit CI validated
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA=$(git rev-parse HEAD)
            echo "manual dispatch — using checked-out HEAD"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            echo "CI run ${{ github.event.workflow_run.id }} succeeded on $SHA"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Require exact trusted CI evidence, including manual dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.sha.outputs.sha }}
        id: evidence
        run: |
          node scripts/verify_ci.mjs "$TESTED_SHA" --production > verified-ci.json
          echo "run_id=$(node -p 'JSON.parse(require("fs").readFileSync("verified-ci.json")).run_id')" >> "$GITHUB_OUTPUT"
          echo "qualification_run_id=$(node -p 'JSON.parse(require("fs").readFileSync("verified-ci.json")).qualification.run_id')" >> "$GITHUB_OUTPUT"
          echo "qualification_attempt=$(node -p 'JSON.parse(require("fs").readFileSync("verified-ci.json")).qualification.run_attempt')" >> "$GITHUB_OUTPUT"
          echo "release_id=${{ github.repository_id }}:$(node -p 'JSON.parse(require("fs").readFileSync("verified-ci.json")).run_id'):$(node -p 'JSON.parse(require("fs").readFileSync("verified-ci.json")).run_attempt'):lyrics-image" >> "$GITHUB_OUTPUT"

      - name: Download the exact verified run's image manifest
        uses: actions/download-artifact@v4
        with:
          name: lyrics-image
          run-id: ${{ steps.evidence.outputs.run_id }}
          github-token: ${{ github.token }}
          path: verified-image

      - name: Download the complete qualification from its verified attempt
        uses: actions/download-artifact@v4
        with:
          name: production-qualification-${{ steps.evidence.outputs.qualification_attempt }}
          run-id: ${{ steps.evidence.outputs.qualification_run_id }}
          github-token: ${{ github.token }}
          path: verified-qualification

      - name: Bind complete qualification to the tested image source
        run: node scripts/verify_qualification.mjs verified-qualification/qualification.json verified-image/lyrics-image.json verified-ci.json

      - name: Require immutable image promotion configuration
        env:
          IMAGE_REPOSITORY: ${{ vars.RENDER_IMAGE_REPOSITORY }}
          TESTED_SHA: ${{ steps.sha.outputs.sha }}
          VERIFIED_RELEASE_ID: ${{ steps.evidence.outputs.release_id }}
        run: |
          node scripts/image_release.mjs url verified-image/lyrics-image.json "$TESTED_SHA" "$IMAGE_REPOSITORY" "$VERIFIED_RELEASE_ID" > image-url.txt

      # THREE ANSWERS, NEVER COLLAPSED (the shape mcp/check_live.mjs uses):
      # 0 DEPLOY, 10 STAND DOWN — a newer commit's run will deploy — and any other code a
      # real error. A stand-down is not a failure and must not paint the run
      # red, or people learn to ignore the colour. The guard's own first line
      # is carried to the Stood down step so the reason is the guard's, not a
      # paraphrase.
      - name: May this verified image be deployed? (the main ordering guard)
        id: guard
        run: |
          set +e
          out=$(LAST_DEPLOYED_SHA="" BUILT_SHA="${{ steps.sha.outputs.sha }}" scripts/deploy_guard.sh --verbose 2>&1)
          rc=$?
          set -e
          echo "$out"
          case $rc in
            0)  echo "go=yes" >> "$GITHUB_OUTPUT" ;;
            10) echo "go=no"  >> "$GITHUB_OUTPUT"
                echo "why=$(printf '%s\n' "$out" | grep -m1 'STAND DOWN')" >> "$GITHUB_OUTPUT" ;;
            *)  echo "deploy_guard failed with $rc"; exit $rc ;;
          esac

      # A MISSING SECRET MUST BE LOUD. Without this step an unset hook makes
      # curl POST to the empty string, and the most likely outcome is a job
      # that looks like it deployed and did not — the silent-failure class this
      # whole file exists to end. It is checked only on the path that would use
      # it, so a stand-down never fails for a secret it was never going to send.
      - name: The deploy hook must be configured
        if: steps.guard.outputs.go == 'yes'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "REFUSED — the repository secret RENDER_DEPLOY_HOOK_URL is unset."
            echo
            echo "  The migrated service must disable alternate deployment routes. This is the"
            echo "  path to a deploy. With no hook the connector silently stops"
            echo "  tracking main — which the nightly's mcp/check_live.mjs would"
            echo "  eventually report as DRIFT, hours later and one layer away."
            echo
            echo "  Render dashboard -> migrated IMAGE-backed service -> Settings -> Deploy Hook,"
            echo "  then add the URL as the repository secret RENDER_DEPLOY_HOOK_URL."
            exit 1
          fi

      # Promote exactly the image tested in the verified run. The ordering guard
      # prevents a completed older run from rolling the service back.
      - name: Deploy
        if: steps.guard.outputs.go == 'yes'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          # This hook must belong to an image-backed service configured for the
          # same repository. Render rejects imgURL on mismatched repositories.
          image_url=$(cat image-url.txt)
          code=$(curl --max-time 60 -sS -o /tmp/deploy.json -w '%{http_code}' --get \
            --data-urlencode "imgURL=$image_url" -X POST "$HOOK")
          echo "HTTP $code"
          cat /tmp/deploy.json 2>/dev/null || true
          echo
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "REFUSED — Render did not accept the deploy (HTTP $code)."
            echo "  The connector is still serving whatever it served before this run."
            exit 1
          fi
          echo "Render accepted a deploy of $SHA."
          echo "Waiting for the live identity, readiness and configuration checks below."

      - name: Verify the deployed runtime
        if: steps.guard.outputs.go == 'yes'
        env:
          TESTED_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          npm --prefix mcp ci --no-audit --no-fund
          deadline=$((SECONDS + 1800))
          until node mcp/check_live.mjs --commit="$TESTED_SHA" --ready --config=render --image-manifest=verified-image/lyrics-image.json; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo '::error::Render did not serve the verified commit and configuration within 30 minutes'
              exit 1
            fi
            sleep 30
          done

      - name: Stood down
        if: steps.guard.outputs.go == 'no'
        env:
          WHY: ${{ steps.guard.outputs.why }}
        run: |
          echo "No deploy. ${WHY}"
          echo "Either main has moved past the commit this run validated (the newer"
          echo "commit's own CI run deploys it), or Render was already asked to build"
          echo "exactly this sha (a re-run of a push's CI run — M-187 (b))."
