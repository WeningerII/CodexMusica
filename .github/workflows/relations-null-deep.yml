name: Relations null deep tier (weekly, report-only)

# Runs `quality/relations_null.py --verify --deep` on main, keeps what it
# printed, and opens an issue when the frozen MENU_SILENT / OFF_MENU_MOVERS
# tables no longer match the measurement (#656).
#
# WHY IT IS SEPARATE FROM ci.yml. CI runs only the ~5 s census tier
# (`--verify`). The deep tier re-runs a full sweep at LEDGER_REPLICATES and
# takes about 78 minutes of one CPU (measured twice on 2026-11-04: 77.7 and
# 76.0 min wall, #656). OFF_MENU_MOVERS was last re-recorded on 2026-08-23
# (MENU_SILENT was last edited by hand on 2026-09-15), the reader and the
# registry moved under both, and 54 rows had drifted when the tier was next
# run on 2026-11-04. A weekly
# run means drift is found within a week, and is found by a run, not by
# whoever next remembers the flag.
#
# REPORT-ONLY, AND THAT IS THE CONTRACT. This workflow:
#   * never runs on a pull request or a push, so no merge ever waits on it;
#   * never edits a table. `--verify --record` prints the measured tables,
#     and they are re-pinned by a person after each row has been read (the
#     ledger's own rule: a table a program rewrites whenever it disagrees with
#     itself is a cache, not a ledger);
#   * finishes green when it found drift, because drift is a finding to read,
#     not a broken build. It finishes red only when it could not produce a
#     verdict (refused, timed out, or crashed), and it opens an issue then too.
#
# THE SCHEDULE IS ON. John turned it on on 2026-11-05, in R2's session (#776).
# The cost was about 78 CPU-minutes a week, measured in a container; the first
# hosted run took 51.8 minutes (#656 6668462710). It still runs by hand too
# (workflow_dispatch). The minute is not :00, following ci.yml's note on
# contended cron minutes.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '41 5 * * 0' # Sundays 05:41 UTC

permissions:
  contents: read
  issues: write

# One deep run at a time. A second dispatch waits for the first rather than
# cancelling it: a cancelled 78-minute run is 78 minutes with no receipt.
concurrency:
  group: relations-null-deep
  cancel-in-progress: false

jobs:
  deep:
    name: verify --deep
    runs-on: ubuntu-24.04
    # Measured locally on 2026-11-04: 77.7 and 76.0 min wall (#656). The step bound
    # below is 150 min; this leaves room for setup and the issue step.
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.16'
          architecture: 'x64'

      - name: Install the exact runtime dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r "$GITHUB_WORKSPACE/mcp/requirements-runtime.txt"

      - name: Stage the pronunciation dictionary
        working-directory: lyric-harness
        run: python3 -c "import lyric_harness; lyric_harness.fetch_data()"

      - name: Run the deep tier and keep its receipt
        id: deep
        working-directory: lyric-harness
        run: |
          out="$GITHUB_WORKSPACE/relations-null-deep"
          mkdir -p "$out"
          started=$SECONDS
          set +e
          timeout 150m python3 quality/relations_null.py --verify --deep > "$out/verify_deep.txt" 2> "$out/verify_deep.stderr"
          rc=$?
          set -e
          wall=$((SECONDS-started))
          # 0 = every marker holds; 1 = drift (a finding); 2 = the slice is
          # missing (refused); 124 = the 150-minute bound; anything else = a crash.
          case "$rc" in
            0) verdict=holds ;;
            1) verdict=drift ;;
            2) verdict=refused ;;
            124) verdict=timed_out ;;
            *) verdict=crashed ;;
          esac
          printf '{"version":1,"commit":"%s","run_id":"%s","run_attempt":"%s","exit_code":%s,"verdict":"%s","wall_s":%s,"bound_s":9000}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$rc" "$verdict" "$wall" > "$out/receipt.json"
          markers=$(grep -c ' GAINED \| LOST \|: recorded \|ABSENT from\|CANNOT OBTAIN splits\|EXTENDABLE is ' "$out/verify_deep.txt" || true)
          echo "relations_null --verify --deep: $verdict (exit $rc) after ${wall}s; ${markers} marker line(s)"
          {
            echo "### relations_null --verify --deep"
            echo ""
            echo "Commit \`${GITHUB_SHA::10}\`: **$verdict** (exit $rc) after ${wall}s, ${markers} marker line(s)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "markers=$markers" >> "$GITHUB_OUTPUT"

      - name: Retain the receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relations-null-deep-${{ github.run_id }}-${{ github.run_attempt }}
          path: relations-null-deep/
          retention-days: 90
          if-no-files-found: error

      # One open issue per kind of outcome, not one per week: a later run
      # comments on the open issue instead of opening a second one.
      - name: Open or update an issue when the run did not hold
        if: always() && steps.deep.outputs.verdict != 'holds'
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.deep.outputs.verdict || 'crashed' }}
          RC: ${{ steps.deep.outputs.rc || 'none' }}
          MARKERS: ${{ steps.deep.outputs.markers || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$VERDICT" = drift ]; then
            title="relations_null deep tier: MENU_SILENT / OFF_MENU_MOVERS drifted"
          else
            title="relations_null deep tier: no verdict ($VERDICT)"
          fi
          body=$(printf '%s\n\n%s\n%s\n%s\n\n%s\n' \
            "The weekly report-only \`--verify --deep\` run on \`${GITHUB_SHA::10}\` finished as **$VERDICT** (exit $RC, $MARKERS marker line(s))." \
            "- Run and retained receipt: $RUN_URL" \
            "- This run changed nothing. Read each marker, then re-pin with \`--verify --record\` in a PR (see #656)." \
            "- Nothing is blocked by this issue." \
            "Opened by .github/workflows/relations-null-deep.yml.")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "commented on #$existing"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Fail only when there is no verdict
        if: steps.deep.outputs.verdict != 'holds' && steps.deep.outputs.verdict != 'drift'
        run: |
          echo "relations_null --verify --deep produced no verdict: ${{ steps.deep.outputs.verdict || 'crashed' }}"
          exit 1
