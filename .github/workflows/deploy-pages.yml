name: Deploy Pages

# Rebuilds codex.html from source (references/*.js + src/) and publishes it to
# GitHub Pages on every push to the production branch. Because the site is built
# fresh here, the live page can never go stale even if a committed codex.html
# lags behind the source data.
#
# ONE-TIME SETUP (repo Settings → Pages):
#   Build and deployment → Source → "GitHub Actions"
# (Switching off "Deploy from a branch / main" is what lets this workflow drive
# the site. Until that toggle is flipped, the deploy step will fail.)

on:
  push:
    branches: [claude/loving-hawking-vq5m4] # production / default branch — change here if it moves
  workflow_dispatch: {}

# Least-privilege token plus the Pages/OIDC scopes the deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let an in-flight deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build codex.html from source into _site/
        run: |
          mkdir -p _site
          CODEX_OUT_DIR="$PWD/_site" node scripts/build_html.js --check
          # Serve the app at the Pages root too, so both the bare URL and
          # /codex.html resolve to the same single-file build.
          cp _site/codex.html _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
