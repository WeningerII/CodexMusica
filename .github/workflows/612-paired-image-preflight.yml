name: Issue 612 paired image preflight

# Isolated preparation only. Independent image/fixture review must precede
# the separate same-host campaign. No deploy, registry push or qualification.
on:
  push:
    branches: ['codex/612-paired-hosted-once-v1']
permissions:
  contents: read
  packages: read
  actions: read
concurrency:
  group: issue-612-paired-image-preflight
  cancel-in-progress: false
jobs:
  inventory:
    if: >-
      github.repository == 'WeningerII/CodexMusica' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/612-paired-hosted-once-v1' &&
      github.event.created == true &&
      github.event.deleted == false &&
      github.event.forced == false &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      BEFORE_SHA: 99c1586bfc994fd1b138632fe8c7845b40072142
      AFTER_SHA: 960dd1820a643610ec69b782f4715821c1dcb6a8
      BASELINE_DIGEST: sha256:f314ffd665dfc617d22b24c75e03ecb563452c0756b20bfb7f3314d887580954
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: diagnostic
      - name: Validate immutable baseline input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASELINE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p evidence
          git -C diagnostic rev-parse HEAD > evidence/protocol-source.txt
          sha256sum diagnostic/.github/workflows/612-paired-image-preflight.yml diagnostic/scripts/paired_image_inventory.py diagnostic/scripts/collect_paired_images.py > evidence/instrument-sha256.txt
          python3 - <<'PYMETA'
          import json, os, platform
          from pathlib import Path
          keys = ('GITHUB_SHA', 'GITHUB_REF', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_REPOSITORY',
                  'RUNNER_NAME', 'RUNNER_OS', 'RUNNER_ARCH', 'RUNNER_ENVIRONMENT', 'ImageOS', 'ImageVersion',
                  'BEFORE_SHA', 'AFTER_SHA', 'BASELINE_DIGEST')
          Path('evidence/inputs-and-host.json').write_text(json.dumps({
              'environment': {k: os.environ.get(k) for k in keys}, 'host': platform.uname()._asdict(),
              'baseline_receipt_artifact': 13882889682, 'baseline_ci_run': 43073617924,
              'baseline_log_job': 130710784507}, indent=2))
          PYMETA
      - name: Prepare bounded artifact-access canary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact-access-canary
          printf '%s:%s:%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > artifact-access-canary/identity.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: artifact_access
        with:
          name: issue-612-access-canary-${{ github.run_attempt }}
          path: artifact-access-canary/identity.txt
          if-no-files-found: error
          retention-days: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.artifact_access.outputs.artifact-id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: artifact-access-readback
          merge-multiple: true
      - name: Verify this run's artifact access before provisioning
        shell: bash
        env:
          CANARY_ID: ${{ steps.artifact_access.outputs.artifact-id }}
          CANARY_DIGEST: ${{ steps.artifact_access.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          cmp artifact-access-canary/identity.txt artifact-access-readback/identity.txt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('evidence/artifact-access.json').write_text(json.dumps({
              'status': 'verified', 'run_id': os.environ['GITHUB_RUN_ID'],
              'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'artifact_id': os.environ['CANARY_ID'],
              'artifact_digest': os.environ['CANARY_DIGEST'], 'scope': 'new same-run canary only'}, indent=2))
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 960dd1820a643610ec69b782f4715821c1dcb6a8
          persist-credentials: false
          path: candidate
      - name: Reclaim only approved hosted runner SDKs and preflight storage
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          df -B1 / /var/lib/docker | tee evidence/disk-before.txt
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
          df -B1 / /var/lib/docker | tee evidence/disk-after.txt
          # Conservative admission threshold, not a guarantee of build space.
          # Local 32 GiB provisioning exhausted disk before assembly completed.
          python3 - <<'PY'
          import shutil
          for path in ('.', '/var/lib/docker'):
              if shutil.disk_usage(path).free < 45 * 1024**3:
                  raise SystemExit('Need at least 45 GiB free before two-image provisioning')
          PY
      - name: Pull immutable baseline and build exact candidate
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$AFTER_SHA"
          baseline="ghcr.io/weningerii/codexmusica/lyrics@$BASELINE_DIGEST"
          docker pull --platform=linux/amd64 "$baseline" 2>&1 | tee evidence/pull.log
          df -B1 / /var/lib/docker > evidence/disk-after-pull.txt
          docker system df > evidence/docker-after-pull.txt
          docker image inspect "$baseline" > evidence/before-image.json
          docker build --platform=linux/amd64 \
            --build-arg RENDER_GIT_COMMIT="$AFTER_SHA" \
            --build-arg BUILD_RELEASE_ID="612-paired-preflight:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
            -f candidate/mcp/Dockerfile -t codex-612-preflight-after candidate \
            2>&1 | tee evidence/build.log
          docker image inspect codex-612-preflight-after > evidence/after-image.json
          df -B1 / /var/lib/docker > evidence/disk-built.txt
      - name: Inventory actual bytes offline for independent review
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          python3 diagnostic/scripts/collect_paired_images.py evidence diagnostic/scripts/paired_image_inventory.py
      - name: Generate global decoded corpus and genuine per-image fixtures
        timeout-minutes: 110
        run: python3 diagnostic/scripts/hosted_paired_fixture_prepare.py evidence fixture-bundle diagnostic/scripts
      - name: Bound and package only new synthetic fixtures
        run: |
          mkdir -p fixture-transfer
          python3 diagnostic/scripts/paired_fixture_archive.py pack fixture-bundle fixture-transfer/fixtures.tar.gz > evidence/fixture-archive.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: fixtures
        with:
          name: issue-612-global-fixtures-${{ github.run_attempt }}
          path: fixture-transfer/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Record fixture transfer identity without approval
        env:
          FIXTURE_ARTIFACT_ID: ${{ steps.fixtures.outputs.artifact-id }}
          FIXTURE_ARTIFACT_DIGEST: ${{ steps.fixtures.outputs.artifact-digest }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('evidence/fixture-transfer.json').write_text(json.dumps({
            'status':'unreviewed', 'run_id':os.environ['GITHUB_RUN_ID'],
            'attempt':os.environ['GITHUB_RUN_ATTEMPT'], 'protocol_sha':os.environ['GITHUB_SHA'],
            'artifact_id':os.environ['FIXTURE_ARTIFACT_ID'],
            'artifact_digest':os.environ['FIXTURE_ARTIFACT_DIGEST'], 'retention_days':1}, indent=2))
          PY
      - name: Final disk and daemon diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          df -B1 / /var/lib/docker > evidence/disk-final.txt 2>&1
          docker system df > evidence/docker-final.txt 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: issue-612-image-preflight-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
