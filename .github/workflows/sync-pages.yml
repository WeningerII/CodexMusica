name: Sync site to Pages branch

# Every push to the production branch rebuilds codex.html from source and
# publishes it to `main` — the branch GitHub Pages serves — so the live site is
# never stale and no manual refresh is needed.
#
# This needs NO Pages settings change: Pages keeps serving `main`; this workflow
# just keeps main's codex.html in lockstep with the production source. (If you
# later point Pages directly at this branch in Settings, you can delete this
# workflow — that's the lower-history-churn option.)

on:
  push:
    branches: [claude/loving-hawking-vq5m4] # production / default branch
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so we can diff this push for changed paths

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site artifacts from source
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -e
          # Everything is staged in _dist/ so the later `git checkout main`
          # never collides with tracked working-tree files.
          CODEX_OUT_DIR="$PWD/_dist" node scripts/build_html.js --check
          test -f _dist/codex.html

          # The static API compile is ~6 min, so only do it when it could have
          # changed: when references/ or the generator changed in this push.
          # Otherwise reuse the API already published on main (always the freshest
          # build, so no drift). Default to rebuild when we can't tell.
          NEED_API_REBUILD=1
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            if git diff --quiet "$BEFORE" "$AFTER" -- references scripts/build_static_api.js; then
              NEED_API_REBUILD=0
            fi
          fi

          rm -rf _dist/api
          if [ "$NEED_API_REBUILD" = "1" ]; then
            echo "Static API: rebuilding (references/ or generator changed, or undetermined)."
            node scripts/build_static_api.js --out=_dist/api
          else
            echo "Static API: references unchanged — reusing api/ already on main."
            git fetch origin main --depth=1 || true
            if git archive origin/main api 2>/dev/null | tar -x -C _dist 2>/dev/null && [ -f _dist/api/index.json ]; then
              echo "Reused api/ from origin/main."
            else
              echo "Could not reuse from main — rebuilding instead."
              node scripts/build_static_api.js --out=_dist/api
            fi
          fi

          node scripts/build_discovery.js --api=_dist/api --out=_dist

          # Contract gate: refuse to publish an API that breaks a documented
          # promise (incomplete count, over-ceiling recipe, unresolvable id).
          # build_static_api.js self-verifies in memory; this re-checks the
          # on-disk artifact that is actually about to go live.
          node scripts/check_api.js --api=_dist/api

          cp AGENTS.md index.html _dist/

      - name: Publish site to main (only if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp _dist/codex.html codex.html
          cp _dist/index.html index.html
          cp _dist/AGENTS.md AGENTS.md
          cp _dist/llms.txt llms.txt
          cp _dist/sitemap.xml sitemap.xml
          rm -rf api && cp -r _dist/api api
          git add -A codex.html index.html AGENTS.md llms.txt sitemap.xml api
          if git diff --cached --quiet; then
            echo "Site unchanged — nothing to publish."
            exit 0
          fi
          git commit -m "Auto-publish site (codex.html + static API) from ${GITHUB_SHA:0:7}"
          git push origin main
