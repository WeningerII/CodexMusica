name: Sync site to Pages branch

# Rebuilds codex.html from source and publishes it + the gate-verified api/ to
# `main` (the branch GitHub Pages serves) — but ONLY after CI passes on the
# production branch, so a red or stale build can never go live.
#
# It triggers on CI *completion* (workflow_run), not the raw push, and the job
# below runs only when that CI run SUCCEEDED — so freshness + faults + every gate
# are green before the artifact ships. This is the in-repo "green before live"
# enforcement; branch protection on production (a repo Setting) is the
# belt-and-suspenders that also stops a direct push from skipping CI entirely.
#
# Needs NO Pages settings change: Pages keeps serving `main`; this keeps main's
# codex.html + api/ in lockstep with the green production source.
#
# ORDERING. "CI passed" is necessary but not sufficient. This job builds the
# commit CI validated and then publishes onto main's tip, and those are different
# trees whenever main advanced in between. Runs are serialized but NOT ordered
# (cancel-in-progress: false), so an older run could land last and overwrite the
# live artifact with a build made before the newer merge existed. That happened
# twice on consecutive merge pairs — dropping a CSS change, then an 823 KB
# nav-glyph data block — and nothing went red, because no gate covered this file.
# scripts/publish_guard.sh now stands the job down when main carries source it
# did not build from, and scripts/check_publish_guard.js holds that behaviour to
# a synthetic replay of the race on every CI run.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main] # production branch GitHub Pages serves
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-pages
  cancel-in-progress: false

jobs:
  sync:
    # TRUST, then freshness. Both conditions below are load-bearing; neither is
    # about build correctness.
    #
    # `conclusion == 'success'` is the freshness half, and it was all this job
    # used to check. That left the trust half open, and it was open wide: this is
    # the `workflow_run` + `checkout head_sha` + `contents: write` triple that
    # GitHub documents as the "pwn request". CI runs on `pull_request` (ci.yml),
    # including from forks. `workflow_run`'s `branches:` filter matches the
    # triggering run's HEAD BRANCH NAME, not its repository — so a fork whose
    # branch is literally named `main` satisfies `branches: [main]` above. That
    # run's completion would fire this job, which checked out the fork's
    # head_sha and executed it (`npm ci` lifecycle scripts, then build scripts)
    # while holding a contents:write token that actions/checkout has already
    # persisted into .git/config. An outsider needed no credentials to get a
    # write-scoped token and a push to the branch Pages serves — and, via
    # render.yaml's autoDeploy on main, to the deployed connector.
    #
    # So: publish only for a CI run that was triggered by a PUSH (never a
    # pull_request, whose head is by definition proposed rather than merged) to
    # THIS repository (never a fork). head_repository is the run's source repo;
    # comparing full_name is what distinguishes WeningerII/CodexMusica from
    # anyone/CodexMusica.
    #
    # workflow_dispatch stays allowed: it carries no workflow_run payload, and
    # dispatching a workflow already requires write access to this repo.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Check out the EXACT commit CI just validated — not the branch tip, which
          # may have advanced. Manual dispatch falls back to the chosen ref.
          #
          # This is only ever first-party code now: the `if:` above admits pushes
          # to this repository and manual dispatch, nothing else.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # --ignore-scripts, defensively. The gate above is what keeps untrusted
      # code out of this write-privileged job; this is the second lock on the
      # same door, because `npm ci` running lifecycle scripts is the cheapest
      # payload site in any repo (a root `postinstall`, or a dependency's).
      # Nothing this job runs needs them: build_html.js, build_discovery.js and
      # check_api.js import only Node built-ins and repo modules. The native
      # dependency that would care — sharp — is used exclusively by the
      # occasional `assets:*` builders, which never run here.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build site artifacts from source
        run: |
          set -e
          # Everything is staged in _dist/ so the later `git checkout main`
          # never collides with tracked working-tree files.
          CODEX_OUT_DIR="$PWD/_dist" node scripts/build_html.js --check
          test -f _dist/codex.html

          # Publish the committed api/ from THIS ref — never rebuild, never reuse
          # main's. The CI `freshness` job byte-diffs the committed api/ against a
          # fresh build on every PR, so whatever merged here is provably what a
          # fresh build produces: there is nothing to recompile and no way to
          # publish a stale API.
          #
          # (The old heuristic rebuilt only when references/ or build_static_api.js
          # changed and otherwise reused main's api/. That silently shipped STALE
          # recipes whenever the recipe ENGINE changed — _loader/search/score/
          # translate/_merge — without a references/ edit, because the engine is
          # not under references/; a failed or superseded prior sync could also
          # drop a push's data from the reuse. Publishing this ref's gate-verified
          # api/ closes both holes.)
          rm -rf _dist/api
          cp -r api _dist/api
          test -f _dist/api/index.json

          node scripts/build_discovery.js --api=_dist/api --out=_dist

          # Contract gate: refuse to publish an API that breaks a documented
          # promise (incomplete count, over-ceiling recipe, unresolvable id).
          # build_static_api.js self-verifies in memory; this re-checks the
          # on-disk artifact that is actually about to go live.
          node scripts/check_api.js --api=_dist/api

          cp AGENTS.md index.html _dist/

      - name: Publish site to main (only if changed, and only if not superseded)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Capture what we ACTUALLY built, before switching branches. Everything
          # below used to read HEAD after `git checkout -B main`, which reports
          # main's tip rather than the ref that produced _dist/ — that is why the
          # auto-publish commit message named a commit it had never built from,
          # and why two stale publishes went unnoticed.
          export BUILT_SHA
          BUILT_SHA=$(git rev-parse HEAD)
          echo "Built from $BUILT_SHA"

          git fetch origin main

          # Stand down if main moved past us. Publishes are serialized but not
          # ordered, so an older run can otherwise land last and overwrite the
          # live artifact with a build made before the newer merge existed.
          # Exit 10 means superseded — a clean no-op, not a failure: the newer
          # commit has its own CI run and that run publishes it.
          rc=0
          bash scripts/publish_guard.sh --verbose || rc=$?
          if [ "$rc" = 10 ]; then
            echo "Superseded — leaving the live artifact to the newer run."
            exit 0
          elif [ "$rc" != 0 ]; then
            echo "publish_guard failed with $rc" >&2
            exit "$rc"
          fi

          git checkout -B main origin/main
          cp _dist/codex.html codex.html
          cp _dist/index.html index.html
          cp _dist/AGENTS.md AGENTS.md
          cp _dist/llms.txt llms.txt
          cp _dist/sitemap.xml sitemap.xml
          cp _dist/robots.txt robots.txt
          # server.json is generated by build_discovery.js alongside the three
          # above. It was previously hand-edited and never published from here,
          # which is how the registry manifest came to advertise a catalog size
          # and a version that had both been wrong for releases.
          cp _dist/server.json server.json
          rm -rf api && cp -r _dist/api api
          git add -A codex.html index.html AGENTS.md llms.txt sitemap.xml robots.txt server.json api
          if git diff --cached --quiet; then
            echo "Site unchanged — nothing to publish."
            exit 0
          fi
          # Name the ref we BUILT from, not main's tip. The old message read HEAD
          # after the branch switch, so it always named main and could never
          # reveal that the artifact came from somewhere older.
          git commit -m "Auto-publish site (codex.html + static API) built from ${BUILT_SHA:0:7}"
          # A plain push, deliberately. The commit's parent is the origin/main we
          # just fetched, so if main advanced in the seconds since the guard ran,
          # this is no longer a fast-forward and git refuses it — which is the
          # outcome we want. Never force onto the production branch: the guard
          # closes the wide window, and non-fast-forward closes the narrow one.
          git push origin main
