name: Hold incompatible Library release

# One-time hold for the already-running release that omits the admitted
# Library snapshot. Remove this file after its cancellation is confirmed.
on:
  push:
    branches: ['codex/library-site-2026-10-08']
    paths: ['.github/workflows/library-release-hold.yml']

permissions:
  actions: write

jobs:
  hold:
    if: github.repository == 'WeningerII/CodexMusica' && github.ref == 'refs/heads/codex/library-site-2026-10-08'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const owner = 'WeningerII';
            const repo = 'CodexMusica';
            const run_id = 37815352808;
            const expectedSha = '00164b5f5ffd4a1f7234d1fd1d850746244d0005';
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id });
            if (run.name !== 'Production qualification' || run.head_branch !== 'main' ||
                run.head_sha !== expectedSha || run.repository.full_name !== `${owner}/${repo}` ||
                run.event !== 'workflow_dispatch') {
              throw new Error('The incompatible qualification identity changed; refusing cancellation.');
            }
            if (run.status === 'completed') {
              if (run.conclusion === 'cancelled') {
                core.info('The exact incompatible qualification is already cancelled.');
                return;
              }
              throw new Error(`The qualification already completed (${run.conclusion}); inspect promotion before proceeding.`);
            }
            await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id });
            core.info(`Cancelled exact incompatible qualification ${run_id} at ${expectedSha}; retain snapshot 5226 before promotion.`);
