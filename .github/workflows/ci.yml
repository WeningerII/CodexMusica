      #
      # THIS IS THE ARGUMENT THE COMMENT BELOW ANTICIPATED. It says a
      # requirements file here "is a change worth arguing rather than a line to
      # add here" — and the argument resolves the other way: the boundary is
      # right and this step was on the wrong side of it. `record` stays
      # stdlib-only. `suites` already installs nltk and stages the tagger model
