      # point. `main()` exits 1 on any FAIL, which is right for a human. But
      # one FAIL is standing and TRUE -- corpus/fas_hafez.LICENSE.txt is an
      # English licence document under corpus/, so the D check is correct to
      # call it declared `fas` and unreadable. Gating on that paints the job
      # permanently red on a finding nobody intends to close, and a
      # permanently red gate is one nobody reads. `--verify-shape` asks what
      # CI can actually answer: has the shape MOVED since the record was
      # written? Proven red on injected drift before this step was added.
      # ~3 minutes over 26 MB.
      - name: Corpus audit against RESULTS_CORPUS_AUDIT.md's committed shape
        if: always()
        working-directory: lyric-harness
        run: python3 quality/audit_corpus.py --verify-shape

      # THE 律詩 POSITIVE CONTROL's INGESTION. Added 2026-08-13, and it is the
      # third instrument found the same day that printed its own drift and
      # could not act on it: `main()` returned None and `sys.exit` was never
      # called with a code, so this exited 0 while printing `RECORDED 99.3%`
      # beside a measured 99.9% and `RECORDED ... 88.0%` beside a measured
      # 90.0%. Nothing ran it, so nobody read the comparison it was printing.
      #
      # `--check` pins only the DETERMINISTIC quantities -- the poem count and
      # the coverage numerator/denominator -- because the agreement rate rides
      # a permutation draw. The null verdict is left to the printed p, which is
      # at its floor either way and is not what drifted. `--check` also caps
      # the replicate count, since the draw costs the runtime and the check
      # does not read it: effectively instant. Proven red on an injected
      # figure before wiring.
      # REMOVED FROM CI 2026-08-14, and NOT because the check is bad.
      #
      # ~~- name: Tang rime-table ingestion against its committed shape~~
      #
      # The 全唐诗 pool this arm reads is an absolute path OUTSIDE this
      # repository — `TANG_POOL` overrides it — and no CI job fetches it. On
      # the runner the glob matched nothing, `tang_poems()` returned [], and
      # the coverage line divided by zero: a MISSING CORPUS crashing on an
      # arithmetic line, which reads as a defect in the statistic rather than
      # in the environment. It passed locally for the whole time it was wired,
      # because the pool is on the machine it was written on.
      #
      # The crash is fixed at the source — `audit_tang_null.py` now REFUSES
      # with exit 2 and names the override (doctrine 20: nothing was measured,
      # so nothing moved). But a step that can only ever exit 2 here is a
      # permanently-red gate, which is the thing this file argues against
      # forty lines up. So the step goes rather than the check.
      #
      # THIS IS DOCTRINE 92's SHAPE: the check is admissible and the corpus is
      # reachable, and they are not reachable in the same place. Run it wherever
      # TANG_POOL points at a chinese-poetry checkout; re-wire it here the day
      # the corpus is fetchable from CI, not before.

      # THE POOLED-FISHER H0 CALIBRATION. Added 2026-08-13, and it checks a
      # DIRECTION rather than a number, on purpose: every figure this script
      # prints is a Monte Carlo estimate, so pinning one to three decimals
      # would pin a sample and fail on the seed -- doctrine 57's own warning,
      # applied to the file that raises it.
      #
      # The two directions are what the record actually rests on. (1) The
      # per-item p under H0 is NOT uniform -- Fisher requires U(0,1) and the
      # median measures 0.56-0.58 -- which is doctrine 74 and the reason
      # RESULTS_FWER's pooled 0.950 was ~1-in-12 rather than 1-in-20. (2) The
      # recorded 0.701 sits in the upper tail, not the body.
      #
      # NOTE WHAT A RED HERE WOULD MEAN: if somebody fixes the pairing that
      # causes the non-uniformity, this check SHOULD fail, and the right
      # response is to repin the record -- not to widen the tolerance. The
      # check says so in its own failure text. ~26 s at a declared reps=50.
      - name: Pooled-Fisher H0 calibration still reads as the record describes
        if: always()
        working-directory: lyric-harness
        run: python3 quality/audit_time_pooled_null.py --check

      # THE KALEVALA ALLITERATION COUNTS. Added 2026-08-13, and this one IS
      # number-pinnable where the pooled-Fisher check next door is not: the
      # alliteration counts are exact over a fixed window, so `--check` pins
      # them and leaves the null medians (samples) to the printed p.
      #
      # It had drifted, and the script had been announcing the drift to itself:
      # it printed `verse lines extracted: 22795   (data/sources.tsv records
      # 22,822)` on every run and exited 0 anyway, because `main()` returned
      # None and `sys.exit` was never called with a code. 3,246 of the first
      # 4,000 is now 3,253 -- 81.2% -> 81.3%. Repinned in METHOD.md,
      # POSITIVE_CONTROL.md and NULL_AUDIT.md the same day.
      #
      # §2.2's actual finding is untouched: the within-line shuffle is still a
      # no-op on 4000/4000 and 22795/22795 lines, because the statistic reads
      # CO-MEMBERSHIP and no permutation of a line's words changes which
      # initials share it. 81.3% against a null median of ~30% is not sensitive
      # to a tenth of a point; what it IS sensitive to is whether the recorded
      # number is the one the code produces. ~5 s. Proven red before wiring.
      - name: Kalevala alliteration counts against their committed values
        if: always()
        working-directory: lyric-harness
        run: python3 quality/audit_kalevala_null.py --check

      # DOCTRINE 31, whose instrument had no caller and exited 0 whatever it
      # printed — in a repo whose own reading order says "About to believe a
      # null: 31, 71 and 76, in that order". 35 s, stdlib only, needs nothing
      # but the repo. It pins THRESHOLDS AND ORDERINGS, not cells, and that is
      # deliberate: a ten-seed sweep found the recorded 0.82 power at c=0.75 is
      # the MAXIMUM of ten draws (median 0.74, only 2 of 10 reach 0.80), so a
      # check pinning the cell would have been red on nine seeds out of ten.
      # The ceiling has zero spread across those seeds and the floor 0.00-0.08,
      # so those are pinned as bounds and verified green on 10/10.
      # Part B is NOT here: its corpus lives outside the repo and is not
      # fetched by CI, so it would exit 2 (CANNOT TELL) on every run, and a
      # step that permanently cannot tell is decoration.
      - name: The positive control's own instrument (doctrine 31/76)
        if: always()
        working-directory: lyric-harness
        run: python3 quality/positive_control.py --check

      # ADVERSARY 4's AIM. Added 2026-08-14. 0.06 CPU-s — the cheapest step in
      # this job and, per CPU-second, the most informative one in the file.
      #
      # quality/mutate.py declares 58 mutations (33 M-series, 25 Q-series,
      # across 7 target files) and every one is anchored on an EXACT TEXT MATCH
      # in the file it mutates — not a name, not a line number, a literal
      # source fragment. So an ordinary, correct, well-reviewed edit to a
      # comparator silently DETACHES the mutation that was measuring that
      # comparator's test coverage. Nothing else in the repo notices: the
      # mutation stops being applied, the sweep reports on whatever still
      # attaches, and the score drops without anybody reading the drop as a
      # loss of coverage. mutate.py's own taxonomy calls this STALE and names
      # the remedy (re-anchor, or retire with a reason).
      #
      # THREE DRIFTED IN 24 HOURS. That is this repo's measured rate, not a
      # hypothetical, and it is why `--dry-run` earns a step of its own:
      # it re-reads the shipped sources and re-applies all 58 anchors, so it
      # answers "is adversary 4 still pointed at the code?" FROM THE CODE on
      # every run. It is the only carrier of that fact that cannot be silenced
      # by writing a file — a committed score can be repinned, an anchor that
      # no longer matches cannot be argued with.
      #
      # Verified green 2026-08-14 before wiring: `57/57 mutations apply
      # cleanly, M-series 33, Q-series 24 across 7 target file(s)`.
      #
      # TRAP, VERIFIED 2026-08-14: `mutate.py --dry-run | head -1` exits 1 via
      # SIGPIPE on the CLEAN path — head closes the pipe, Python takes EPIPE,
      # and a green run reports red. DO NOT PIPE THIS STEP. It is deliberately
      # run bare, and this comment is here so the next person to "just add a
      # `| tail`" finds out from the file rather than from a red build.
      - name: Mutation anchors still apply (all 58 — adversary 4 is still aimed at the code)
        if: always()
        working-directory: lyric-harness
        run: python3 quality/mutate.py --dry-run

      # The other half of the pair, and a different question. `--dry-run` above
      # proves the anchors ATTACH; this proves the LIST is coherent — that each
      # declared mutation exists, that it reverts the thing its name says it
      # reverts, and that it targets the SHIPPED comparator rather than a copy.
      # Sections 1-3 only: it reads the list and the source and forks nothing.
      # 0.06 CPU-s, MEASURED 2026-08-14, green (`the mutation list is well
      # formed and every anchor still applies`).
      #
      # `--static` IS LOAD-BEARING, not tidiness. Bare `python3
      # quality/test_mutation.py` runs the FULL SWEEP at
      # `--jobs=os.cpu_count()`, forking the whole test suite once per
      # mutation — mutate.py prices the honest version of that instrument at
      # ~53 CPU-minutes. That is a nightly or a human's machine, never a step
      # in a job budgeted in seconds. This is why test_mutation.py is also
      # deferred by name in the `suites` job: a bare glob would have run the
      # sweep on every pull request.
      - name: Mutation list is well formed (static — no sweep, forks nothing)
        if: always()
        working-directory: lyric-harness
        run: python3 quality/test_mutation.py --static

      # THE HAFEZ RADIF AND QĀFIYA RATES against their committed values.
      # Added 2026-08-14. 15.79 CPU-s, MEASURED.
      #
      # quality/phonology/fas.py produces three rates this project has started
      # quoting — radif detected in 315 of 495 ghazals, a rhymes()
      # None/True/False split of 60.2/38.8/1.0% over 20,388 pairs, and a
      # seven-point threshold sweep — and every one of them was a bare rate
      # with no automated witness. `--check` pins the DETERMINISTIC half: the
      # detected counts and every cell of the sweep. It leaves the null medians
      # to the printed p, because those ride a permutation draw and pinning a
      # sample fails on the seed (doctrine 57) — the same line
      # audit_time_pooled_null.py draws next door, for the same reason.
      #
      # Verified green 2026-08-14 before wiring: RESULT: PASS, with every sweep
      # cell [ok] against its committed count (318/318/315/311/310/306/301/297).
      - name: Hafez radif/qāfiya rates against their committed values
        if: always()
        working-directory: lyric-harness
        run: python3 quality/hafez_rate.py --check

      # The same 495 ghazals through the OTHER instrument, and it is a separate
      # question rather than a duplicate of the step above: hafez_rate.py
      # checks the rates `phonology/fas.py` reports, this checks the radif
      # AUDIT's own threshold ladder (mf=0.50 upward — 311/311/309/306/300/297,
      # a different ladder over the same corpus). Either can move without the
      # other, and a check that only watched one would call that agreement.
      # 0.24 CPU-s, MEASURED 2026-08-14. Verified green before wiring.
      - name: Hafez radif audit against its committed sweep
        if: always()
        working-directory: lyric-harness
        run: python3 quality/audit_hafez_radif.py --check

      # SANSKRIT PRĀSA. Added 2026-08-14. 0.68 CPU-s, MEASURED.
      #
      # Two input modes, and the cheap one is what runs here. `--check` alone
      # reads `corpus/san_dcs_verse.txt` — the slice this runner itself stages,
      # TRACKED IN GIT, carrying all 1,930 recovered half-verses — so it needs
      # no DCS clone. `--check ROOT` additionally re-derives the ingestion-side
      # figures from a full checkout; a slice-only run prints those ten rows as
      # [SKIP] and never as [ok], so the reduced scope is disclosed rather than
      # silently passed. The default full run draws 1,000 permutations and takes
      # ~27 minutes, which is why `check()` draws no null at all.
      #
      # It also pins doctrine 79's four-tuple (mandated, judged, refused,
      # carrying) for all six variants at both units, which is how the
      # measurement that matters here became mechanical: the published V1 rate
      # refuses 2 of 1,930 and is safe, but V2 refuses 592 of 1,930 — a Sanskrit
      # pāda opening on a vowel has no initial consonant to share — so its rate
      # reads 3.23 points low against a MANDATED denominator. No published
      # figure moved; the refusal count is now checked rather than invisible.
      - name: Sanskrit prāsa figures against their committed counts
        if: always()
        working-directory: lyric-harness
        run: python3 quality/prasa_rate.py --check

      # THREE PINS NOTHING ASKED, ADDED 2026-08-22, and the way they were
      # found is the point. `quality/pin_sweep.py` (MISSING.md M-21) walks
      # every pin-holding file under `quality/` and runs its own `--check`;
      # its first full run measured 30 such files against the 23 this
      # workflow named, and the difference is not a rounding error — it is
      # pins that NOTHING gates. These three HOLD today, so adding them costs
      # no red and closes the gap.
      #
      # TWO OF THE FIVE ARE DELIBERATELY NOT ADDED HERE. `expected_drift.py`
      # needs an instrument argument and is already reached through
      # `song_profile_calibration.py --check` below. `phrase_commonplace.py`
      # is DRIFTED — 143 authors / 991,751 tokens / 152,154 lines against a
      # measured 1,297 / 1,885,292 / 283,301 — because its pins are exact
      # over a FIXED corpus that has since grown ninefold, and its own test
      # suite passes while never invoking `--check` at all. Adding it would
      # land a red job whose remedy is re-running a whole study; the finding
      # is recorded in M-21 and the re-run is somebody's decision.
      # AND THE GATE COULD NOT TELL A REFUSAL FROM A DRIFT — FIXED 2026-08-23.
      # The three commands ran under `bash -e` as a bare list, so the step
      # asked ONE question of three instruments and read the answer off the
      # first non-zero exit. `audit_tang_null.py --check` REFUSES at 2 on
      # every runner: the 全唐诗 pool is an absolute path outside this
      # repository, overridable by `TANG_POOL`, fetched by no CI job, and the
      # instrument says so in as many words — *"Nothing was measured, so
      # nothing moved (doctrine 20)"*. That refusal was rendered as a red
      # step, which is doctrine 79's own error at the gate: a refusal in the
      # numerator, charged to the layer that did not fail.
      #
      # IT COST THE OTHER TWO ENTIRELY. `-e` aborts the step at the first
      # non-zero, so `kalevala_rate.py` and `run_positive_control.py` — two
      # pins that CAN run here — were never invoked on any run since this
      # step was added (2026-08-22, on a machine that had the pool: "these
      # three HOLD today, so adding them costs no red"). A check that can only
      # pass in one environment is not testing the thing it names, and this
      # one took two working checks down with it.
      #
      # THREE VERDICTS, NEVER SUMMED — `pin_sweep.py`'s own vocabulary, since
      # this step is the same question that tool asks. 0 is HOLDS, 2 is the
      # refusal code every instrument in this repo uses and reads CANNOT RUN,
      # and ANY OTHER non-zero is MOVED and fails. A CANNOT RUN is printed by
      # name with its instrument, so it is disclosed rather than swallowed;
      # the step fails if and only if something MOVED.
      - name: Tang null, Kalevala rate and the positive control — pins nothing asked
        if: always()
        working-directory: lyric-harness
        run: |
          holds=0; moved=0; cannot=0
          for inst in audit_tang_null kalevala_rate run_positive_control; do
            echo "── quality/$inst.py --check"
            set +e
            python3 "quality/$inst.py" --check
            rc=$?
            set -e
            case "$rc" in
              0) holds=$((holds+1)); echo "   HOLDS      $inst.py" ;;
              2) cannot=$((cannot+1)); echo "   CANNOT RUN $inst.py (exit 2 — the instrument REFUSED and named its own reason above; nothing was measured, so nothing moved)" ;;
              *) moved=$((moved+1)); echo "   MOVED      $inst.py (exit $rc)" ;;
            esac
          done
          echo "=============================================="
          echo "HOLDS $holds   MOVED $moved   CANNOT RUN $cannot   (three counts, never summed)"
          if [ "$moved" -gt 0 ]; then
            echo "$moved instrument(s) MOVED — a committed figure no longer reproduces."
            exit 1
          fi

      # THE CONJUNCTIVE BAND'S NEGATIVE CONTROL. 3.86 CPU-s, MEASURED
      # 2026-08-14. The last "prints its own drift and exits 0" runner in the
      # repo, and the one where that mattered most: its figures flipped sign
      # TWICE in three days — +6.7 -> +3.3 (2026-08-10), +6.7 -> +9.3
      # (2026-08-11), +6.7 -> +5.3 (2026-08-13) — and nothing anywhere said so.
      #
      # `--check` pins ONLY the deterministic half: the corpus shape and the
      # four observed capture COUNTS (39/16 Whitman, 449/411 sonnets). Counts
      # rather than rates, so the pin survives the report's one-decimal
      # rendering. It leaves the null medians, BOTH excesses and the p unpinned,
      # because each rides a permutation draw and both sonnet arms sit at
      # 1/(n+1) — an empirical p at the resolution floor reports the resolution,
      # not the effect (doctrine 57).
      #
      # THE TWO `*_captured_off` PINS ARE THE CONTROL ON THE CONTROL, and the
      # failure text says how to read them: if OFF moved, the ingestion or the
      # null machinery moved; if only ON moved, the band's own comparator did,
      # and the Whitman/sonnet split says on which corpus.
      #
      # Exit 2 — not 1 — if the lexicon or either corpus is missing: nothing was
      # measured, so nothing moved. The full n=200 run (196 CPU-s) is wired
      # NOWHERE, not even nightly, because it would buy four null medians and
      # two p-values that `--check` deliberately does not assert: a job that
      # grades nothing.
      - name: Band negative control against its committed capture counts
        if: always()
        working-directory: lyric-harness
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python3 quality/audit_band_control.py --check

      # ADVERSARY 8 — the only adversary that attacks the RECORD rather than the
      # work, and the one that found four false entries in a week. 2.5 CPU-s,
      # MEASURED 2026-08-14.
      #
      # IT WAS ALREADY RUNNING IN CI AND ITS DRIFT WAS STILL INVISIBLE. The
      # `verify_entries.py` step below shells out to this module and parses its
      # printed derivation block, DELIBERATELY DISCARDING ITS EXIT CODE. So it
      # has executed on every push while nothing read its verdict — the "prints
      # its own drift and exits 0" shape, one indirection out, and the reason
      # its own record went three days without a re-run and moved six derivation
      # verdicts.
      #
      # `--check` IS A SEPARATE EXIT PATH AND DOES NOT INHERIT main()'s POLICY,
      # which matters here more than anywhere else in this job: the bare runner
      # exits 1 PERMANENTLY on D8/D9, a standing calibration pair that stays
      # FALSE until MISSING.md M-4 reinstates the Malay row. Gating on the bare
      # runner would install exactly the permanently-red check this file argues
      # against twenty lines up.
      - name: The record against the code (adversary 8)
        if: always()
        working-directory: lyric-harness
        run: python3 quality/audit_register.py --check

      # THE TWO WELSH RUNNERS. 15.79 and 7.26 CPU-s, MEASURED 2026-08-14.
      #
      # These close the repo's last contradiction: one deterministic quantity
      # carried under TWO values for four days. The cynghanedd searched rate was
      # recorded at 54.1% and measures 57.1%, because `skeleton()`'s terminus
      # became a property of the half-line's diweddeb on 2026-08-10 at 21:19 and
      # four documents were written on the wrong side of that change.
      #
      # BOTH PIN COUNTS, NOT RATES. `rates()` used to return tried/judged
      # already divided, throwing away the only exactly-pinnable form of the
      # quantity; it returns integers now and main() divides at the print site,
      # so stdout is byte-identical. `by_type` is pinned as four numbers because
      # a skeleton change moves four, not one — and that is what said the +47
      # went almost entirely to `traws`, whose answer depends on where the span
      # stops, rather than spreading evenly as a loosened threshold would.
      #
      # Published n=200 quantiles are NOT pinned (the same call audit_tang_null,
      # audit_kalevala_null and audit_hafez_radif make). The full n=200 Alun run
      # is 3m40 CPU and is wired nowhere.
      - name: Welsh odl figures against RESULTS_CYM_RHYME.md's committed counts
        if: always()
        working-directory: lyric-harness
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python3 quality/cym_rhyme_rate.py --check

      - name: Cynghanedd search rate against its committed counts (both editions)
        if: always()
        working-directory: lyric-harness
        env:
