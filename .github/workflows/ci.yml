      # ADVERSARY 5 (CLAUDE.md's roster: "the CORPUS"). Added 2026-08-13, and
      # like adversary 7 it had NOTHING running it -- no CI step, no test, no
      # caller, only a `__main__`. Its committed output had drifted unnoticed
