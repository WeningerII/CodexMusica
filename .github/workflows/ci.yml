      # THE TIME LAYER IS STILL MUTE, AND STILL FOR THE RECORDED REASON.
      # 83 CPU-s, MEASURED 2026-08-14 — the most expensive step in this job, and
      # the only one whose headline is a NEGATIVE.
      #
      # THAT IS WHY IT DOES NOT PIN THE RATE. `0.0%` is printed identically by
      # FIVE states: a fired instrument measuring nothing (a real null); an
      # instrument that cannot fire (mute — this layer); an item whose own
      # inventory makes rhyme unsurprising (doctrine 28's refusal); a dead band;
      # a dead corpus. `mean == 0.0%` goes green on all five, which is doctrine
      # 20's false-negative-dressed-as-a-finding exactly.
      #
      # The pin is on the MECHANISM, as an inequality between two measured
      # numbers: `m_needed >= 1` (the item's best pair IS significant before
      # correction, so the correction is what silenced it) AND `share_firable
      # == 0.0` (even the smallest family in the item exceeds that). Together
      # they say mute BECAUSE THE FAMILY IS TOO LARGE and nothing else — each
      # rival state breaks one clause, and `why_mute()` names which.
      #
      # Doctrine 28's two states are pinned as two numbers with no pin reading
      # their total: 18 `cannot tell` and 2 answered-with-an-observed-zero. An
      # 18/0/2 that became 20/0/0 leaves the rate, the p and every mute total
      # untouched and still goes red here.
      #
      # A check that goes green after a widened tolerance on this arm is a claim
      # that the time layer WORKS. The failure text says so, and says that a
      # layer mute for a DIFFERENT reason is a new finding needing a new row in
      # RESULTS_FWER.md rather than a repin.
      - name: The time layer is still mute, and for the recorded reason
        if: always()
        working-directory: lyric-harness
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python3 quality/audit_fwer_fpr.py --check

  # ── The suites: 45 test modules that nothing had ever run ────────────────
  #
  # AND THE CENSUS ITSELF WAS STALE — TWO MORE FILES RAN NOWHERE, FIXED
  # 2026-08-15. `quality/test_*.py` is 48 files. This job named 42 in the cheap
  # step and 2 in the revision step; `test_discriminate.py` and
  # `test_mutation.py` are excluded BY NAME with a measurement, below. That
  # accounts for 46. The remaining two — `test_propose.py` and
  # `test_verify_entries.py` — were accounted for by nothing at all: no step
  # here, no step in `record`, no npm script, no caller. They were written,
  # they were green, and no automated thing had ever executed either one.
  #
  # THIS IS THE FAILURE THE LIST'S OWN DESIGN INVITES, and the file says so
  # eighty lines down: "Named, never globbed". Naming is right — a glob is how
  # test_mutation.py's 53-CPU-minute sweep arrives without anybody deciding it
  # should — but a hand-kept list has the mirror-image defect, which is that a
  # file added later joins nothing and nothing notices, because a list that is
  # short looks exactly like a list that is complete. Same shape as the
  # `master` branch filter at the top of this file: a name matching nothing
  # reads like a name matching everything it was asked about.
  #
  # `quality/test_propose.py` is the one that cost something. CLAUDE.md's
  # proposer-seam paragraph says §7c/§7d are the ONLY assertions that cross the
  # tier-1/tier-2 seam for real — "§7d drives a REAL `revise_loop` into REAL
  # tier 2 through `ModelProposer`, which before this contract landed raised
  # `TypeError` on the first joint conflict WITH BOTH SUITES GREEN". So the
  # single check written because the two flanking suites could not see the
  # defect was itself reachable by no runner: import reachability is not
  # invocation reachability, one level up, at the test file.
  #
  # BOTH PROVEN TWO-SIDED BEFORE WIRING (doctrine 48), by perturbing the
  # shipped source each one guards and confirming a non-zero exit:
  #   * `quality/propose.py`'s `render_pair`, `pivot_word` -> `anchor_word` (the
  #     exact misreading e959706 fixed) -> test_propose.py exit 1, naming the
  #     labelling assertion and the end-to-end tier-2 run. Restored: exit 0.
  #   * `quality/verify_entries.py`'s `_unstrike`, newline-preserving sub -> a
  #     plain " " (the exact defect its own docstring names) ->
  #     test_verify_entries.py exit 1, "a multi-line struck run does not shift
  #     line numbers: reported line [5], wanted 7". Restored: exit 0.
  #
  # COST, MEASURED 2026-08-15 by the convention this block already uses (CPU
  # from rusage, threads pinned, not a wall clock): test_propose.py 39.77
  # CPU-s exit 0, test_verify_entries.py 0.05 CPU-s exit 0.
  #
  # THE CLAIM THIS JOB EXISTS TO CORRECT. The `record` job's comment above
  # ("WHY THESE FOUR AND NOT THE SUITES") excluded every test module here on
  # the ground that "quality/test_revise.py and test_loop.py each take 15+
  # minutes". MEASURED 2026-08-14, sequentially, on an otherwise idle box,
  # threads pinned, CPU taken from rusage rather than a wall clock:
  #
  #     test_loop.py     190.92 CPU-s   exit 0
  #     test_revise.py   183.95 CPU-s   exit 0
  #
  # Three minutes each, both green. NEITHER FILE DECLARES THE 15-MINUTE FIGURE
  # ANYWHERE, and test_loop's own docstring prices a single revision at 40-90s.
  # So the sentence that kept 45 suites out of CI generalised from three
  # expensive things to all of them, and the premise under the generalisation
  # was a number nobody had run. Two independent measurements this session
  # agree to within 2% on every file they share.
  #
  # ZERO FAILURES across all 46. Nothing needed a re-run, which also disposes
  # of the worry that a session of parallel edits had left the suite red.
  #
  # WHY THE FLAGSHIP PAIR IS HERE AND NOT NIGHTLY. test_revise and test_loop
  # are the revision loop -- this project's flagship verb and the thing a
  # writer actually touches. Excluding them on cost would repeat, at 6.2
  # CPU-minutes, exactly the error this header is about.
  #
  # AND THEY ARE NOT EVEN THE EXPENSIVE ONES. This comment said until
  # 2026-08-14 that they were "the two most expensive cheap suites", written
  # while test_verbs.py was the one file nobody had ever timed. It finished at
  # 218.1 CPU-s, exit 0 -- MORE than test_loop (190.92) and test_revise
  # (183.95). So the sentence arguing against pricing-by-impression was itself
  # pricing by impression, in the same paragraph, about the very file whose
  # number was missing. The full order, top of the cheap set: test_verbs 218.1,
  # fwer 48.08, readability 46.38, msa_fin 29.30, g2p 25.21, floor 21.36.
  #
  # WHAT IS DELIBERATELY NOT HERE, each with the reason and its measurement:
  #   test_discriminate.py  ~1055 CPU-s cold, and cold BY DESIGN -- it neither
  #                         reads nor writes data/feature_cache.json under any
  #                         flag, so no cache warms it. Nightly.
  #   test_mutation.py      bare, this is a PARALLEL FULL SWEEP at
  #                         --jobs=os.cpu_count(): 1328 CPU-s against 600s wall
  #                         before being killed, and mutate.py prices the
  #                         honest version at ~53 CPU-min. A plain
  #                         `quality/test_*.py` glob would put that on every
  #                         pull request, which is why this job names its files
  #                         and does not glob. `--static` runs in `record` at
  #                         0.06 CPU-s and asks a different question.
  #
  # depth-1 is sufficient and deliberate: NO test file walks git history (zero
  # git log / cat-file / rev-list across all 46). Only `record` needs
  # fetch-depth 0, for verify_entries.py's doctrine-17 pin walk.
  #
  # ~~No network: zero urllib/requests/http/socket calls across all 46. Only
  # test_discriminate.py needs data/concreteness.txt or nltk, and it is not
  # here -- every other file needs at most cmudict.dict.~~
  #
  # CORRECTED 2026-08-14, BEFORE THIS JOB EVER RAN. The second sentence was
  # FALSE and would have made this job red on its first real execution. FOUR
  # gated suites reach `quality.features` — test_crosslinguistic,
  # test_phrase_commonplace, test_readability and test_revise — and
  # `features._tagger()` does `import nltk` and reads `data/nltk`, which is
  # GITIGNORED (lyric-harness/.gitignore:4). So the runner has neither the
  # package nor the model, and a lot simulated the failure: ModuleNotFoundError
  # after 19 of 28 assertions.
  #
  # The claim came from a measurement of what each file IMPORTS at module level.
  # `_tagger()` imports lazily inside the function — the same shape that made
  # `nightly` fail its first run on numpy at discriminate.py:524. Twice in one
  # day, a lazy import defeated an import scan; the scan is the wrong
  # instrument, and running the job is the right one.
  #
  # The first sentence stands: no test file makes a network call. `fetch_data.py`
  # does, which is why it is a STEP rather than something a suite does for
  # itself.
  suites:
    needs: gate
    runs-on: ubuntu-latest
    # A RUNAWAY GUARD, NOT A BUDGET. ~~All 44 files in this job are now
    # measured: the 42 cheap ones sum to 505 CPU-s and the revision pair adds
    # 375, so the job is ~880 CPU-s / ~14.7 min and this guard is ~2x that.~~
    #
    # REPINNED 2026-08-15 (doctrine 17 — struck and dated, not overwritten).
    # 46 files, not 44: `test_propose.py` (39.77 CPU-s) and
    # `test_verify_entries.py` (0.05 CPU-s) joined the cheap step, which is 44
    # files summing to ~545 CPU-s. With the revision pair's 375 the job is
    # ~920 CPU-s / ~15.3 min, and this guard is still ~2x that.
    #
    # THE 505 AND 375 ARE CARRIED, NOT RE-DERIVED, and that is disclosed rather
    # than papered over: this lot measured the two ADDED files and did not
    # re-time the 42 that were already here, so ~545 and ~920 inherit whatever
    # 505 and 375 were worth (doctrine 58 — the addend is measured, the base is
    # quoted). ~~`timeout-minutes` is the only decision either number feeds, and
    # it does not turn on the difference.~~
    #
    # **IT TURNED ON THE DIFFERENCE — REPINNED 2026-08-16 FROM 30, AND THE
    # GUARD FIRED ON A RUN WHOSE EVERY STEP HAD PASSED.** Run #425 on
    # `5c4206a`: `gate`, `record`, `verify` and `freshness` all SUCCESS, and
    # this job ran the 44 cheap suites (success), the song-profile calibration
    # (success) and the revision loop (success) — then was cancelled TWO
    # SECONDS after its last step finished. 23:54:24 -> 00:26:44 is **32m20s
    # of WALL CLOCK against a 30-minute guard**, so a fully green run reported
    # `cancelled`.
    #
    # THE ARITHMETIC ABOVE WAS NEVER WALL CLOCK AND THE GUARD WAS SET FROM IT.
    # "~920 CPU-s / ~15.3 min" is a CPU-SECOND sum; this job is wall-clock
    # bound and pays process startup on every one of 46 files. MEASURED per
    # step on #425: cheap suites **21m52s**, calibration **47s**, revision pair
    # **9m29s**. That is doctrine 58 one axis out — a recorded count became a
    # threshold nobody re-measured, in the comment that says the count feeds
    # exactly one decision.
    #
    # 60 is ~2x the MEASURED 32m20s, which is the "runaway guard, not a budget"
    # this comment opens by claiming. The cheap step grew because six sections
    # were added to it on 2026-08-15 (test_verbs §29/§30, test_provenance
    # §11/§12, test_declared_inputs §15, test_phonology §10k) and nobody
    # re-priced the job.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stage the pronunciation dictionary
        working-directory: lyric-harness
        run: python3 -c "import lyric_harness; lyric_harness.fetch_data()"

      # FIVE OF THE SUITES BELOW REACH `quality.features` (four until
      # 2026-08-25, when test_sentencehood joined), WHOSE `_tagger()`
      # DOES `import nltk` AND READS `data/nltk` — a gitignored directory the
      # runner does not have. See the corrected note in this job's header for
      # how that was nearly shipped. `quality/fetch_data.py` stages the tagger
      # model, the tokenizer and the concreteness norms; `pip install nltk`
      # supplies the package it needs to read them.
      - name: Install nltk (five suites reach the POS tagger through features.py)
        run: python3 -m pip install --disable-pip-version-check nltk

      - name: Stage the tagger model and the concreteness norms
        working-directory: lyric-harness
        run: python3 quality/fetch_data.py

      # Named, never globbed -- see the header. A glob is how test_mutation.py's
      # 53-CPU-minute sweep would arrive here without anybody deciding it should.
      # Threads pinned: a sibling instrument measured 625 CPU-s of BLAS
      # spin-wait against 32 pinned, on matrices too small to be worth a thread.
      # ~~- name: The 42 cheap suites (15 of them under 1 CPU-s)~~
      #
      # 44 SINCE 2026-08-15 — `propose` and `verify_entries` added; see this
      # job's header for how they were found, what they cost and how each was
      # proved two-sided. The "15 of them under 1 CPU-s" parenthetical is
      # DROPPED rather than incremented to 16: this lot timed the two files it
      # added and did not re-time the other 42, so 16 would be a number nobody
      # ran (doctrine 58). `test_verify_entries.py` at 0.05 CPU-s is certainly
      # in that set; whether the set was 15 before is not this lot's to assert.
      #
      # AND THE LIST NOW ACCOUNTS FOR EVERY FILE, which is the property that
      # was missing rather than the two names. `ls quality/test_*.py` is 54
      # (48 until `test_nc_census.py` joined 2026-08-17; `test_plan.py` and
      # `test_meter_bands.py` the same day; `test_homeoteleuton.py` and
      # `test_structures.py` 2026-08-18; `test_structure_census.py` the
      # same day, with the census artifact); this step names 49,
      # the `revision-loop` job names 2, the sharded `verbs` job names 1
      # (moved out of this pool 2026-08-18 — at 21-22 measured minutes it
      # WAS the four-wide pool's wall, since width cannot beat the longest
      # member), and `test_discriminate.py` and
      # `test_mutation.py` are refused by name with a measurement in the
      # header. 49 + 2 + 1 + 2 = 54, so a file added
      # tomorrow is again in no column — the arithmetic is the check, and it is a check a human has to
      # run. `test_verbs.py` also fails on an unnamed file, which is what
      # caught `nc_census` on the run that added it — and `structures` on
      # the run that added THAT. `comm -23 <(ls quality/test_*.py | sed 's|quality/test_||;s|\.py$||'
      # | sort) <(the names in this file, sorted)` is that command.
      - name: "The 73 cheap suites (propose + verify_entries joined 2026-08-15; nc_census + plan + meter_bands 2026-08-17; homeoteleuton + structures in, verbs out to its own sharded job, structure_census with its artifact, screen with the no-private-instruments rule, capacity with the density design's stage 1, 2026-08-18; corpus_taxonomy with the region/function axes and the calibration manifest, 2026-08-19; expected_drift with the declared-drift ruling and data_row_claims with the re-derived provenance numbers, 2026-08-21; pin_sweep + suite_sweep 2026-08-22 — both were ORPHANS, found by the very check in test_verbs.py that exists because a list that is short looks exactly like a list that is complete; mandate_relation + relation_shapes + relations_null 2026-08-22, the SAME check catching the same shape a second time in one day — three suites written during the relation-ladder work and never added here, so every one of them was green on a developer machine and unrun in CI; placement 2026-08-22 with the section-constraint layer, added in the same commit as the suite rather than after somebody noticed; section_marks the same day with the bracketed-mark triage, whose own `--check` is the gate that a corpus load printing a NEW mark turns red instead of joining the 62% that answered nothing; slots 2026-08-23 with the placement coordinate and recover the same day with the second door into the pipeline, each added in the same commit as the module it gates so neither joins the census below; capabilities 2026-08-23 — the SAME orphan census a third time, and this one had been unrun since the day it was written — `quality/test_capabilities.py` §8 is what pins the 77-of-77-askable claim CLAUDE.md leads with, 51 checks at 6.9s, named by nothing that gates; gate_census 2026-08-23 with the census of which findings can refuse anything, added in the same commit as the module it gates — and the instrument's own first run is why it is here rather than a sitting later: it named two constructors, measured 46 codes, and omitted `quality/grid.py`'s SHAPE layer entirely, which a census reports as fully gated; songs 2026-08-24 — the DELIVERED songs, which until that day nothing in this repository read at all: zero checks under quality/, zero mentions here, and two of the five had shipped with their section structure missing while every gate in the tree stayed green; render_form the same day — the check that reads a MESSAGE, which no other gate can, plus the Stop hook that hands it the transcript and BLOCKS a turn carrying a section bracket with its apparatus stripped; songs_record the same day — the SERIES, because every report about these songs had been a PASS/FAIL bit read aloud as a judgement, and its claim check is the one gate in this tree aimed at the narrator rather than the code; songs_log the same day — the PROCESS beside the product, because the series banks what a song IS and nothing banked how it got there, and the zero-ceiling rhyme families were a markdown table no command could re-derive; sentencehood 2026-08-25 with the M-110 noun-stack layer — the nightly gained `sentencehood.py --check` in the same commit as the module and its SUITE joined nothing, the census's own defect one more time, caught by the census; narrative 2026-08-25 — the paired blind experiment's own suite, written across the M-121 narrative-layer sittings and never added here, and the census's finding was MASKED for a day: the orphan check is test_verbs §24, shard 1 died at §20's M-116 breakage two sections in front of it, so a crash in one section hid an orphan in another — the fix that cleared the crash is what let the census speak; door_census 2026-08-26 with the M-139 census of which DOOR each pair-satisfaction site judges at, added in the same commit as the module it gates -- and this label went from 71 to 72 with it, which `test_verbs.py` §43's own check is what caught: the label a reader trusts must equal the list it labels, and a suite added without moving the number is a list that is short looking exactly like a list that is complete; chance_rate 2026-08-26 with M-138's strike and M-140 -- the chance-rate measurement had by then been improvised TWICE from uncommitted scripts, which standing rule 3 calls a defect report, and its suite is here in the same commit as the module so it never joins the orphan census above)"
        working-directory: lyric-harness
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -e
          # FOUR AT A TIME, 2026-08-18. These are 49 independent PROCESSES
          # and they ran strictly serially — ~25 of the ~35 minutes every
          # push cost. The runner has 4 vCPUs and the env above already pins
          # each suite's math to one thread, so width-4 moves no number in
          # any suite; only the wall clock moves. Each suite prints its own
          # banner and verdict (output interleaves, and that is the price);
          # a failing suite touches the marker inside its own subshell (the
          # group's exit is the `touch`'s 0, so the throttle's `wait -n`
          # never trips `set -e` for it) and the LAST line is the gate: the
          # step fails if ANY suite failed, never silently.
          rm -f /tmp/suites-failed
          rm -rf /tmp/suite-logs && mkdir -p /tmp/suite-logs
          for f in align band capabilities capacity coda controls corpus_audit \
                   crosslinguistic cym \
                   corpus_taxonomy data_row_claims declared_inputs english_text \
                   expected_drift \
                   pin_sweep suite_sweep \
                   door_census chance_rate \
                   fit floor fwer g2p gate_census grid placement section_marks \
                   homeoteleuton homograph ipa ltc mandate_language \
                   mandate_relation \
                   matrix meter \
                   meter_bands msa_fin \
                   mut_band mut_oracle nucleus null_shapes phon_fas phon_msa \
                   phon_non phon_san phonology phrase_commonplace \
                   narrative nc_census plan positive_control propose provenance \
                   readability readings_seam register_audit relations \
                   relation_shapes relations_null \
                   recover render_form screen sentencehood slots song_function songs songs_log songs_record spans structure_census structures \
                   taxonomy time_layer \
                   verify_entries; do
            while [ "$(jobs -rp | wc -l)" -ge 4 ]; do
              wait -n
            done
            # THE OUTPUT IS ALSO KEPT PER SUITE, 2026-08-23. Four-wide
            # interleaving means a failing suite's own lines are scattered
            # through a 5,000-line step, and the retrievable log window does
            # not reach back to the suites that run first — so `test_pin_sweep`
            # could be named as failing on two consecutive runs with its
            # reason visible nowhere. `tee` keeps the live stream AND a
            # per-suite copy, and the gate below prints the tail of each
            # failing suite's own log, unmixed, where a reader is already
            # looking. A gate that names a failure it cannot show is half a
            # gate.
            { echo "── quality/test_$f.py"
              python3 "quality/test_$f.py" 2>&1 | tee "/tmp/suite-logs/$f.log"
              [ "${PIPESTATUS[0]}" -eq 0 ] || echo "$f" >> /tmp/suites-failed; } &
          done
          wait
          # THE GATE NAMES WHAT FAILED. It was `touch` + `test ! -f`, so the
          # step failed correctly and printed NOTHING about which suite did
          # it -- and this loop runs FOUR AT A TIME, so its output is
          # interleaved and a reader had to scroll a whole job to find out.
          # Measured 2026-08-22 on run 32542791452, where the tail of this
          # step is an ADOPTION CHECK passing, immediately followed by the
          # step failing for a reason named nowhere near it.
          if [ -f /tmp/suites-failed ]; then
            echo "=============================================="
            echo "FAILING SUITES ($(wc -l < /tmp/suites-failed)):"
            sed 's|^|  quality/test_|;s|$|.py|' /tmp/suites-failed
            while read -r f; do
              echo ""
              echo "=============================================="
              echo "quality/test_$f.py — its OWN last 60 lines, unmixed"
              echo "=============================================="
              tail -n 60 "/tmp/suite-logs/$f.log" 2>/dev/null \
                || echo "  (no log — the suite died before writing anything)"
            done < /tmp/suites-failed
            exit 1
          fi

      # MOVED HERE FROM `record` 2026-08-14, because this job has the tagger.
      # 64 CPU-s. It judges 13 of the 18 calibration constants EXACTLY and
      # REFUSES the other 5 BY NAME rather than passing them silently (doctrine
      # 20/79 -- band lo/hi, the predictability threshold and its two FPRs).
      # Exits 0 on PARTIAL PASS with the counts on the line; proven to exit 1
      # by perturbing floor.py's `mattr_min` 0.7226 -> 0.7500, which it caught
      # and named. The FULL sweep is a different thing and runs nightly.
      # EXPECTED RED FROM 2026-08-20 UNTIL THE PROFILE IS RE-ADOPTED, and
      # saying so here is the alternative to silencing it. The closing sitting
      # re-derived this over the loaded corpus and three thresholds drifted --
      # mattr 0.7226 -> 0.7128, fwr 0.4716 -> 0.4773, cv 0.1123 -> 0.1094 --
      # while all five held-out FPRs stayed on target and anaphora's threshold
      # did not move. That is a corpus change, not a defect, and the check is
      # doing exactly its job by refusing to pass.
      #
      # IT IS NOT REPINNED YET, DELIBERATELY. This pass REFUSES the five
      # predictability-dependent constants by name; adopting the three that
      # drifted while leaving `predictability` on its old value would make
      # floor.py's `song` profile half a description of one corpus and half of
      # another (doctrine 1). The profile is adopted as a SET, and the set
      # needs the full arm -- which the `nightly` job is now banking in
      # bounded, resumable slices. WHAT CLEARS THIS STEP is that adoption, not
      # an edit here.
      #
      # NO LONGER RUN RAW — 2026-08-21. "EXPECTED RED" written in a comment is
      # read by a human who happens to open this file; it is invisible in the
      # job status, and a job that is always red teaches every reader to stop
      # looking at it. MEASURED COST, on this branch: `suites` failed on TWO
      # steps for days, one the expected drift above and one a REAL regression
      # in test_capacity, and the status could not tell them apart — the real
      # one went unexamined for hours because red carried no information.
      #
      # `expected_drift.py` makes the ruling MECHANICAL instead of prose: it
      # runs the same command, and passes only when the observed drift set
      # EQUALS the declared one. It fails on an undeclared drift (something
      # new moved) AND on a declared drift that no longer happens (the ruling
      # is spent and the constant should be repinned) — the second direction
      # being the one that stops this allowlist from becoming the next stale
      # file. If the instrument's report changes shape and the parser stops
      # matching, it RAISES rather than reporting an empty set.
      # quality/test_expected_drift.py proves all three.
      - name: Song-profile calibration, against the drift that is RULED (not silenced)
        if: always()
        working-directory: lyric-harness
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python3 quality/expected_drift.py song_profile_calibration-fast

      # The same pattern for the meter bands (DENSITY [5,12] / PROMINENCE
      # [2,7], adopted 2026-08-17 in RESULTS_METER_BANDS_READER.md and
      # shipped as `meter_bands.ADOPTED`, which `revise._band_findings`
      # enforces as per-line flags): re-sweep the 143-file corpus at the
      # ADOPTED reader, re-run the registered trial, compare. ~49 CPU-s,
      # measured. Exits 1 NAMING the drift — a shipped constant that
      # outlives its measurement fails loud here instead of lingering in
      # the grader (doctrine 58/48). Proven to exit 1 by the suite's own
      # mutation set (test_meter_bands section 9 drives the comparison
      # logic; --check is this same comparison over the real sweep).
      - name: Meter-band adoption check, the shipped constants re-derived
        if: always()
        working-directory: lyric-harness
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python3 quality/meter_bands.py --check

      # THE COMPARATOR'S SPAN SEARCH AGAINST A NULL UNDER THE SAME SEARCH.
      # `best_score` records `search_k` under a comment calling it "the
      # precondition for a null under the same search" (doctrine 56) and,
      # until 2026-08-26, nothing consumed it -- the only other reader was a
      # print. `relations.py` honours the same doctrine one screen away, via
      # `search_burden()` + `relations_null.py`. This is that null for the
      # OTHER search (`MISSING.md` M-135).
      #
      # The gate is ONE SENTENCE: `theta_rhyme` must sit above the measured
      # crossover, because BELOW it the span search lifts a permutation null
      # MORE than it lifts real verse -- the band gets loosened by a mechanism
      # no coordinate declares. The margin today is +0.03, which is why this
      # runs rather than sitting in a document.
      #
      # COST, MEASURED before it was added rather than discovered by a
      # timeout: **3s** single-threaded (1,108 sonnet pairs scored once, then
      # 10 permutation replicates, swept over 7 thetas off the stored totals
      # so the sweep costs no extra scoring). It is a rounding error against
      # this job's budget -- which is stated here because M-129's whole
      # subject was a shard whose cost nobody had written down.
      - name: Span-search null, the shipped band against the measured crossover
        if: always()
        working-directory: lyric-harness
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python3 quality/search_null.py --check

      # WHICH DOOR EACH SITE JUDGES A PAIR AT (`MISSING.md` M-139, owner's
      # ruling 2026-08-26: *"go find everywhere it still has the incorrect 4
      # and make sure all 77 are there ... 4 is poisonous as fuck"*).
      #
      # The default door moved TWICE and in two different coordinates -- M-59
      # widened `Declaration.admit` to four relations, M-116 put ALL 77
      # SCHEMAS in the default -- and a site that moved with neither looks
      # exactly like a site that never needed to. The census's first run
      # measured **2 of 19 sites reaching the complete default**; two were
      # repaired in the same sitting and it stands at 3.
      #
      # THIS IS THE STEP THAT STOPS THE REDISCOVERY. An unruled site FAILS,
      # so a new `admits()` call written at the narrow door is a red check
      # rather than something a later audit finds by hand -- and a FULL
      # ruling is checked against the code, so a site cannot be talked into
      # compliance by editing its own row.
      #
      # COST, MEASURED before it was added: **1.9s**, pure AST, no corpus and
      # no scoring.
      - name: Door census, every pair-satisfaction site against the 77
        if: always()
        working-directory: lyric-harness
        run: python3 quality/door_census.py --check

      # THE CHANCE RATE OF THE SHIPPED DOOR (`MISSING.md` M-138's strike and
      # M-140). This repository's oldest comparator argument is the one that
      # recalibrated `theta_coda`: the harness was likelier to call two random
      # dictionary words a rhyme than to fail one of Shakespeare's mandated
      # pairs. Nothing has re-asked it since the door moved TWICE, and M-138's
      # own figures came from an uncommitted script and do not reproduce --
      # the sampler's POPULATION and READER were never declared, so two later
      # re-derivations disagreed with the entry and with each other. This
      # gates the band (`admit 289..339`, `narrow 36..46`, `schema 897..932`)
      # over a declared 2x2 grid, and asserts that its shipped cell's draw
      # still reproduces `redteam_band.sample_pairs` pair for pair, so the two
      # instruments cannot drift apart again (doctrine 1).
      #
      # COST, MEASURED before it was added: **45s** -- four cells of 4,000
      # pairs, each judged at three doors. It is here rather than in the
      # cheap-suite pool for exactly that reason.
      - name: Chance rate, the shipped door against random pairs
        if: always()
        working-directory: lyric-harness
        run: python3 quality/chance_rate.py --check

      # The revision loop itself. 374.87 CPU-s for the pair, MEASURED, both
      # green -- against the "15+ minutes each" that kept them out until today.
  # ── The revision pair, its own runner (SPLIT OUT 2026-08-18) ─────────────
  # It ran as the suites job's LAST step, sequential after the 49-suite
  # pool — measured on run #522: pool 21m46 (its wall is test_verbs, the
  # longest member), then this pair for another 10m58, making the suites
  # job the whole run's 34m critical path. The pair shares nothing with the
  # pool but a checkout, so serializing them bought nothing but wall clock.
  # As its own job it runs BESIDE the pool and the run's path drops by the
  # pair's full cost. Same env pins, same setup steps as `suites`.
  revision-loop:
    needs: gate
    runs-on: ubuntu-latest
    # Measured 11m on run #522; headroom, not a budget.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lyric-harness
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stage the pronunciation dictionary
        run: python3 -c "import lyric_harness; lyric_harness.fetch_data()"
      - name: Install nltk (the floor reaches the POS tagger through features.py)
        run: python3 -m pip install --disable-pip-version-check nltk
      - name: Stage the tagger model and the concreteness norms
        run: python3 quality/fetch_data.py
      - name: The revision loop (test_revise 184s + test_loop 191s, measured)
        run: |
          set -e
          python3 quality/test_revise.py
          python3 quality/test_loop.py

  # ── test_verbs, sharded (SPLIT OUT 2026-08-18) ───────────────────────────
  # The longest suite in the repo — 21-22 minutes measured on runs #522 and
  # #524 — and after the cheap pool went four-wide it WAS the pool's wall:
  # parallel width cannot beat the longest member. Its 39 sections are
  # independent (each builds its own tmpdirs), so TEST_VERBS_SHARD=k/n in
  # the suite's own __main__ runs the index-residue classes — every
  # section runs EXACTLY ONCE across the matrix by arithmetic, not by
  # review, and an unset var still runs the whole file byte-identically
  # (the local command nobody has to relearn).
  verbs:
    needs: gate
    runs-on: ubuntu-latest
    # ~11m expected per half; headroom, not a budget.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: lyric-harness
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TEST_VERBS_SHARD: ${{ matrix.shard }}/2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stage the pronunciation dictionary
        run: python3 -c "import lyric_harness; lyric_harness.fetch_data()"
      - name: Install nltk (sections reach the POS tagger through features.py)
        run: python3 -m pip install --disable-pip-version-check nltk
      # §43 parses THIS FILE with a real YAML parser, and a real parser is the
      # only thing that answers the question it asks. The check shipped
      # importing `yaml` and this runner does not have it, so shard 1 died on
      # `ModuleNotFoundError` -- the check passed on a developer machine that
      # happened to carry PyYAML and could not run in the one place it gates.
      # Installed here, beside nltk, for the same reason and on the same terms:
      # it is a coordinate of the TEST JOB, never of the harness. The
      # stdlib-only claim is pinned by `record`'s own step and is untouched --
      # nothing under `lyric_harness`/`floor`/`revise`/`propose` imports yaml.
      - name: Install PyYAML (§43 parses this workflow with a real parser)
        run: python3 -m pip install --disable-pip-version-check PyYAML
      - name: Stage the tagger model and the concreteness norms
        run: python3 quality/fetch_data.py
      - name: test_verbs shard ${{ matrix.shard }}/2 (the whole file, halved by section residue)
        run: python3 quality/test_verbs.py

  # ── The mutation sweep: adversary 4, in its own job and on a rotation ─────
  #
  # A JOB AND NOT A STEP, SINCE 2026-08-24. It was step 11 of `nightly` and it
  # is the reason that job has not been green in a week: uncapped, it ran past
  # the job's own `timeout-minutes`, and a cancelled job skips the rest of its
  # steps AND its `actions/cache` post step. Three adoption checks went unrun
  # and the song-profile memo's nightly slice was computed and discarded, every
  # night, because ONE sibling step had no bound. Parallel jobs are how this
  # file already answers that everywhere else — `catalog` runs 4 shards,
  # `verbs` runs 2 — and the sweep is the last serial giant that was not.
  #
  # SHARDED, AND THE SHARD COUNT IS ANCHORED TO A MEASUREMENT rather than
  # picked. Measured on the runner from the Actions API:
  #
  #   2026-08-23   the whole sweep, 58 mutations   7,627 s (2 h 07 m), PASSED
  #   2026-08-24   the whole sweep, 58 mutations   >12,949 s, never finished
  #
  # At N=2 a shard is 29 of the 58. The cost is `baseline + 29 x per-mutation`,
  # and ONE TERM OF THAT IS NOT MEASURED: the sweep prints a single wall clock
  # and never splits the baseline out, so how much of the 12,949 s above was
  # the one-off baseline is not known from any run on record. Stated rather
  # than quietly assumed away — under any baseline at all, a shard at N=2 is
  # strictly cheaper than the whole sweep, and lands near the 2 h 07 m this
  # runner IS known to complete. That is the argument for 2: not a guess at
  # what fits, but the largest slice with a completed run behind it. The step
  # below prints its own wall clock, so the FIRST run of this job is the
  # measurement that settles N — and if a shard overruns it says so with the
  # number attached instead of taking the job down with it.
  #
  # Full coverage takes two nights, and `test_mutation.py` §3e proves the two
  # shards are exactly the declared list with nothing dropped or doubled.
  #
  # THE ROTATION IS THE DATE, so it needs no stored state and cannot drift:
  # even day-of-year runs shard 1, odd runs shard 2. A `workflow_dispatch`
  # gets whichever the day says, which is also what makes the slice
  # reproducible from the run's own date.
  #
  # THE STEP CARRIES ITS OWN `timeout`, INSIDE THE JOB'S. This is the trick the
  # song-profile step documents and the sweep did not have: a step that exits
  # cleanly at its bound reports "the shard outgrew its budget" with the
  # numbers attached, where a job cancelled at ITS bound reports nothing and
  # takes the post steps with it. A truncated sweep is NOT a pass here (there
  # is no memo to bank, unlike the song-profile slice), so 124 fails — loudly,
  # naming the two levers, so the next person raises N on evidence instead of
  # rediscovering this from an empty log.
  mutation:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '17 4 * * *')
    runs-on: ubuntu-latest
    # ~~2 h 07 m measured + headroom~~ — REPINNED 2026-08-26: the last
    # shard to FINISH took 171m41s (shard 2/2, run #909) and its sibling was
    # killed at the 200m step bound, so 2h07m described a sweep two sizes
    # ago. At N=4 the expected shard is roughly half of either, and this cap
    # is left at 240 on its own stated argument — the STEP bound below is
    # what actually fires, and this exists so a hung fork cannot hold a
    # runner for six hours.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # THE SAME THREE PACKAGES `nightly` INSTALLS, AND FOR A REASON THAT COST
      # THIS SWEEP ITS MEANING ONCE BEFORE. With nltk absent, nine test files
      # are RED AT BASELINE, `baseline()` excludes them — correctly — and the
      # sweep then reports SURVIVED for mutations whose detectors were the
      # excluded files. An environment defect wearing the costume of a coverage
      # hole (see the long note in `nightly`). This job forks the whole suite,
      # so it needs the suite's environment exactly.
      - name: Install the packages the suite reaches lazily
        run: python3 -m pip install --disable-pip-version-check numpy scikit-learn nltk

      - name: Stage the pronunciation dictionary
        working-directory: lyric-harness
        run: python3 -c "import lyric_harness; lyric_harness.fetch_data()"

      - name: Stage the tagger model and the concreteness norms
        working-directory: lyric-harness
        run: python3 quality/fetch_data.py

      - name: One shard of the mutation sweep (adversary 4, rotating by date)
        working-directory: lyric-harness
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          # `10#` FORCES BASE TEN. `date +%j` is zero-padded, so day 008 and
          # day 009 are invalid octal and abort the arithmetic — a bug that
          # would wait until January to fire and then look like a shard defect.
          # N=4 SINCE 2026-08-26, RAISED FROM 2 ON THE MEASUREMENT THE
          # REFUSAL BELOW ASKED FOR — "measure first, the wall clock this
          # file prints is the number":
          #   shard 2/2  run #909, 2026-08-25  04:53:47 -> 07:45:28  171m41s, exit 0
          #   shard 1/2  run #966, 2026-08-26  04:55:40 -> 08:15:40  killed at 200m
          # so the whole sweep is >372m and one half of it no longer fits.
          # N=4 IS MEASURED NOW AND IT FITS -- 2026-08-27, which is what this
          # comment's own last line asks for and what it did not yet have:
          #   shard 1/4  15 mutations, 8984s = 149m44s, exit 0,
          #              13/15 caught, 0 SURVIVED, 2 INDETERMINATE
          # on a 4-vCPU box AND under contention (a `npm run tandem` shared it
          # for the first 26m), so a clean runner is the optimistic side of
          # that number rather than the pessimistic one. 149m against the 200m
          # bound is ~50m of margin. Shard 1/4 is the half of old shard 1/2
          # that overran, so this is the expensive quarter and not a lucky one.
          # THE TWO SHARDS ARE BALANCED BY COUNT AND NOT BY TIME — that is
          # the finding, and `test_mutation.py` §3e carried the opposite
          # claim ("a per-shard time bound means the same thing on every
          # shard") until this lot struck it. A mutation costs what its
          # detectors' SUITES cost, and those run from milliseconds to
          # minutes.
          # RAISING N AND NOT THE BOUND, deliberately. The other lever
          # (raise 200m and the job cap together) buys one night and pays it
          # again the next time the suite grows, and the runner is ALREADY
          # saturated — `--mutation-jobs 2` x `--jobs 4` on 4 vCPUs — so
          # widening parallelism instead would oversubscribe into the inner
          # per-suite `--timeout 420`, and a suite killed inside a mutation
          # reports SURVIVED. That is a coverage hole manufactured by a
          # scheduling change, which is the one outcome worse than a slow
          # sweep.
          # THE COST IS CADENCE AND IS NOT HIDDEN: 58 mutations at N=4 is
          # ~14-15 a night, and each is asked every FOURTH night rather than
          # every second. The stride is round-robin, so N=4 splits each old
          # half in two and the heavy half's mass splits with it.
          N=4
          I=$(( (10#$(date -u +%j) % N) + 1 ))
          echo "day-of-year $(date -u +%j) -> shard $I of $N"
          set +e
          timeout 200m python3 quality/test_mutation.py --shard=$I/$N
          rc=$?
          set -e
          case $rc in
            0) echo "SHARD $I/$N HOLDS — every mutation in this slice is caught." ;;
            124) echo "THE SHARD OUTGREW ITS BUDGET at 200m, and that is a"
                 echo "FAILURE and not a slice: unlike the song-profile memo"
                 echo "there is nothing banked, so a truncated sweep answers"
                 echo "nothing (doctrine 20). Two levers, both in this file:"
                 echo "raise N above $N so each night asks fewer mutations, or"
                 echo "raise the 200m bound and the job cap together. Measure"
                 echo "first — the wall clock this file prints is the number."
                 exit 1 ;;
            *) exit $rc ;;
          esac

  # ── Nightly: the checks the measurement above prices out of a pull request ─
  #
  # Named to the nightly cron, not to `schedule` -- see the two-crons comment
  # at the top of this file. An unpinned condition here would also fire on the
  # weekly cron, and a third cron would silently recruit this job too.
  #
  # This is where the honest-but-expensive instruments live. Each one below was
  # kept out of `record` and `suites` by a MEASUREMENT, not by an impression,
  # and the measurement is stated at the step.
  nightly:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '17 4 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # song_profile_calibration's memo lives OUTSIDE the repo, at
      # ~/.cache/lyric-harness/song_predictability_v1.tsv, which is what makes
      # a nightly full --check affordable at all: ~85 CPU-s warm against a
      # cold cost that is now ~18 CPU-HOURS, and it is explicitly resumable.
      # Restoring this is the difference between a job that finishes and one
      # that times out.
      #
      # REPINNED 2026-08-20: the cold figure read "2.0-2.2 CPU-HOURS" and was
      # measured over a 4,930-item corpus. The loading campaign took that to
      # 8,667 items, and the per-item cost was MEASURED at ~7.5 CPU-s over two
      # flush intervals -- so cold is ~18 hours, not two, and the step below
      # pays it in bounded nightly slices rather than pretending it fits.
      # RESTORE AND SAVE ARE SPLIT, AND THE SAVE IS `if: always()` — 2026-08-27.
      # `actions/cache@v4` declares `post-if: success()`, so its save runs ONLY
      # when the job passed. That turned the memo into a PERMANENT DEADLOCK and
      # the evidence is run #966 (2026-08-26): the song-profile step banked
      # `memo: 0 -> 8663 items (+8663 banked this run)` after 146 minutes of
      # work, the job then failed on the drift the same step reported, the save
      # was skipped, and the next night started cold and paid the 146 minutes
      # again. Every scheduled run from 2026-08-15 to 2026-08-26 is red, and
      # this is why none of them could ever get further than the last.
      #
      # THE STEP'S OWN CONTRACT ALREADY ASSUMED THIS AND COULD NOT GET IT: its
      # `124` arm reads "the run hit its 150m budget with the memo advanced and
      # banked. The next nightly resumes from it" — true of the file on disk,
      # false of the cache, because a timeout is not a success either. A
      # resumable slice whose resume point is discarded on every failure is not
      # resumable; it is the same first slice, forever.
      - name: Restore the predictability memo
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/lyric-harness
          key: lyric-harness-predictability-v1-${{ github.run_id }}
          restore-keys: lyric-harness-predictability-v1-

      # THE ONE PLACE THIS REPO LEAVES THE STANDARD LIBRARY, AND IT IS DELIBERATE.
      # The `record` job's comment states the boundary — "the harness is pure
      # standard library by design, and quality/declared_inputs.py is the record
      # of that boundary" — and that is true of the harness. It is NOT true of
      # three instruments that only run here: discriminate.py imports numpy and
      # sklearn LAZILY at its line 524, inside the function that fits the
      # classifier, so the dependency is invisible to a module-level import scan
      # and to every check `record` runs.
      #
      # FOUND BY RUNNING CI, NOT BY READING IT. This job was written without a
      # pip step and its first real execution failed three steps in a row inside
      # two seconds — too fast to be a run, which is what a missing import looks
      # like. Nothing local caught it because this container already had both
      # packages installed. Added 2026-08-14.
      #
      # THEN IT HAPPENED AGAIN, ONE PACKAGE OVER, AND THE SECOND TIME WAS WORSE.
      # The list said "the two packages" and stopped at numpy and scikit-learn.
      # nltk is the third, reached the same lazy way — `quality/features.py`'s
      # `_tagger()` does `import nltk` inside the function — and `suites` had
      # already been bitten by exactly this and already carries the fix. The
      # step below it, `quality/fetch_data.py`, was staging the tagger MODEL
      # into a runner with no nltk to read it.
      #
      # WHAT MADE IT WORSE THAN A FAILED STEP: with nltk absent, nine test
      # files are RED AT BASELINE here and green in `suites` on the same
      # commit. test_mutation.py excludes red files from its detector set —
      # correctly, a test that fails either way distinguishes nothing — and the
      # nine are test_floor, test_fit, test_revise, test_loop, test_readability,
      # test_verbs, test_crosslinguistic, test_phrase_commonplace and
      # test_discriminate. Those are precisely the detectors for floor.py,
      # revise.py and fit.py, so the sweep reported 14 SURVIVED mutants in
      # those three files and told the reader to go write assertions that
      # already exist and already catch them. An environment defect wearing the
      # costume of a coverage hole. See the refusal test_mutation.py now makes
      # when its detector set has been gutted. Added 2026-08-14.
      - name: Install the three packages the nightly instruments need
        run: python3 -m pip install --disable-pip-version-check numpy scikit-learn nltk

      - name: Stage the pronunciation dictionary
        working-directory: lyric-harness
        run: python3 -c "import lyric_harness; lyric_harness.fetch_data()"

      # The one instrument that needs the quality-layer resources: concreteness
      # norms and the frequency list. `record` deliberately does NOT run this,
      # which is why audit_joint_auc_null.py refuses there.
      - name: Fetch the quality-layer resources
        working-directory: lyric-harness
        run: python3 quality/fetch_data.py

      # ORDER IS LOAD-BEARING and this is the only place the chain is complete.
      # discriminate.py is the ONLY caller of save_cache, data/feature_cache.json
      # is gitignored, and audit_joint_auc_null.py --check REFUSES at exit 2
      # without a warm cache -- correctly, per doctrine 20, but it means that
      # check currently grades nothing anywhere else in this file. Here it
      # grades something.
      - name: Warm the feature cache (the only save_cache caller)
        working-directory: lyric-harness
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python3 quality/discriminate.py

      - name: Joint AUC null against its cold pins (needs the warm cache above)
        if: always()
        working-directory: lyric-harness
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python3 quality/audit_joint_auc_null.py --check

      # 44 AUCs pinned FULL-PRECISION at a 0.0005 tolerance, cold. ~1055 CPU-s,
      # and none of it is shortenable: 99.8% is the 384 feature extractions,
      # and the extractions ARE the cold guarantee.
      - name: Every discrimination AUC against its cold pin (~17.6 CPU-min)
        if: always()
        working-directory: lyric-harness
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python3 quality/test_discriminate.py

      # ~~Adversary 4 for real: the suite re-run once per mutation. ~53 CPU-min.
      # `record` runs --static (0.06 CPU-s) to prove the anchors still attach;
      # this proves the tests still CATCH. Two questions, two costs.~~
      #
      # MOVED OUT TO ITS OWN JOB 2026-08-24 (`mutation`, below), and the "~53
      # CPU-min" was wrong by a factor of four when it was moved. Struck rather
      # than deleted (doctrine 17) because the number is the reason:
      #
      #   2026-08-23 nightly   this step ran  7,627 s (2 h 07 m) and PASSED
      #   2026-08-24 nightly   still inside it at 12,949 s (3 h 36 m) when the
      #                        job's `timeout-minutes: 240` cancelled everything
      #
      # Eleven suites were added between those two runs (`suites` names "the 54
      # cheap suites" on the first and "the 65" on the second) and this file
      # re-runs the suite once per mutation, so its cost tracks the suite's.
      #
      # WHAT THE CANCELLATION COST WAS NOT THE SWEEP. Three later steps in this
      # job never ran, and `actions/cache`'s post step was SKIPPED — so that
      # night's 150-minute song-profile slice was computed and thrown away. The
      # step below warns about exactly this ("If the JOB hits `timeout-minutes`
      # it is cancelled and the cache's post step can be skipped"); what nobody
      # noticed is that a SIBLING STEP can trip it just as well as the step's
      # own overrun. A serial step with no bound of its own is a bound on
      # everything after it.
      #
      # AND THE ARITHMETIC SAYS THIS JOB NEVER FITTED. Measured on 2026-08-23:
      # cache warm 16 m + discrimination ~18 m + kalevala ~12 m + a song-profile
      # slice budgeted at 150 m is ~196 m before the sweep is asked for a
      # second, inside a 240-minute cap. The sweep did not outgrow its budget;
      # it never had one.

      # 2.0-2.2 CPU-hours cold, ~85 CPU-s warm off the cache restored above.
      # `record` runs --without-predictability at 64s; this is the whole thing.
      # THE KALEVALA ADOPTION CHECK (2026-08-18) — the first non-English
      # laziness regime's shipped constants re-derived against the corpus:
      # both arms' exact verdict counts, the true-pair total, and the
      # held-out blocked mass (quality/RESULTS_KALEVALA_ALLITERATION.md).
      # A full remeasurement (~12 min: two arms + 200 null resamples), so
      # it lives here and not in the per-push pool, the same reasoning
      # that keeps the predictability check nightly.
      # `if: always()` LIKE EVERY OTHER STEP IN THIS JOB, AND THESE TWO WERE THE
      # EXCEPTIONS — ADDED 2026-08-24. Without it a failure anywhere earlier
      # SKIPS them, and a skipped step reports as neither pass nor fail: on the
      # 2026-08-23 nightly both showed `skipped` because the two AUC steps above
      # had gone red, so two adoption checks that might themselves have been
      # red were simply not asked. That is doctrine 20's own shape — CANNOT RUN
      # is never PASS — arrived at by omission rather than by argument, and it
      # is why this job has been red for a week without anybody being able to
      # say how many things were wrong with it.
      - name: Rhyme capacity adoption check (tier 1 in full + every sample witness re-graded)
        if: always()
        working-directory: lyric-harness
        run: python3 quality/capacity.py --check

      - name: Kalevala alliteration adoption check (full remeasurement)
        if: always()
        working-directory: lyric-harness
        run: python3 quality/kalevala_calibration.py --check

      # THE STRUCTURE CENSUS, RE-DERIVED (`MISSING.md` M-141). Its sibling
      # above has had a --check since the week both were written and the
      # census never got one -- so when `d1_diagnostic()`'s population grew
      # 84.2% under it, the figure drifted for eight days while
      # `test_structure_census.py` ran 100% green beside it. That suite pins
      # the INSTRUMENT and reads no figure out of the results document, which
      # is exactly the gap doctrine 48 names.
      #
      # TWO ARMS WITH DIFFERENT LIFETIMES, never summed: the ARTIFACT arm
      # re-derives from the committed table and is true forever; the D1 arm
      # re-derives from the LIVE TREE and is true only of a declared corpus
      # state. Exits 3 on drift -- a moved figure is an ANSWER, not a refusal.
      #
      # COST, MEASURED before it was added: **17.8s**, of which the artifact
      # arm is 0.26s.
      - name: The structure census, every recorded figure re-derived
        working-directory: lyric-harness
        run: python3 quality/structure_census.py --check

      # DOES THE 77-SCHEMA DOOR FIND ANYTHING? (`MISSING.md` M-140.) The two
      # populations give OPPOSITE answers and neither may be read as the
      # other: over ALL 91 line pairs the observation sits BELOW its own
      # matched redeal (69.05% against a null median of 71.02%, p 0.90), so
      # the "the door answers on three line pairs in four" headline is at
      # chance; over the 7 pairs the POET DECLARED it is 96.43% against a null
      # whose best of twenty draws is 83.93% -- clear of the MAXIMUM.
      #
      # The VERDICTS are pinned as well as the numbers, because a tree where
      # both arms moved to the same side would hold every figure and mean
      # something else entirely.
      #
      # GATED BECAUSE THE UNGATED VERSION IS THE DEFECT THIS SITTING SPENT
      # ITSELF ON: M-138's figures came from an uncommitted script and did not
      # reproduce. Recording these and gating them with nothing would be the
      # same lesson unlearned. ~15 minutes, which is why it is nightly.
      - name: The 77-schema door against its matched redeal
        working-directory: lyric-harness
        run: python3 quality/chance_rate.py --null --check

      # EVERY BANKED VERDICT, RE-DERIVED AGAINST THIS TREE (`MISSING.md`
      # M-144). `song_log.py --verdicts` already charges the narrator's prose
      # against a BANKED ROW — did the narrator report what the verb SAID —
      # and that is the right question and not this one. Nothing re-derived a
      # banked VERDICT against the current tree: `song_record.py --check` does
      # exactly that for FEATURES and there was no verdict equivalent, which
      # is how a 13.5% miscount sat inside a headline triple with every gate
      # green. Exits 3 on a fresh move; a KNOWN move is adopted in
      # `REGRADE_MOVED` with its cause, never by editing the banked prose,
      # which `--verdicts` reads as history (doctrine 17).
      - name: Every banked song verdict, re-derived
        working-directory: lyric-harness
        run: python3 quality/regrade_verdicts.py

      - name: Sentencehood calibration check (M-110 — ceiling + the six banked witnesses)
        if: always()
        working-directory: lyric-harness
        run: python3 quality/sentencehood.py --check

      # THE IN-LINE RHYME CHECK WAS HERE AND WAS REMOVED 2026-08-23, in the
      # commit that withdrew its registration: the owner stopped that
      # calibration mid-run (it calibrated ONE cell of a 77-schema
      # vocabulary while the default grading path still read words[-1]),
      # `data/internal_rhyme_eng.tsv` was never written, and a --check step
      # pointed at an artifact that does not exist reds the nightly on a
      # decision rather than on a drift. Recorded rather than deleted
      # silently because a gate that vanishes without a reason is how a
      # coverage hole gets inherited. No successor pin is claimed here: the
      # replacement for that sitting is the placement conversion of the
      # grading spine, and any table it earns arrives with its own step.

      # THE FULL ARM IS NOW BOUNDED AND RESUMABLE, HANDED HERE BY THE OWNER
      # 2026-08-20 because it cannot finish anywhere else. The corpus grew
      # 4,930 -> 8,667 items in the loading campaign, and the cold cost grew
      # with it: MEASURED at ~7.5 CPU-s per item over two flush intervals, so
      # ~18 CPU-HOURS cold, against the 2.0-2.2 the comment on the cache step
      # above still quotes for the old corpus. That does not fit this job's
      # 240-minute budget and it does not fit a dev container either -- two
      # attempts there died, one to an orphaned process and one to a container
      # restart.
      #
      # WHY A BOUND MAKES IT FINISHABLE RATHER THAN GIVING UP. The memo flushes
      # ATOMICALLY EVERY 200 ITEMS and is keyed per item, so a run that is cut
      # short still advances it permanently; `actions/cache` above restores the
      # newest previous memo by prefix and saves a fresh one under this run's
      # id. So each nightly pays a bounded slice, banks it, and the next one
      # starts further along -- the module's own docstring calls this "payable
      # in chunks by someone who does not have 2.1 CPU-hours at once", and this
      # is that sentence wired up. Roughly five nights of slices covers 8,667
      # items, after which the run completes warm in ~85 CPU-s and STAYS warm.
      #
      # THE BOUND IS INSIDE THE STEP, NOT THE JOB, AND THAT IS THE WHOLE TRICK.
      # If the JOB hits `timeout-minutes` it is cancelled and the cache's post
      # step can be skipped -- the slice would be computed and thrown away,
      # every night, forever. A `timeout` inside the step makes the process
      # exit cleanly well inside the budget, so the post step always runs and
      # the slice is always banked.
      #
      # THREE OUTCOMES, KEPT APART (doctrine 79). 0 = the constants re-derive.
      # 1 = DRIFT, a real answer and a real failure. 124 = the slice ran out of
      # time, which is neither: it is progress, and it reports how much.
      - name: Song-profile calibration, full (bounded slice, resumable memo)
        if: always()
        working-directory: lyric-harness
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          MEMO=~/.cache/lyric-harness/song_predictability_v1.tsv
          # `grep -c` EXITS 1 ON A ZERO COUNT, so the obvious
          # `$(grep -vc ... || echo 0)` yields the two-line string "0\n0" on a
          # fresh memo and breaks the arithmetic below. Proven locally before
          # this shipped; the default-expansion form is the one that holds.
          #
          # AND IT EXITS **2** WHEN THE FILE IS ABSENT, WHICH IS A DIFFERENT
          # CASE AND WAS UNHANDLED — FIXED 2026-08-23, found by reading why
          # main's nightly had been red for days. The shell is `bash -e`, so
          # under a COLD `actions/cache` the very first line of this step
          # aborted the whole job at exit 2: before `set +e`, before the
          # calibration ran, and before the `case` below could say anything —
          # with grep's own message swallowed by `2>/dev/null`. The job could
          # therefore never bank its first slice, so the cache could never
          # warm, so it failed again the next night. A permanent deadlock whose
          # only symptom was a bare `exit code 2`.
          #
          # `|| true` covers BOTH exits without reintroducing the defect the
          # paragraph above records: on a zero count grep still prints `0`, and
          # on an absent file it prints NOTHING, so the default expansion is
          # what supplies the 0 — one value either way, never "0\n0".
          # Measured, both arms, under `bash -e`.
          before=$(grep -vc '^#' "$MEMO" 2>/dev/null || true); before=${before:-0}
          set +e
          timeout 150m python3 quality/song_profile_calibration.py --check
          rc=$?
          set -e
          # Same guard, same reason: if the run above refused before writing
          # a memo, this line would abort at 2 and skip the `case` that is the
          # only thing able to report what happened.
          after=$(grep -vc '^#' "$MEMO" 2>/dev/null || true); after=${after:-0}
          echo "memo: $before -> $after items (+$((after - before)) banked this run)"
          case $rc in
            0) echo "COMPLETE — the shipped constants re-derive over the whole corpus." ;;
            1) echo "DRIFT — the constants no longer describe corpus/song/."
               echo "Argue it and repin as a SET; do not tune to it (doctrine 58)."
               exit 1 ;;
            124) echo "BOUNDED SLICE — not a failure and not a pass: the run hit"
                 echo "its 150m budget with the memo advanced and banked. The next"
                 echo "nightly resumes from it. A slice that banks ZERO new items"
                 echo "twice running is the thing to investigate, not this."
                 [ "$after" -gt "$before" ] || { echo "NO PROGRESS BANKED"; exit 1; } ;;
            *) echo "UNEXPECTED exit $rc"; exit $rc ;;
          esac

      # ─────────── deployment freshness (M-127) ───────────
      #
      # THE ONE LOOP NOTHING ABOVE CLOSES. Every step in this file runs against
      # the TREE; none ever asks the DEPLOYED process what it is actually
      # serving, so the deployment could drift from main silently — and did:
      # 2026-08-26, a live server advertising a one-commit-stale lyric_sweep
      # schema (12-want ceiling, no story_lineups), found by a person reading a
      # schema rather than by anything that gates. mcp/check_live.mjs asks the
      # live endpoint for its advertised tool surface and byte-compares it
      # (canonical key order, tools keyed by name) against the surface this
      # tree's own buildServer() advertises through the same SDK path.
      #
      # IT GATES HERE AND DELIBERATELY NOT IN THE PER-PUSH JOBS: render.yaml
      # deploys from main, so a feature branch that edits the connector
      # LEGITIMATELY differs from the deployment until it merges, and a
      # per-push gate would charge every honest connector change with the
      # drift it is about to fix. The nightly runs on main, where tree !=
      # deployment is always a defect: autoDeploy failed, or has not caught up.
      #
      # THREE ANSWERS, NEVER COLLAPSED: exit 0 MATCH, exit 3 DRIFT (each
      # drifted tool named with the coordinate that moved), exit 2 REFUSED —
      # the server could not be asked, which is a red worth having since a
      # connector nobody can reach is not a connector that matches.
      - uses: actions/setup-node@v5
        if: always()
        with:
          node-version: '22'

      - name: Install connector dependencies (check_live builds the expected surface in-process)
        if: always()
        run: npm ci --prefix mcp

      - name: Deployment freshness — the live connector's advertised surface against the tree's
        if: always()
        working-directory: mcp
        run: node check_live.mjs

      # THE JOB'S OWN TIME BUDGET, MEASURED 2026-08-27 rather than argued,
      # because three steps joined this job (structure_census, chance_rate
      # --null, regrade_verdicts) and nothing had re-added it up. Run #966's
      # wall clock for the steps that were already here is 200m of the 240m
      # cap, of which the song-profile slice is 147m ON A COLD MEMO. The three
      # additions measure 0.3m + 8.3m + 8.2m = 16.8m on a 4-vCPU box, so the
      # cold-memo worst case is ~217m and the margin is ~23m.
      #
      # THE 150m SLICE BUDGET IS LEFT ALONE ON THAT MARGIN, and the reason is
      # the save step above rather than the arithmetic: an overrun now BANKS
      # its memo, so a night that runs out resumes the next night and
      # completes, instead of restarting cold forever. Cutting the slice to
      # buy margin would trade a self-healing overrun for a check that never
      # reaches its verdict. Re-measure before adding a fourth step here.

      # THE OTHER HALF OF THE SPLIT ABOVE, and it is the half that ends the
      # deadlock: the memo is banked whatever the job's verdict, so a DRIFT
      # (exit 1) or a bounded slice that overran (exit 124) still advances the
      # resume point. The key carries `github.run_id`, so it never hits exactly
      # and this step always writes a new entry — the restore-keys prefix is
      # what picks up the newest one next night.
      - name: Bank the predictability memo — whatever this job's verdict was
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/lyric-harness
          key: lyric-harness-predictability-v1-${{ github.run_id }}
