name: CI

# Least privilege: CI only reads the repo (the publish workflow, sync-pages.yml,
# is the only one that needs contents: write).
permissions:
  contents: read

on:
  push:
    # EVERY BRANCH, and the absence of a list is the point.
    #
    # This filter read `branches: [main]` until 2026-08-14, which meant a commit
    # pushed to a branch with no open PR got NO CI AT ALL. Six such commits went
    # uncovered on 2026-08-14 before anyone noticed; the branch was eventually
    # covered by two manual `workflow_dispatch` runs (runs 358 and 365, 31.7 and
    # 32.1 minutes of wall clock). That workaround costs MORE than the run it
    # stands in for — `tandem` is pinned to dispatch and joins every one of them
    # — and it covers only whatever commit happened to be at the tip when
    # somebody remembered to press the button.
    #
    # `[main, 'claude/**']` was the alternative, and it is the defect this file
    # already argues against one level down. The two-crons note below rejects an
    # unpinned condition because it "silently joins every new cadence anybody
    # adds"; a pinned LIST fails the other way — it silently drops every new
    # branch NAME anybody adds. That is not hypothetical here: `master` sat in
    # this very filter naming a branch that did not exist, and nothing ever
    # noticed, because a filter matching nothing looks exactly like a filter
    # matching everything it was asked about. '**' has nothing to remember and
    # nothing to rot.
    #
    # `branches:` rather than a bare `push:`, so TAG pushes still do not start a
    # run: a tag carries no branch, and sync-pages.yml keys its publish off this
    # workflow's runs.
    #
    # SAFE FOR PUBLISHING — checked, not assumed. sync-pages.yml's `workflow_run`
    # trigger filters `branches: [main]` (sync-pages.yml:31), and that filter
    # matches the TRIGGERING RUN's head branch, so a run started by a push to
    # `claude/x` never reaches it. Its job `if:` then independently requires
    # `workflow_run.event == 'push'` AND a head_repository equal to this
    # repository. Widening this filter only adds runs that fail the first test.
    #
    # NOTE, unchanged by the widening: CI running and reporting on a DIRECT push
    # to the production branch does not BLOCK the concurrent sync-pages publish;
    # enforcing "green before live" requires branch protection on the production
    # branch (a repo Setting, not workflow config) requiring these checks on PRs
    # + disallowing direct pushes.
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # Weekly, so the slow cross-artifact meta-test (see the `tandem` job) has a home,
  # and so a full re-verify catches bit-rot from the toolchain rather than from us.
  #
  # TWO CRONS NOW, AND EVERY SCHEDULED JOB NAMES THE ONE IT WANTS. While there
  # was exactly one cron, `github.event_name == 'schedule'` identified it
  # precisely; with two it does not. An unpinned scheduled job silently joins
  # every new cadence anybody adds — adding the nightly below would, on its
  # own, have promoted the 25-minute `tandem` job from weekly to daily. So
  # `tandem` names the weekly cron and the two nightly jobs name the nightly
  # one, and a third cron cannot change what any existing job does.
  schedule:
    - cron: '0 6 * * 1'
    # Nightly, for the checks the measurement in `suites` prices out of a pull
    # request. Deliberately NOT at :00 — GitHub's scheduler queues cron runs
    # globally and the top of the hour is the most contended minute there is,
    # which shows up as a scheduled run starting late or being dropped.
    - cron: '17 4 * * *'

# ONE LIVE RUN PER BRANCH. This is the `gate` job's argument (below) restated at
# the level of the RUN instead of the JOB, and it was the larger of the two leaks
# the entire time `gate` was being written.
#
# `gate` exists because 53 minutes of runner time went on results that a
# 35-second failure had already guaranteed would be discarded. Nothing in that
# sentence is specific to a FAILING job: a run that has been superseded by a
# newer commit on the same branch is also computing an answer nobody will read.
# Until 2026-08-14 there was no `concurrency` key anywhere in this file, so every
# push started a complete parallel run and not one of them was ever stopped.
#
# MEASURED, from the Actions API rather than from memory — runs 359-363,
# 2026-08-14 03:56-04:44Z, five `pull_request` runs on one branch, fully
# overlapping, none cancelled. Summing job durations: 69.8 runner-minutes each,
# 349 for the burst, to learn what run 363 alone would have said. Cancelling the
# superseded four the moment their successor starts leaves ~223, a 36% saving
# rather than the 5x that "cancel four of five runs" suggests — most of a run's
# cost lands in its first twelve minutes and two of those pushes were twelve
# minutes apart. The saving is real and it is not the headline number.
#
# WHY THE GROUP KEY IS NOT SIMPLY `github.ref`:
#
#   1. SCHEDULED AND MANUAL RUNS ARE ALONE IN THEIR GROUP (`github.run_id` is
#      unique per run), so they can neither cancel nor be cancelled nor queue
#      behind anything. `tandem` (weekly) and `nightly` (budgeted at up to 240
#      minutes) are the two most expensive things this file can start and
#      neither is reproducible on demand from a later commit. Keying them by ref
#      would put them in the same group as pushes to main: not cancelled, but
#      QUEUED — a push to main during a nightly would wait hours for CI, and
#      sync-pages would publish that late. This also makes "a schedule can never
#      be cancelled" true by construction, rather than true by an argument about
#      what `github.ref` happens to hold during a cron.
#
#   2. PUSH AND PULL_REQUEST FOR THE SAME BRANCH SHARE A GROUP. With the push
#      filter widened to '**' above, a push to a branch that has an open PR fires
#      BOTH events; keyed on `github.ref` they land in different groups
#      (`refs/heads/x` vs `refs/pull/N/merge`) and both run to completion. That
#      is +69.8 runner-minutes on every push during a PR — more than this block
#      and the closure rule save put together. `github.head_ref ||
#      github.ref_name` is the branch NAME under both events, so they collide
#      and the newer cancels the older.
#
#   3. THE SOURCE REPOSITORY IS IN THE KEY. sync-pages.yml documents at length
#      that `branches: [main]` matches a branch NAME and not a repository, so a
#      fork whose branch is literally called `main` satisfies it. The same trick
#      applies to a concurrency group: without the repo in the key, a fork PR
#      from a branch named `main` would share a group with pushes to production,
#      and an outsider could stall or cancel the very run sync-pages keys its
#      publish off. `head_repository` is what separates WeningerII/CodexMusica
#      from anyone/CodexMusica, exactly as it does there.
#
# AND THE CANCEL TEST IS ON THE GROUP'S OWN BRANCH COMPONENT, not on
# `github.ref`. `github.ref != 'refs/heads/main'` reads correctly for a push and
# is wrong for the one run that matters: during a pull_request run `github.ref`
# is `refs/pull/N/merge`, which is never equal to `refs/heads/main` even when the
# PR's head branch IS `main` — so that form answers "yes, cancel" for the only
# event that could take production's run down. Testing the same expression the
# group is built from means no run can cancel anything in the `main` group,
# whatever event produced it.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ (github.event_name == 'schedule' || github.event_name ==
    'workflow_dispatch') && github.run_id || format('{0}@{1}',
    github.event.pull_request.head.repo.full_name || github.repository, github.head_ref ||
    github.ref_name) }}
  cancel-in-progress: ${{ (github.head_ref || github.ref_name) != 'main' }}

jobs:
  # Cheap, fast-failing gates, run FIRST and alone so an expensive job never
  # burns a runner proving something that is about to be thrown away.
  #
  # These four completed in 41 seconds combined on the run that motivated this
  # job — and one of them FAILED there, at the 35-second mark. Because nothing
  # declared `needs:`, `freshness` and `catalog` had already started and went on
  # to spend 30 and 18 minutes producing results the failure guaranteed would be
  # discarded; the one-line fix then cost a second full round. Gating on this job
  # turns that 53 minutes of wasted runner time into 46 seconds.
  #
  # Only put a check here if it is fast AND its failure invalidates the slow jobs.
  # Anything needing Chromium, a fresh build, or minutes of CPU belongs below.
  gate:
    runs-on: ubuntu-latest
    # Measured ~1 minute. A cap on the job every other job needs:, so a
    # wedged gate can never hold the whole pipeline's queue hostage.
    timeout-minutes: 10
    outputs:
      # Whether this diff can possibly change api/ or codex.html. Consumed by the
      # two jobs whose cost is linear in catalog size. See the step that sets it.
      artifacts_affected: ${{ steps.scope.outputs.artifacts_affected }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Needed to diff against the base commit in the scope step below.
          fetch-depth: 0

      # ── Can this diff move a built artifact? ──────────────────────────────
      #
      # ~~The freshness rebuild is ~30 of its ~34 minutes, the catalog shards add
      # ~62 runner-minutes~~, and both ran on every push including one that only
      # touched a README. That is the repo's single strongest deterrent to a
      # drive-by contribution: a one-word docs fix cost a 35-minute round trip.
      #
      # BOTH FIGURES STRUCK AND RE-MEASURED 2026-08-14, from the Actions API
      # (run 31769893295, job durations summed): the rebuild step is 7.7 min of
      # an 11.7-min `freshness`, and the four catalog shards are 25.2
      # runner-minutes, not 62. A whole run is 69.8 runner-minutes, so this step
      # is worth 32.9 of them — half a run, not the ~96 the struck numbers
      # promise. Nobody had to measure anything to doubt them: every CI run in
      # the week before finished in 13-18 minutes of WALL clock, which a
      # 30-minute rebuild cannot fit inside. The struck text is kept because the
      # decision it justifies is still the right one at the smaller number.
      #
      # THE ASYMMETRY IS THE WHOLE DESIGN. Deciding "rebuild" when we did not
      # need to costs runner minutes. Deciding "skip" when we did need to ships
      # a stale artifact — the exact failure the freshness gate exists to catch,
      # and one that already happened twice here.
      #
      # This step used to answer the question with a docs-only allowlist, and
      # said in as many words that it deliberately did NOT compute the build's
      # dependency closure, because guessing that closure wrong fails in the
      # dangerous direction, silently. That objection was right about GUESSING,
      # so scripts/_build_closure.js does not guess:
      #
      #   • the script side is DERIVED — the transitive require() graph of the
      #     three artifact builders, recomputed from source on every run;
      #   • everything else is DENY-BY-DEFAULT — a path is in the closure unless
      #     it matches an explicit inert rule carrying a reason, so anything new
      #     or unrecognised still means rebuild, exactly as before;
      #   • and check_build_closure.js (in this job, below) proves the derivation
      #     by tracing a REAL build of all three artifacts and failing if any file
      #     they actually read sits outside the closure. That check found a
      #     genuine hole on its first run — build_html.js splices
      #     _card_descriptors.js in by path rather than requiring it — which is
      #     the failure mode a hand-written list would have shipped.
      #
      # So the allowlist got precise instead of getting trusted: a gate script, a
      # workflow edit, or an mcp/ change no longer pays a 30-minute rebuild,
      # while the answer for anything unclassified is still "rebuild".
      #
      # Every uncertain case resolves to rebuild: no base commit, a force-push
      # whose base is gone, a scheduled or manual run, a merge with no diff we
      # can compute. The fallback is the old behaviour, which is always correct
      # and merely slow.
      - name: Scope — can this diff move a built artifact?
        id: scope
        run: |
          set -uo pipefail
          affected=true
          base=""
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push)         base="${{ github.event.before }}" ;;
          esac

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base commit — assuming artifacts affected."
          elif ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Base commit $base is not present (force-push?) — assuming artifacts affected."
          elif ! changed=$(git diff --name-only "$base" "${{ github.sha }}" 2>/dev/null); then
            echo "Could not compute a diff — assuming artifacts affected."
          elif [ -z "$changed" ]; then
            echo "Empty diff — assuming artifacts affected."
          else
            echo "Changed files:"
            echo "$changed" | sed 's/^/  /'
            # Classify every changed path against the derived closure. Prints
            # true/false; CODEX_CLOSURE_VERBOSE puts the per-path reason in the
            # log so a "rebuilding" decision is always attributable to a file.
            # Uses only node builtins + git, so it runs before setup-node/npm ci.
            if [ "$(CODEX_CLOSURE_VERBOSE=1 node scripts/check_build_closure.js --affected $changed)" = "true" ]; then
              echo "→ at least one changed path is in the artifact build closure; rebuilding."
            else
              affected=false
              echo "→ no changed path is read by any artifact builder."
            fi
          fi
          echo "artifacts_affected=$affected" >> "$GITHUB_OUTPUT"
          echo "artifacts_affected=$affected"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting (prettier --check)
        run: npm run format:check

      - name: Validate references
        run: npm run validate

      - name: Docs drift + documented-command validity
        run: npm run check-docs

      # Proves the scope decision above. Traces a real build of all three
      # artifacts and fails if anything it reads is classified inert — i.e. if
      # the step above could ever skip a rebuild that was needed. Runs on every
      # diff, docs-only included, because the closure can rot from either side:
      # a builder gaining an input, or an inert rule widening to swallow one.
      - name: Build closure is sound (scope decision is provable)
        run: npm run check:closure

  verify:
    needs: gate
    runs-on: ubuntu-latest
    # MEASURED at ~8-12 minutes green. Absent, GitHub's default allowed the
    # 2026-08-17 apt-get stall inside the Chromium install to burn 1h44m
    # (run #506) until a human cancelled it — a hang is now a 30-minute
    # failure with a name, never a six-hour vigil.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The connector's own dependency tree. mcp/ is a separate package (the
      # Docker image installs it independently), and its deps — zod, express, the
      # MCP SDK — are not in the root lockfile. Most of mcp/test.mjs only imports
      # engine.js, which has no dependencies at all, but its last check builds the
      # real McpServer and SKIPS ITSELF when the SDK is absent. Without this step
      # that check is silently vacuous, so the one assertion that the tool
      # registrations actually load would never run in CI.
      - name: Install connector dependencies
        run: npm ci --prefix mcp

      # The lyric family's LIVE checks in mcp/test.mjs drive real python3
      # subprocesses (mcp/lyric_tools.js). The runner has python3, but the
      # slop floor reaches the POS tagger through quality/features.py, so
      # nltk must be installed and the lexicon/tagger staged — the SAME
      # three moves the Docker image makes at build. Without nltk the
      # harness dies at import inside the subprocess and the live check
      # reads exit 1: run #555's exact failure (2026-08-18), which the
      # locally-green run never saw because the sandbox had nltk.
      - name: Stage the lyric harness for mcp/test.mjs's live checks
        run: |
          python3 -m pip install --disable-pip-version-check nltk
          cd lyric-harness
          python3 -c "import lyric_harness; lyric_harness.fetch_data()"
          python3 quality/fetch_data.py

      # The browser binaries are CACHED keyed on the lockfile: on a hit the
      # install below finds them present and exits in seconds, and the
      # apt-get layer (`--with-deps`) — the exact step that stalled 1h44m
      # on run #506 — is only played on a cache miss. The step-level
      # timeout is the second lock on the same door: even a miss that
      # stalls dies in 10 minutes with the step named, not the job's 30.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Install Chromium (for UI reachability)
        timeout-minutes: 20
        # `--with-deps` bundled two deliveries with opposite reliability: the
        # browser from Playwright's CDN (fast, and cached above) and the
        # system packages from apt, which has repeatedly stalled on a slow
        # Azure mirror and eaten the whole step (runs #559, #565, #570 —
        # font packages at ~35 kB/s into a 10-minute timeout). Split them
        # and retry the apt half — apt is idempotent, and a fresh attempt
        # usually lands on a healthy mirror connection. Same packages, same
        # rendering environment; only the delivery is hardened.
        run: |
          npx playwright install chromium
          ok=0
          for i in 1 2 3; do
            if npx playwright install-deps chromium; then ok=1; break; fi
            echo "install-deps attempt $i failed; retrying"
            sleep 10
          done
          [ "$ok" = "1" ]

      # lint / format / validate / check-docs now run in the `gate` job above,
      # which this job depends on — repeating them here would just re-spend 41s.

      - name: Static API contract (committed api/ honors promises)
        run: npm run check:api

      - name: Promise→gate coverage (every promise documented AND gated, 0 orphans)
        run: npm run check:promises

      - name: Preface lexicon hygiene (no dup/empty/production-dead tokens, no dup ids)
        run: npm run check:prefaces

      - name: Authoring dead-token gate (every preface token reaches a tradition-default card)
        run: npm run check:dead-tokens

      # Renaming a record must never move a DIFFERENT record's picks. This was a
      # real defect: a sibling tradition's "(70s-80s)" name tag put `80s` into
      # merseybeat's scoring context and compiled a 1962-1968 tradition with a
      # 1981 amplifier.
      - name: Name isolation (no tradition's picks depend on another's name)
        run: npm run check:names

      # The publish workflow is the one piece of this repo no other gate covered,
      # and it shipped a stale live artifact twice on consecutive merge pairs
      # before anyone noticed. Its decision now lives in scripts/publish_guard.sh
      # and is exercised against a synthetic replay of that exact race.
      - name: Publish guard (a superseded build can never overwrite the live site)
        run: npm run check:publish

      - name: Audit data quality
        run: npm run audit

      - name: Regression (recipes, prefaces, slots, app)
        run: npm run test

      # Locale invariance, tested rather than asserted.
      #
      # The gate renders the catalog in two child processes under deliberately
      # different collations and byte-compares. That shape is deliberate: it is
      # the only one that catches a comparator regression where BOTH copies drift
      # together, which check_app_parity cannot see (it runs both engines in one
      # process, so equally-wrong is indistinguishable from right) and which the
      # pinned fixtures cannot see either (their snapshots were generated under
      # the runner's own locale, and the pin was chosen to be output-neutral
      # there). Both blind spots were confirmed by experiment before this was
      # written — see the header of the script.
      #
      # Re-running existing fixtures under LANG=da_DK was tried first and is
      # VACUOUS for this bug class: 1149/1149 still pass with the comparator
      # reverted, because those fixtures do not exercise the affected sets.
      - name: Locale invariance (recipe bytes identical under da-DK and C)
        run: npm run check:locale

      # Differential: the same seeded random edit script through both surfaces.
      #
      # check_edit_parity is a matrix of single actions on a freshly seeded card.
      # It cannot reach "set_variant on a card a set_preface already reshaped, in
      # a workspace whose first card was removed" — and divergence between two
      # hand-maintained forks of one renderer hides in the third move, not the
      # first. This walks random op sequences through the app's real functions
      # and the connector's ops in lockstep, byte-comparing all four formats
      # after every op, and refuses to report success unless the run actually
      # explored every op, multi-card rosters, and env-less-head states.
      - name: Edit differential (random scripts, both surfaces, byte-compared)
        run: npm run check:differential

      # CLI output survives a pipe.
      #
      # Node writes to a file synchronously and to a pipe ASYNCHRONOUSLY, and
      # process.exit() discards the unflushed pipe queue. Every mode of list.js
      # ended in process.exit(0), so `list.js --traditions | wc -l` answered 989
      # for a 2503-entry catalog — a different wrong number each run, exit 0
      # every time. SKILL.md tells agents to pipe these commands.
      #
      # This runs the same invocation to a file and three times through a pipe
      # and requires identical digests. Three, because the failure is a race and
      # a single piped run can pass by luck.
      - name: CLI output complete through a pipe
        run: npm run check:cli

      - name: Build codex.html (lazy shell + no-table-leak + byte-ceiling check)
        run: npm run build:html

      - name: UI reachability
        run: npm run reachability

  # Reproducibility + two-sided gates. Separate job so the fresh rebuild runs in
  # parallel with `verify`, and still gates the merge (runs on PRs).
  #
  # The rebuild dominates this job: ~~a claimed 30 min of its 34 min~~ a
  # measured 7.7 min of its 11.7 min at 2,503 traditions, against <1s for the
  # byte-comparison it exists to enable. It is linear in catalog size (~~19 min
  # at 1,426~~), so treat any figure quoted here as a measurement with a shelf
  # life, not a constant.
  #
  # RE-MEASURED 2026-08-14 (run 31769893295, step "Build a fresh artifact from
  # source": 04:28:54Z-04:36:34Z = 460s). The struck sentence is precisely what
  # the sentence after it warns about, in the same paragraph, about itself. The
  # 1,426-tradition figure is struck rather than corrected because it cannot be
  # re-measured now; linear scaling from 7.7 min at 2,503 puts it near 4.4, so
  # whatever it measured, it was not this build on this runner.
  freshness:
    needs: gate
    runs-on: ubuntu-latest
    # MEASURED at ~10-15 minutes green; the same apt-stall class as verify
    # hung THIS job 44m+ on the run for PR #168 (2026-08-18). Same cap,
    # same reason.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The connector's own dependency tree. mcp/ is a separate package (the
      # Docker image installs it independently), and its deps — zod, express, the
      # MCP SDK — are not in the root lockfile. Most of mcp/test.mjs only imports
      # engine.js, which has no dependencies at all, but its last check builds the
      # real McpServer and SKIPS ITSELF when the SDK is absent. Without this step
      # that check is silently vacuous, so the one assertion that the tool
      # registrations actually load would never run in CI.
      - name: Install connector dependencies
        run: npm ci --prefix mcp

      # faults.js injects a defect into codex.html and asserts check_mobile_layout
      # catches it — that gate drives a real browser, so this job needs one too.
      # Same cache + step cap as verify's install, same measured hangs.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Install Chromium (for the mobile-layout fault class)
        timeout-minutes: 20
        # Same hardening as the verify job's install step, for the same
        # reason: the apt half of --with-deps flakes on a slow mirror, the
        # CDN half never has. Split, retry apt up to three times, fail the
        # step only when all three attempts fail.
        run: |
          npx playwright install chromium
          ok=0
          for i in 1 2 3; do
            if npx playwright install-deps chromium; then ok=1; break; fi
            echo "install-deps attempt $i failed; retrying"
            sleep 10
          done
          [ "$ok" = "1" ]

      - name: Build a fresh artifact from source
        if: needs.gate.outputs.artifacts_affected == 'true'
        run: |
          node scripts/build_static_api.js --out="$RUNNER_TEMP/fresh/api"
          node scripts/build_html.js --out="$RUNNER_TEMP/fresh/codex.html" --quiet

      - name: Reproducibility — committed api/ + codex.html == fresh build (0 diff)
        if: needs.gate.outputs.artifacts_affected == 'true'
        run: node scripts/check_artifact_fresh.js --prebuilt-api="$RUNNER_TEMP/fresh/api" --prebuilt-html="$RUNNER_TEMP/fresh/codex.html"

      # Fault injection runs on EVERY diff, docs-only included, and that is
      # deliberate: several of its classes inject into AGENTS.md / README.md /
      # SKILL.md to prove the promise and doc-drift gates are two-sided. Skipping
      # this job wholesale on a docs change would drop exactly the fault coverage
      # a docs change most needs.
      #
      # On a docs-only diff it takes the COMMITTED artifacts as its "fresh" pair.
      # That is not a shortcut around the reproducibility claim — it is the same
      # claim: no artifact builder reads a .md file, so the committed pair is
      # what a fresh build of this tree produces, and the parent commit's own
      # freshness run proved it byte-for-byte. faults.js copies before injecting,
      # so the working tree is untouched either way.
      - name: Fault injection — every gate is two-sided (0 escapes)
        run: |
          if [ "${{ needs.gate.outputs.artifacts_affected }}" = "true" ]; then
            node scripts/faults.js --fresh-api="$RUNNER_TEMP/fresh/api" --fresh-html="$RUNNER_TEMP/fresh/codex.html"
          else
            echo "Docs-only diff — injecting against the committed artifacts."
            node scripts/faults.js --fresh-api=api --fresh-html=codex.html
          fi

  # Catalog-wide breadth. `verify` proves depth — 1,171 pinned recipe fixtures —
  # but only smoke.js exercises EVERY tradition, blend and axis-target through the
  # live search → score → translate pipeline (5,879 assertions). It used to run
  # nowhere automatic: build.js called it, CI did not, so the broadest check in the
  # repo depended on someone remembering.
  #
  # Sharded across 4 runners because its cost is linear in catalog size and the
  # catalog grew 76% in one import: it was ~16 min at 1,426 traditions and ~31 min
  # at 2,503. smoke.js --shard=i/n deals traditions round-robin, so the four shards
  # partition the catalog exactly — the union is an unsharded run, with no
  # assertion dropped or double-counted. The fixed-size sections (blends, axis
  # targets, multi-tradition scenarios) run on shard 1 only, since they do not
  # grow with the catalog.
  catalog:
    needs: gate
    # Measured ~8-10 min per shard at the current catalog size; the sharding
    # note below prices its growth, and 45 leaves headroom for another such
    # import before this cap needs to move WITH a new measurement.
    timeout-minutes: 45
    # smoke.js drives the search → score → translate engine over every tradition
    # and reads no documentation, so a docs-only diff cannot change one of its
    # 5,879 assertions. Same allowlist, same fail-safe default as `freshness`;
    # this is ~~a claimed 62~~ a measured 25.2 runner-minutes that a README fix
    # was paying for (re-measured 2026-08-14, run 31769893295, the four shards:
    # 6.9 + 5.9 + 6.4 + 6.0).
    if: needs.gate.outputs.artifacts_affected == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: catalog (shard ${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Catalog-wide smoke (every tradition through the live pipeline)
        run: node scripts/smoke.js --shard=${{ matrix.shard }}/4

  # An always-reporting summary over the catalog shards, so the repo's broadest
  # gate can actually be a REQUIRED status check.
  #
  # `catalog` cannot be required directly, for two independent reasons:
  #
  #   1. It is a matrix, so it publishes four expanded check names
  #      ("catalog (shard 1/4)" …). Requiring names that carry a matrix value
  #      means the required set has to be re-edited every time the shard count
  #      changes — and the shard count exists to track catalog growth, so it will.
  #
  #   2. It is CONDITIONAL: skipped whenever no changed path can move an
  #      artifact. A required check that never reports blocks the merge forever,
  #      and that failure mode is silent until someone opens a docs-only PR and
  #      finds it un-mergeable.
  #
  # A conditional job does still report a `skipped` conclusion — `tandem` does
  # exactly that. But `tandem` has neither a matrix nor a `needs:`, and `catalog`
  # has both, so that is evidence about a different shape of job rather than
  # proof about this one. This job removes the question instead of betting on the
  # answer: fixed name, no matrix, `if: always()`, so it reports on every run
  # whatever the shards did.
  #
  # Passes when the shards succeeded, and when they were legitimately skipped.
  # Fails on anything else. `needs.catalog.result` is the AGGREGATE across the
  # matrix, and `fail-fast: false` means every shard runs, so one red shard
  # surfaces here rather than being masked by a sibling.
  catalog-result:
    needs: catalog
    # A seconds-long fan-in; capped so a wedged runner cannot make it the
    # slowest job in the run it exists to summarize.
    timeout-minutes: 15
    # ~~if: always()~~ — REPLACED 2026-08-16, AND IT WAS PUTTING A RED X ON
    # EVERY COMMIT ON EVERY BRANCH WITH AN OPEN PR.
    #
    # `always()` INCLUDES THE CANCELLED STATE. ~~An open PR means every push
    # spawns two runs — one `push`, one `pull_request` — and the concurrency
    # group cancels the `push` one within seconds, EVERY TIME, by design.~~
    # That cancellation makes `needs.catalog.result` = `cancelled`, this job
    # ran anyway, and the `*)` arm below turned it into
    # `::error::catalog shards reported 'cancelled'` + exit 1. MEASURED on run
    # #426 (`c806457`): the run started 00:30:34 and this job errored at
    # 00:30:41 — SEVEN SECONDS IN, with no shard having done any work at all.
    #
    # THAT STRUCK SENTENCE IS FALSE AND WAS FALSE WHEN WRITTEN — REPINNED
    # 2026-08-16, AND THE FIX BELOW IS UNAFFECTED (read the last paragraph of
    # this block before touching `if:`). It is wrong twice:
    #
    #   "EVERY push spawns two runs" — 6 of the 18 shas on this branch spawned
    #   a `push` run and NOTHING else (`e743663`, `868a23c`, `aaabe56`,
    #   `7a89606`, `a6e0924`, `e076bf0`). A PR-synchronize run is not
    #   guaranteed for every push.
    #
    #   "cancels the `push` one, EVERY TIME, by design" — three push runs on
    #   this branch ran to completion and reported SUCCESS (#435 `1f53c93`,
    #   #438 `a6e0924`, #440 `e076bf0`), and on `1f53c93` it was the
    #   PULL_REQUEST run that died (#436 cancelled) while its push twin
    #   succeeded. The tendency is real and strong — of the 12 shas carrying
    #   both events, 11 lost the push run and 1 lost the PR run — but a
    #   10-of-12 tendency was written down as a guarantee, which is doctrine
    #   58's shape applied to a RULE rather than to a number.
    #
    # WHAT THE CONFIG ACTUALLY SAYS, read off the `concurrency:` block above
    # rather than inferred from a pattern: the group is
    # `CI-{repo}@{branch}` and THE EVENT NAME IS NOT IN THE KEY. So every run
    # on a branch — `push` and `pull_request` alike — shares one group, and
    # `cancel-in-progress` means WHICHEVER RUN STARTS LATER KILLS WHATEVER IS
    # STILL RUNNING. Nothing singles out `push`. A run dies because something
    # followed it: usually its own PR twin seconds later, sometimes the NEXT
    # PUSH (that is why 4 of those 6 push-only shas were also cancelled — by
    # my next commit, not by a twin), and it survives only when nothing
    # follows before it finishes. The push run tends to lose because it is
    # the one that starts FIRST, not because it is a push.
    #
    # AND THIS FILE ALREADY SAID THAT, CORRECTLY, FORTY LINES UP. The
    # `concurrency:` header's reason 2 reads "`github.head_ref ||
    # github.ref_name` is the branch NAME under both events, so they collide
    # and THE NEWER CANCELS THE OLDER" — the accurate rule, written when the
    # key was designed. The struck sentence was written later, from watching
    # runs rather than from re-reading the block it was describing, and the
    # two sat 40 lines apart in one file saying different things about one
    # mechanism. That is the defect this repo keeps finding in its own
    # records (doctrine 1: one question, one reading), and it is the reason
    # the correction is written HERE, next to the wrong one, instead of
    # quietly deleting it.
    #
    # NONE OF THIS WEAKENS THE `if:` BELOW, and the correction is recorded
    # here precisely so nobody unwinds the guard on the strength of a
    # corrected premise. `!cancelled()` rests on "a run being torn down must
    # not be aggregated" — which is true whoever tore it down and whichever
    # event was the victim. The guard would be equally necessary if the PR
    # run were always the one cancelled, and 2026-08-16's run #441/#442 pair
    # is the demonstration: `fe6a525`'s push run was cancelled, its
    # `catalog-result` reported SUCCESS rather than manufacturing an error,
    # and the surviving PR run #442 finished green with 0 failed jobs.
    #
    # The check run is stamped on the SHA, so the commit list showed a red X
    # against four consecutive green commits while the `pull_request` run on
    # the same sha reported SUCCESS with 0 failed jobs (run #427). A reader
    # checking CI saw a colour that meant nothing about the code, which is the
    # most expensive kind of wrong a gate can be.
    #
    # `cancelled` AND `failure` ARE DIFFERENT STATES (doctrine 79 — a refusal
    # is not a failure, and putting it in the numerator charges the wrong
    # layer). `!cancelled()` says: do not aggregate a run that is being torn
    # down. It does NOT weaken the gate — the `*)` arm still fires on a
    # `cancelled` result when the RUN itself was not cancelled, which is the
    # case that means a shard hit its own timeout and IS a real error.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate the catalog shards
        run: |
          result="${{ needs.catalog.result }}"
          echo "catalog aggregate result: $result"
          case "$result" in
            success)
              echo "All shards passed."
              ;;
            skipped)
              echo "Shards skipped — the scope step found no changed path in the artifact build closure."
              ;;
            cancelled)
              # Reached only when the RUN was not cancelled (the `if:` above),
              # so this is a shard that died on its own — a timeout or a
              # runner loss. Named apart from `failure` rather than folded in,
              # because the two ask different things of whoever reads it.
              echo "::error::catalog shards were CANCELLED while the run was not — a shard hit its own timeout or lost its runner"
              exit 1
              ;;
            *)
              echo "::error::catalog shards reported '$result'"
              exit 1
              ;;
          esac

  # tandem.js — the cross-artifact meta-test. Weekly and on demand, not per-PR.
  #
  # Most of what it checks is now covered per-PR and better: its [4/4] textual
  # app-vs-node invariants are superseded by check_app_parity.js, which compares
  # the two BEHAVIOURALLY, byte-for-byte, catalog-wide, across every format; its
  # [2/4] HTML checks overlap check_lazy_app; its [3/4] zip round-trip guards an
  # artifact that is neither committed nor published. What remains genuinely
  # unique is [1/4]'s comparison against the 18 committed tests/*_audit.json
  # snapshots, which nothing else reads. That is worth a weekly run, not 25+
  # minutes on every pull request.
  #
  # PINNED TO THE WEEKLY CRON. This read `github.event_name == 'schedule'`,
  # which was exact while this workflow had one schedule. It now has two, and
  # an unpinned condition would have made this 25+ minute job run every night
  # — the precise outcome its own comment above argues against, arrived at by
  # editing a different part of the file. Naming the cron keeps "weekly, not
  # per-PR" true no matter what cadences get added later.
  tandem:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1')
    runs-on: ubuntu-latest
    # Measured ~25 min, weekly. The cap is the measurement plus headroom —
    # the same rule every job now carries, closed 2026-08-18 after two
    # uncapped jobs hung 1h44m and 44m+ in the same week.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tandem's [2/4] and [3/4] sections cross-check the BUILT artifacts against
      # source, so they need those artifacts to exist. Nothing here built them:
      # scripts/_paths.js resolves OUTPUT_DIR to $TMPDIR/codex-outputs on a
      # runner, and this job went straight from `npm ci` to `npm run tandem`.
      # The result was five ENOENT failures on every single run — a job that
      # could not pass, reporting defects that were only its own missing setup.
      - name: Build the artifacts tandem cross-checks
        run: |
          node scripts/build_html.js --quiet
          bash scripts/build_zip.sh

      - name: Cross-artifact tandem (source ↔ HTML ↔ zip, + audit snapshots)
        run: npm run tandem

  # ── The record checks: does the repo still say what the code does? ────────
  #
  # THE FIRST PYTHON THIS WORKFLOW HAS EVER RUN. Until now `lyric-harness/` —
  # 74 production modules, ~57k lines, 44 test modules — was executed by CI
  # zero times. No workflow referenced python, pytest or .py; no npm script
  # invoked one; there is no pytest.ini, tox.ini, pre-commit or Makefile. Every
  # check in that subtree ran only when a human remembered to type the command.
  #
  # An execution-traced audit on 2026-08-13 priced that. Findings the four
  # checks below would each have caught, and did not because nothing ran them:
  #   * CLAUDE.md asserted "Whitman 17.3% chained — MEASURED, and battery.py
  #     prints it". battery.py printed 10.7%. Wrong by 6.6 points, in the one
  #     place the sentence invites a reader to check it.
  #   * The same block pinned the sonnet oracle at 81/8.0%; battery.py's own
  #     EXPECTED had said 82/8.1% for two days.
  #   * quality/matrix_eval.json went stale on 2026-08-10 and stayed stale
  #     through 31 commits to the comparator, while NULL_AUDIT.md listed it
  #     under "Reproduced exactly, no defect found".
  #   * verify_entries.py was RED — a false BACKLOG line-count entry — and had
  #     been for an unknown period, because nothing ran it either.
  #
  # ~~WHY THESE FOUR AND NOT THE SUITES. These are the checks that compare the
  # RECORD against the CODE; they are cheap and they fail loud. The test suites
  # are a different job: quality/test_revise.py and test_loop.py each take 15+
  # minutes, and quality/song_profile_calibration.py --check — the fifth drift
  # detector — re-derives a 143-file corpus and needs 2.5-4 hours, not the
  # "order of an hour" its docstring claims. Putting a multi-hour job here to
  # look thorough is how a required check becomes one people skip.
  #
  # Measured on this repo: 4s + 4s + 5s + 25s. The 10-minute timeout is a
  # runaway guard, not a budget.~~
  #
  # SUPERSEDED 2026-08-14, AND THIS PARAGRAPH IS NOW THE STALE RECORD IT WAS
  # WRITTEN TO PREVENT. Struck rather than deleted (doctrine 17), because what
  # it got wrong is the point. Four things in it are false:
  #
  #   * "THESE FOUR" — this job runs 22 checks.
  #   * "test_revise.py and test_loop.py each take 15+ minutes" — MEASURED at
  #     183.95 and 190.92 CPU-s, about three minutes each, both green. Neither
  #     file declares the 15-minute figure anywhere; it was never run. The
  #     refuting measurement now sits ~350 lines BELOW this claim IN THE SAME
  #     FILE, which is exactly the shape this workflow's own checks exist to
  #     catch — a figure quoted beside the command that prints it, where nobody
  #     re-runs the command.
  #   * "the suites are a different job" as an EXCLUSION — the `suites` job runs
  #     all 44 on every pull request. It is a different job because it is
  #     structured that way, not because the suites are unaffordable.
  #   * "song_profile_calibration.py --check ... needs 2.5-4 hours" — `record`
  #     runs it below at --without-predictability in 64s, and `nightly` runs the
  #     full arm warm off a cache at ~85 CPU-s.
  #
  # WHAT IS ACTUALLY TRUE, and is the reason the split still exists: this job
  # holds the checks that compare the RECORD against the CODE and cost seconds;
  # `suites` holds the test modules; `nightly` holds the four instruments whose
  # cost is measured in CPU-minutes. Three jobs, three cost classes, each
  # membership decided by a measurement recorded at its own step.
  #
  # ALL FOUR WERE PROVEN TO FAIL before this job was added, by injecting the
  # breakage each one names and confirming a non-zero exit: a renumbered
  # doctrine (gap at 50) -> verify_doctrines exit 1; a false MODULE_LINE_COUNT
  # claim -> verify_entries exit 1; a false committed counter -> counters exit
  # 1; a perturbed AUC -> eval_matrix exit 1. That exercise found a fifth
  # defect: verify_doctrines' contiguity check printed WARN and never set
  # `ok`, so a deleted or renumbered doctrine exited 0 -- this job's first step
  # would have been green on precisely the breakage it is named for. Fixed in
  # the same commit. A check that cannot fail is decoration (doctrine 48), and
  # adding one to CI makes it worse than decoration: it makes it a promise.
  record:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth 0 IS LOAD-BEARING, not hygiene. `verify_entries.py`'s
      # doctrine-17 check asks whether a pin that MOVED left its superseded
      # value visible and dated, and it answers that by walking `git log
      # --name-only` + `git cat-file --batch` over the pin's own history. On
      # the default depth-1 checkout there is no history: the walk finds zero
      # moves and prints clean, so the check would pass by knowing nothing.
      # Added 2026-08-13, having been proved against a real `--depth 1` clone.
      # The script refuses loudly rather than passing falsely if this is ever
      # removed (doctrine 20), so the failure mode is a red step naming this
      # line, not a silent green.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No pip install: the harness is pure standard library by design, and
      # `quality/declared_inputs.py` is the record of that boundary. If this
      # step ever needs a requirements file, that is a change worth arguing
      # rather than a line to add here.
      - name: Confirm the harness needs no third-party packages
        working-directory: lyric-harness
        run: python3 -c "import lyric_harness, quality.floor, quality.revise, quality.propose; print('stdlib-only import OK')"

      # AND ONE RESEARCH INSTRUMENT IS NOT THE HARNESS. The step above pins
      # `lyric_harness`, `floor`, `revise` and `propose` as stdlib-only, and
      # that claim is unchanged. `quality/kalevala_rate.py` is a measurement
      # instrument, not the grading path, and its null is vectorised: it does
      # `import numpy as np` at module level and uses it for the whole
      # permutation core. Without it the instrument crashed at import and the
      # gate below read exit 1 as MOVED — a MISSING DEPENDENCY rendered as a
      # committed figure that no longer reproduces, which is the same
      # collapse in the other direction (doctrine 20/79). Installing it lets
      # the pin actually HOLD, which is worth more than classifying the crash.
      # `suites` installs nltk for the same reason and in the same shape.
      - name: Install numpy (kalevala_rate's permutation null is vectorised)
        run: python3 -m pip install --disable-pip-version-check numpy

      # cmudict.dict is 3.6 MB, gitignored, and fetched from a moving master
      # branch with no checksum — which the audit flagged as its own defect
      # (doctrine 34, inside the function whose comment invokes doctrine 34).
      # Caching it keeps CI off that fetch on most runs; it does not fix the
      # provenance gap, and is not pretending to. data/opensubtitles_en_50k.tsv
      # is repo-committed and provenance-gated, so it is never fetched.
      - name: Cache CMUdict
        uses: actions/cache@v4
        with:
          path: lyric-harness/cmudict.dict
          key: cmudict-${{ hashFiles('lyric-harness/lyric_harness.py') }}
          restore-keys: cmudict-

      - name: Stage the lexicon
        working-directory: lyric-harness
        run: python3 -c "from lyric_harness import fetch_data; fetch_data(); print('lexicon staged')"

      # Each check runs even if an earlier one failed: they answer independent
      # questions, and a run that stops at the first red tells you less than
      # one that reports all four. `if: always()` after the first is what makes
      # the job a REPORT rather than a tripwire.
      # RENAMED 2026-08-13: this step now runs three checks more than its old
      # name promised — the pre-split baseline (nothing defined before the
      # 2026-08-11 file split has been lost, re-derived from 9b5f7c9), the
      # doctrine->check registry, and the baseline's own re-derivation. A step
      # name is a promise; the old one had gone short of what the step does,
      # which is the same defect in the same file that the registry exists to
      # catch in the doctrines themselves.
      - name: Doctrine numbering and the doctrine→check registry (1-95, no number in both files, every citation resolves, every doctrine mapped to a check or a declared refusal)
        working-directory: lyric-harness
        run: python3 quality/verify_doctrines.py

      - name: Entry claims (the sentences in MISSING.md and BACKLOG.md, checked; plus repo paths and per-family rhyme-capacity figures quoted in prose)
        if: always()
        working-directory: lyric-harness
        run: python3 quality/verify_entries.py

      - name: Committed counters against their measurement
        if: always()
        working-directory: lyric-harness
        run: python3 quality/counters.py --check

      # THE SWEEP'S ARGV IS PROVEN, NOT ASSUMED (M-21's close, 2026-08-28).
      # pin_sweep discovers instruments by the STRING `--check`; that string
      # never promised the flag means "check your pins", and the entry
      # stayed open on exactly that — a HOLDS could ride a flag that was an
      # argparse error, a value-taking option, or a docstring mention. The
      # classifier settles it on the AST: every unrowed instrument must
      # PROVABLY consume bare `--check` as a boolean flag, and every
      # CHECK_ARGV row's flag tokens verify the same way; anything else is
      # refused BY NAME at exit 3. Seconds, not the hour the sweep takes.
      - name: The pin sweep's argv-consumption proof (every instrument's check flag provably consumable, M-21)
        if: always()
        working-directory: lyric-harness
        run: python3 quality/pin_sweep.py --verify-argv

      # THE PROSE ANSWERS TO THE PIN (M-33, 2026-08-28). One joint AUC pair
      # was written in twelve places in quality/RESULTS.md and a careful
      # repin left seven stale — one labelled "COLD, current". The
      # instrument derives the current spelling from
      # test_discriminate.PINNED (so a measurement repin goes red HERE
      # until the prose moves with it) and polices the immediately-prior
      # reading against the two declared history forms (struck or
      # blockquote); older generations are retired — listed, not policed.
      - name: Tracked figures in prose against the pin (live/history declared, M-33)
        if: always()
        working-directory: lyric-harness
        run: python3 quality/verify_figures.py --check

      # HOW MUCH OF THIS HARNESS CAN REFUSE ANYTHING. Added 2026-08-23 under
      # the owner's standing rule that a note is a RECORD and only a gate is
      # an ENFORCEMENT. `quality/gate_census.py` classifies every finding code
      # by whether ANY of the three declared gate mechanisms — a `flag`
      # severity at the construction site, `loop.MANDATORY_PURSUE`,
      # `floor.LENGTH_GATE_CODES` — can act on it, reading each set from the
      # module that OWNS it rather than respelling it here.
      #
      # THE PIN IS ON THE THREE COUNTS AND NOT THE MEMBERSHIP, so a finding
      # added without a gate MOVES A NUMBER (exit 3) instead of joining a list
      # nobody reads, and a new code is a question rather than a merge
      # conflict. A DISCLOSED-ONLY code is NOT automatically a defect —
      # doctrine 6 is the counterweight and the shape layer's notes are notes
      # on purpose — so this step gates the CENSUS, never the verdict on any
      # individual code. 1.2s over the tree.
      - name: The gate census — which findings can refuse anything (exit 3 on drift)
        if: always()
        working-directory: lyric-harness
        run: python3 quality/gate_census.py --check

      # THE data/ HALF OF DOCTRINE 34's QUESTION, closed 2026-08-21.
      # audit_corpus.py check C re-derives the recorded md5 of every file
      # under corpus/. Nothing did the same for data/ — so when 66eb44e
      # rebuilt song_endword_en.tsv and song_rhymepair_en.tsv over the loaded
      # corpus, both sources.tsv rows described the files they replaced
      # (46,860 rows / 1,627,624 bytes against 131,373 / 4,764,993) for three
      # commits, invisible to every instrument here. Fixed by hand, which is
      # the fix that does not stay fixed.
      - name: Register triage (no OPEN entry is named by a regression without saying why)
        if: always()
        working-directory: lyric-harness
        run: |
          python3 quality/triage.py --check
          python3 quality/test_triage.py

      - name: data/sources.tsv rows against the files they describe
        if: always()
        working-directory: lyric-harness
        run: python3 quality/check_data_rows.py

      # And the same shape one layer in: frequency.py's `n_types` was a
      # hand-kept integer nothing re-measured, so it read 10,401 for days
      # after the rebuild made it 13,990. Sources that CAN declare how their
      # count is derived now do; the nine wordfreq-backed cells cannot (the
      # library is not vendored here) and are reported by name as not asked
      # rather than passed silently.
      - name: n_types, re-derived where the derivation is declared
        if: always()
        working-directory: lyric-harness
        run: python3 quality/frequency.py --check

      - name: The fitted-matrix artifact against a fresh derivation
        if: always()
        working-directory: lyric-harness
        run: python3 quality/eval_matrix.py --check

      # MARK COVERAGE. Added 2026-08-20. `grid.SECTION_FUNCTIONS` declares 21
      # section functions and the corpus witnesses 4; `MARK_FUNCTION` has five
      # keys and everything else a source prints is refused, correctly and with
      # a written reason. What had never been counted is how much that refusal
      # covers: 63.6% of marked blocks, 99.7% of it Persian, and the single most
      # common section mark in the corpus (`[BAYT]`, 70,866) outnumbers
      # `[VERSE]`. The refusal is honest and the silence about its size was not.
      # `--check` re-derives the four counts (kept apart, never summed) against
      # RESULTS_MARK_COVERAGE.md's pins and exits 1 on drift; an off-by-one on
      # any pinned figure fails it, proven by mutation before this step landed.
      # Runs in well under a minute over the whole corpus.
      - name: Mark coverage against RESULTS_MARK_COVERAGE.md's pins
        if: always()
        working-directory: lyric-harness
        run: python3 quality/mark_coverage.py --check

      # ADVERSARY 7 (CLAUDE.md's roster: "the REPORT — do the number, the
      # label and the evidence agree?"). Added 2026-08-13, and it is the
      # adversary that had NOTHING running it: an audit found audit_spans.py
      # had zero automated callers, and that its `main` returned a literal 0
      # whatever the sweep found -- so it exited clean while reporting that
      # 382 of 1014 sonnet report lines name a pair that did not produce
      # their number. Sharpest instrument in the layer, unrun, and unable to
      # fail if it had been run. `--check` runs sweep 1 only (~1 min) and
      # exits 1 when RESULTS_SPANS.md's committed headline stops reproducing;
      # proven red on injected drift before this step was added.
      - name: Span/label agreement against RESULTS_SPANS.md's headline
        if: always()
        working-directory: lyric-harness
        run: python3 quality/audit_spans.py --check

      # THE SLOP FLOOR'S OWN CALIBRATION, on the only path cheap enough to gate
