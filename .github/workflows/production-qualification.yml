name: Production qualification

# Intentional, complete coverage. No paid calls, no schedule and no date rotation.
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: production-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capacity-proof:
    uses: ./.github/workflows/capacity-proof.yml

  capacity-proof-result:
    name: qualification-capacity-proof
    needs: capacity-proof
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require actual full-checkout verification
        env:
          RESULT: ${{ needs.capacity-proof.result }}
        run: test "$RESULT" = success

  # A `mutation-baseline` JOB STOOD HERE FROM 2026-09-10 UNTIL THE SAME DAY, and
  # what removed it is the run it was written for. M-263 shipped it to compute
  # the whole-tree baseline once instead of four times, on the argument that it
  # carries no `needs:` and so finishes inside the window `capacity-proof`
  # already holds every component behind. BOTH HALVES OF THAT WERE WRONG.
  #
  # (1) The artifact could never be accepted. `mutate.SIBLING_RULES` includes
  # `("mcp", "tree")`, so `source_fingerprint()` walks all of `mcp/` -- and
  # `mcp/capacity_verification.json` is gitignored, absent from a checkout, and
  # INJECTED by `capacity-accept`, which every component job runs and the
  # producer did not. MEASURED: `1ec63dc3...` without that file,
  # `b53c13a6...` with it. `mutate.baseline` accepts a cached file only when the
  # fingerprint matches and does not complain when it does not -- it recomputes.
  # So every shard would have recomputed exactly what it was handed.
  #
  # (2) It was not free, and it was not even neutral. In qualification run
  # 34428160709 `capacity-proof` finished at 02:18:01 and this job was STILL
  # RUNNING at 03:04 -- 57 minutes -- with all seven components blocked behind
  # it, against a 90-minute cap whose expiry would have skipped every one of
  # them and produced a run that measured nothing.
  #
  # AND THE WALL-CLOCK CASE WAS NEVER THERE. With C = capacity-proof, B = the
  # baseline, M = the largest shard and S = the longest calibration component:
  #     as it was   wall = C + max(B + M, S)
  #     as shipped  wall = C + B + max(M, S)
  # Sharing moves B from parallel-across-shards to serial-in-front. When S
  # exceeds B + M -- and S is `song` at 1h55m -- it is strictly WORSE. The real
  # saving was only ever COMPUTE, four baselines instead of one, and this file
  # is charged for wall clock. That arithmetic was not done before it shipped.
  #
  # `test_mutation.py --baseline-only` survives, with its config-match check: it
  # is the producer half, and it is correct. What it needs before it can be used
  # is a fingerprint that does not carry a per-run receipt -- see M-263.
  component:
    needs: capacity-proof
    name: qualification-${{ matrix.component }}
    runs-on: ubuntu-latest
    # ~~240~~ 300 minutes: the mutation budget below moved to 14,400 s and a job
    # bound must clear its own command's budget plus setup, or the bound that
    # fires is the wrong one and the evidence says `cancelled` instead of 124.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        component:
          [
            mutation-1,
            mutation-2,
            mutation-3,
            mutation-4,
            mutation-5,
            mutation-6,
            mutation-7,
            mutation-8,
            song,
            short,
            curves,
          ]
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      MUTATE_SCRATCH: /tmp/mutate-scratch
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install the full detector environment
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes -r "$GITHUB_WORKSPACE/mcp/requirements-runtime.txt"
          python3 -m pip install --disable-pip-version-check numpy scikit-learn PyYAML
          npm --prefix mcp ci --no-audit --no-fund
      - name: Stage every declared lexical input
        working-directory: lyric-harness
        run: |
          python3 -c "import lyric_harness; lyric_harness.fetch_data()"
          python3 quality/fetch_data.py --research
      - name: Transfer this attempt's all-family capacity proof
        uses: actions/download-artifact@v4
        with:
          name: capacity-proof-${{ github.run_attempt }}
          path: capacity-proof
      - name: Require the proof to match this consumer's actual runtime and table
        run: python3 scripts/production_qualification.py capacity-accept capacity-proof
      # ONE RESTORE STEP PER PRODUCER, AND THE `path:` LIST IS WHY (M-264).
      # Until 2026-09-10 this was ONE step listing TWO paths and naming the
      # nightly's prefix, and that prefix could not match on any run, ever.
      #
      # actions/cache does not address an entry by its key alone. It computes
      # `version = sha256(paths.join('|') + '|' + compressionMethod + '|' +
      # '1.0')` and sends that ONE version alongside the primary key AND every
      # restore-key — on the v1 REST path (`cache?keys=...&version=...`) and
      # on the v2 twirp path alike — and there is no version-relaxed fallback.
      # The strings it hashes are the RAW `path:` lines: `resolvePaths()`
      # output feeds only `createTar`, never the version. So a two-line list
      # is a DIFFERENT VERSION from a one-line list naming the same directory,
      # and the toolkit's own miss message says so ("There exist one or more
      # cache(s) with similar key but they have different version or scope").
      #
      # AND THIS IS THE SHIPPED BYTES, NOT THE LIBRARY IN GENERAL. The rule
      # above was re-read out of the bundled `dist/restore/index.js` at
      # actions/cache `0057852bfaa89a56745cba8c7296529d2fc39830` -- the SHA the
      # failing job's own log records downloading -- so "main may differ from
      # what shipped" is closed rather than assumed. The compression component
      # is `zstd-without-long`: the dist returns it whenever zstd exists at
      # all, and the job's tar line is `--use-compress-program zstdmt` with no
      # `--long=30`. So the two hashes below are the live ones.
      #
      # MEASURED, NOT DEDUCED. ci.yml:3592-3596 banks the memo under `path:
      # ~/.cache/lyric-harness`. The nightly of run 34413319893 banked 172,949
      # bytes at 01:32:47Z under `lyric-harness-predictability-v1-34413319893`.
      # Three hours later qualification run 34436960370 logged `Cache not
      # found for input keys: ..., lyric-harness-predictability-v1-`, reported
      # `predictability memo: 0 line(s)`, and spent its whole 2,400 s budget
      # on a cold memo for exit 124. Reimplementing getCacheVersion over the
      # two literal lists gives f1a8e46d72... for ci.yml's one-line path and
      # 201f650e7f... for the two-line list that stood here.
      #
      # So each producer gets its own step whose `path:` is byte-identical to
      # that producer's. This is STRING equality of the list, not path
      # equivalence: `$HOME/.cache/lyric-harness`, a trailing slash, or
      # reordering the two lines would each still miss. The saves at the foot
      # of this job are split the same way, because a save's version comes
      # from the same function and a combined save is unreachable from split
      # restores.
      #
      # ORDER MATTERS within each step: the qualification-specific prefix is
      # listed FIRST so a re-run of this exact commit prefers its own banked
      # state; the cross-workflow prefix is the fallback.
      #
      # WHAT THIS DOES NOT DECIDE: whether the restored memo is USABLE. It is
      # fingerprint-guarded — `comparator_fingerprint()` whole-file hashes
      # `lyric_harness.py` and `quality/features.py` — so a memo banked before
      # a commit that touched either is read, discarded by name, and
      # recomputed. Reaching the entry and being able to use it are two
      # different repairs; this is the first. The `curves` budget carries the
      # second.
      #
      # THE SHA IS NOT WHAT DECIDES WHETHER A MEMO IS USABLE; THE FINGERPRINT
      # IS (M-273). `PredictabilityCache.open` keeps a file whose comparator
      # fingerprint matches and discards one whose does not, and the
      # fingerprint hashes `lyric_harness.py` and `quality/features.py` --
      # not the commit. So a memo this component banked at the PREVIOUS SHA
      # is fully usable at this one whenever the commits between touched
      # neither file, which is most commits. Run 34509181078's `song` banked
      # 8,003 fresh entries under the current fingerprint at 20:16Z, and the
      # two prefixes above could not reach them from any later SHA: the first
      # names this SHA, the second names the nightly, whose memo was banked
      # under the fingerprint M-270 moved. The component prefix without a SHA
      # is the third address, tried after this SHA's own and before the
      # nightly's, and `actions/cache` returns the NEWEST entry under it.
      # Reaching a memo the guard then discards costs one download and
      # nothing else; not reaching one that the guard would keep cost `song`
      # a full cold corpus on a slow runner.
      - name: Restore the predictability memo (ci.yml's path list, exactly)
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/lyric-harness
          key: qualification-${{ matrix.component }}-memo-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            qualification-${{ matrix.component }}-memo-${{ github.sha }}-
            qualification-${{ matrix.component }}-memo-
            lyric-harness-predictability-v1-
      # NO `lyric-harness-mutation-baseline-v1-` PREFIX HERE, AND THAT IS THE
      # STRIKE STANDING, NOT AN OVERSIGHT. M-263 established that a baseline
      # banked by another workflow can be RESTORED and still never ACCEPTED:
      # `mutate.baseline()` takes a cached file only when its fingerprint and
      # its `{jobs, confirm_all, timeout}` config both match, and
      # `mutate.source_fingerprint()` hashes the whole harness tree. Naming
      # the prefix here would put a file on disk that `mutate.baseline()`
      # reads, rejects and recomputes — the same nothing, one layer deeper.
      # The qualification-specific prefix below is the one that works: it hits
      # a re-run of this exact commit, where the fingerprint does match.
      - name: Restore this commit's own mutation baseline, if it has one
        uses: actions/cache/restore@v4
        with:
          path: /tmp/mutate-scratch/baseline.json
          key: qualification-${{ matrix.component }}-baseline-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: qualification-${{ matrix.component }}-baseline-${{ github.sha }}-
      # A 124 on `curves` and a 124 on a cold memo look identical in the
      # evidence record, and they are not the same finding. This says which,
      # BEFORE the budget starts, in one line that costs nothing.
      - name: Report the predictability memo this component starts from
        run: |
          # NO ARITHMETIC ON grep's OUTPUT. ci.yml's nightly step carries the
          # paragraph: `grep -c` exits 1 on a zero count and 2 on an absent
          # file, so `$(grep -c ... || echo N)` yields the TWO-LINE string
          # "0\nN" in the first case and breaks whatever consumes it. `|| true`
          # plus a default expansion is one value in all three cases -- a
          # count, or nothing, or nothing.
          # `mkdir -p` so the save at the foot of this job cannot fail on
          # absence. actions/cache/save raises a Path Validation Error when NO
          # listed path exists, and splitting one two-path save into two
          # one-path saves turns "one of the two was there" into "this one
          # must be". An EMPTY directory banks and restores harmlessly; the
          # count below still reads 0, which is the honest answer.
          mkdir -p ~/.cache/lyric-harness
          MEMO=~/.cache/lyric-harness/song_predictability_v1.tsv
          LINES=$(grep -c '' "$MEMO" 2>/dev/null || true)
          echo "predictability memo: ${LINES:-0} line(s) at $MEMO"
          echo "  cold is 0; a memo covering the whole corpus is ~8,546 (8,545 items and a header)"
      - name: Complete the exact comparison within its existing command budget
        run: python3 scripts/production_qualification.py run '${{ matrix.component }}' --out=evidence/${{ matrix.component }}.json
      # THE SAME COUNT AGAIN, AFTER. Two readings of one file bracket the
      # component and turn its memo rate into a measurement; one reading only
      # says where it started. Qualification run 34436960370 is why: `curves`
      # started at 0 lines, spent 2,400 s, and the only surviving evidence of
      # how far it got was the 8,865 compressed bytes its cache save reported
      # against the nightly's 172,949 for 8,663 entries -- a RATIO OF TWO
      # COMPRESSED SIZES, which is not a count of anything (doctrine 58). The
      # log that held the real figure was inside an artifact, and the artifact
      # store is not reachable from where the diagnosis happened.
      #
      # `if: always()` because the reading that matters most is the one after a
      # 124: a component killed at its bound is exactly the case where "how
      # many did it get through" decides whether the bound is too small or the
      # work is too slow, and those are different repairs.
      # THE PHASE COSTS THIS COMPONENT ACTUALLY PAID, LIFTED OUT OF A LOG
      # NOBODY CAN REACH. `run_component` redirects the child's stdout to
      # `evidence/<component>.json.log` and uploads it as an ARTIFACT, so the
      # one number that sizes a mutation shard -- the unmutated baseline's
      # share -- is invisible to anyone reading the job. M-266 had to measure
      # it on a developer box instead and then argue the transfer.
      # `test_mutation.py` already prints it ("a completed baseline hands the
      # next person the baseline's share of the shard budget, which is what
      # sizing N actually turns on"); this only puts it where it can be read.
      # Bounded on purpose: matched lines only, never the whole log.
      - name: What each phase of this component cost
        if: always()
        run: |
          LOG=evidence/${{ matrix.component }}.json.log
          if [ -f "$LOG" ]; then
            grep -E 'phase 1 of 2|phase 2 of 2|baseline: (cached|running|[0-9])|CACHE |PHASE COST|TOTAL' "$LOG" | tail -40 || true
          else
            echo "no component log at $LOG"
          fi
      - name: Report the predictability memo this component ends with
        if: always()
        run: |
          MEMO=~/.cache/lyric-harness/song_predictability_v1.tsv
          LINES=$(grep -c '' "$MEMO" 2>/dev/null || true)
          echo "predictability memo: ${LINES:-0} line(s) at $MEMO"
          echo "  a memo covering the whole corpus is ~8,546 (8,545 items and a header)"
          echo "  the flush interval is 200 puts, so this trails the true count by <200"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-${{ matrix.component }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
      # SPLIT TO MATCH THE SPLIT RESTORES ABOVE. A save's version is computed
      # by the same `getCacheVersion(paths, ...)`, so a combined two-path save
      # writes an entry that neither one-path restore can address. Both are
      # `if: always()` for the reason ci.yml's own pair carries: a component
      # that overran its budget still advances the resume point it reached.
      - name: Bank the predictability memo — whatever this component's verdict was
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/lyric-harness
          key: qualification-${{ matrix.component }}-memo-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      # GUARDED ON EXISTENCE, unlike the memo above: nothing creates
      # /tmp/mutate-scratch/baseline.json for `song`, `short` or `curves`, and
      # an unguarded save would fail those three jobs on a Path Validation
      # Error at the very end of a run that had already done its work. `-s`
      # rather than `-e`: a zero-byte file would bank, restore, and then hand
      # `mutate.baseline()` a JSON parse error instead of a cold start.
      - name: Is there a mutation baseline to bank?
        id: baseline
        if: always()
        run: |
          if [ -s /tmp/mutate-scratch/baseline.json ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Bank this commit's mutation baseline — whatever the verdict was
        uses: actions/cache/save@v4
        if: always() && steps.baseline.outputs.have == 'yes'
        with:
          path: /tmp/mutate-scratch/baseline.json
          key: qualification-${{ matrix.component }}-baseline-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  qualification-result:
    needs: [capacity-proof-result, component]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require every component job to succeed
        env:
          RESULT: ${{ needs.component.result }}
          CAPACITY_RESULT: ${{ needs.capacity-proof-result.result }}
        run: test "$RESULT" = success && test "$CAPACITY_RESULT" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: qualification-*-${{ github.run_attempt }}
          path: evidence
      - name: Require exact complete source and attempt coverage
        run: python3 scripts/production_qualification.py aggregate evidence --out=qualification.json
      - uses: actions/upload-artifact@v4
        with:
          name: production-qualification-${{ github.run_attempt }}
          path: qualification.json
          if-no-files-found: error
