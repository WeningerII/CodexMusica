name: Production qualification

# Intentional, complete coverage. No paid calls, no schedule and no date rotation.
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: production-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capacity-proof:
    uses: ./.github/workflows/capacity-proof.yml

  capacity-proof-result:
    name: qualification-capacity-proof
    needs: capacity-proof
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require actual full-checkout verification
        env:
          RESULT: ${{ needs.capacity-proof.result }}
        run: test "$RESULT" = success

  # THE WHOLE-TREE BASELINE, COMPUTED ONCE INSTEAD OF FOUR TIMES.
  #
  # `test_mutation.py`'s `run_suite` baselines `mutate.discover_tests()` -- all
  # 98 files -- whatever slice the shard was asked for, and its own comment
  # says what that costs: "the unmutated baseline runs first and is the
  # expensive phase", and a completed one "hands the next person the baseline's
  # share of the shard budget, which is what sizing N actually turns on". Four
  # shards paid the identical baseline four times, and no shard count could get
  # the wall below one of them.
  #
  # MEASURED, production-qualification run 34404281269 (main a1666165, the
  # first ever): mutation-1 FAILED at 2h44m, mutation-2 at 2h06m, mutation-3 at
  # 2h21m -- and mutation-4 was killed at 12,001 s against its 12,000 s budget,
  # exit 124, the only one of the four that was a timeout. Locally the baseline
  # alone was still running past 12 minutes at two workers.
  #
  # NO `needs:`, DELIBERATELY. This starts with the run and finishes inside the
  # window `capacity-proof` already holds every component behind, so most of
  # its cost is not added to the run at all -- it is spent in a gap that
  # existed anyway. What it removes is real: one whole-tree baseline from each
  # of four shards.
  #
  # THE ONE WAY THIS SILENTLY DOES NOTHING is a config or fingerprint mismatch:
  # `mutate.baseline` accepts a cached file only when both match, and when they
  # do not it does not complain, it recomputes. That is why the producer runs
  # THIS FILE with `--baseline-only` rather than a python -c with the numbers
  # retyped, and why the install and staging steps below are the component
  # job's own, verbatim -- `source_fingerprint()` hashes the harness tree, the
  # staged data, PYTHONHASHSEED, and the nltk/numpy/scikit-learn versions.
  # `quality/test_mutation.py`'s own check pins that the producer's config is
  # the config the sweep looks up. The shard's log says `baseline: cached` or
  # `baseline: running 98 checks`, so a miss is visible rather than merely slow.
  mutation-baseline:
    name: qualification-mutation-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      MUTATE_SCRATCH: /tmp/mutate-scratch
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install the full detector environment
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes -r "$GITHUB_WORKSPACE/mcp/requirements-runtime.txt"
          python3 -m pip install --disable-pip-version-check numpy scikit-learn PyYAML
          npm --prefix mcp ci --no-audit --no-fund
      - name: Stage every declared lexical input
        working-directory: lyric-harness
        run: |
          python3 -c "import lyric_harness; lyric_harness.fetch_data()"
          python3 quality/fetch_data.py --research
      - name: Compute the unmutated baseline once, for all four shards
        working-directory: lyric-harness
        run: python3 quality/test_mutation.py --baseline-only
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-baseline-${{ github.run_attempt }}
          path: /tmp/mutate-scratch/baseline.json
          if-no-files-found: error

  component:
    needs: [capacity-proof, mutation-baseline]
    name: qualification-${{ matrix.component }}
    runs-on: ubuntu-latest
    # ~~240~~ 300 minutes: the mutation budget below moved to 14,400 s and a job
    # bound must clear its own command's budget plus setup, or the bound that
    # fires is the wrong one and the evidence says `cancelled` instead of 124.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        component: [mutation-1, mutation-2, mutation-3, mutation-4, song, short, curves]
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      MUTATE_SCRATCH: /tmp/mutate-scratch
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install the full detector environment
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes -r "$GITHUB_WORKSPACE/mcp/requirements-runtime.txt"
          python3 -m pip install --disable-pip-version-check numpy scikit-learn PyYAML
          npm --prefix mcp ci --no-audit --no-fund
      - name: Stage every declared lexical input
        working-directory: lyric-harness
        run: |
          python3 -c "import lyric_harness; lyric_harness.fetch_data()"
          python3 quality/fetch_data.py --research
      - name: Transfer this attempt's all-family capacity proof
        uses: actions/download-artifact@v4
        with:
          name: capacity-proof-${{ github.run_attempt }}
          path: capacity-proof
      - name: Require the proof to match this consumer's actual runtime and table
        run: python3 scripts/production_qualification.py capacity-accept capacity-proof
      # THE BUDGETS BELOW ARE WARM-MEMO BUDGETS, AND THIS IS WHERE THE MEMO
      # COMES FROM. `curves` runs `length_curve_calibration.py check` with no
      # `--rows`, so it re-derives every one of 8,667 corpus items rather than
      # trusting a saved TSV — the stronger claim, and the reason the
      # predictability memo at ~/.cache/lyric-harness is not an optimisation
      # here but the difference between a job that finishes and one that does
      # not. ci.yml's own repinned figure for a COLD memo is 8,758 CPU-s
      # (2026-08-30, run 33305249323); the `curves` budget is 2,400.
      #
      # The nightly song-profile job banks that memo under
      # `lyric-harness-predictability-v1-<run_id>` with `if: always()`, and
      # Actions caches are shared across workflows in a repository. Until
      # 2026-09-09 this restore could not name that prefix, so the FIRST
      # attempt at any new SHA was cold by construction — the
      # `qualification-<component>-<sha>-` prefix can only hit a re-run of a
      # commit that already ran. Production qualification run 1 never got far
      # enough to show it (`curves` refused in 1.8s on M-259's tagger lookup),
      # and the second attempt would have spent the budget instead.
      #
      # ORDER MATTERS: the qualification-specific prefix is listed FIRST so a
      # re-run of this exact commit still prefers its own banked state, which
      # also carries /tmp/mutate-scratch/baseline.json; the nightly prefix is
      # the fallback and carries only the memo.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/lyric-harness
            /tmp/mutate-scratch/baseline.json
          key: qualification-${{ matrix.component }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            qualification-${{ matrix.component }}-${{ github.sha }}-
            lyric-harness-predictability-v1-
      # A 124 on `curves` and a 124 on a cold memo look identical in the
      # evidence record, and they are not the same finding. This says which,
      # BEFORE the budget starts, in one line that costs nothing.
      - name: Report the predictability memo this component starts from
        run: |
          # NO ARITHMETIC ON grep's OUTPUT. ci.yml's nightly step carries the
          # paragraph: `grep -c` exits 1 on a zero count and 2 on an absent
          # file, so `$(grep -c ... || echo N)` yields the TWO-LINE string
          # "0\nN" in the first case and breaks whatever consumes it. `|| true`
          # plus a default expansion is one value in all three cases -- a
          # count, or nothing, or nothing.
          MEMO=~/.cache/lyric-harness/song_predictability_v1.tsv
          LINES=$(grep -c '' "$MEMO" 2>/dev/null || true)
          echo "predictability memo: ${LINES:-0} line(s) at $MEMO"
          echo "  cold is 0; a memo covering the whole corpus is ~8,668 (8,667 items and a header)"
      # AFTER the cache restore above, so the shared baseline wins over
      # whatever a same-SHA re-run happened to bank. Mutation shards only: the
      # calibration components do not read it and downloading it for them would
      # be a step that cannot fail usefully.
      - name: Take the shared unmutated baseline
        if: startsWith(matrix.component, 'mutation')
        uses: actions/download-artifact@v4
        with:
          name: mutation-baseline-${{ github.run_attempt }}
          path: /tmp/mutate-scratch
      - name: Complete the exact comparison within its existing command budget
        run: python3 scripts/production_qualification.py run '${{ matrix.component }}' --out=evidence/${{ matrix.component }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-${{ matrix.component }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cache/lyric-harness
            /tmp/mutate-scratch/baseline.json
          key: qualification-${{ matrix.component }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  qualification-result:
    needs: [capacity-proof-result, component]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require every component job to succeed
        env:
          RESULT: ${{ needs.component.result }}
          CAPACITY_RESULT: ${{ needs.capacity-proof-result.result }}
        run: test "$RESULT" = success && test "$CAPACITY_RESULT" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: qualification-*-${{ github.run_attempt }}
          path: evidence
      - name: Require exact complete source and attempt coverage
        run: python3 scripts/production_qualification.py aggregate evidence --out=qualification.json
      - uses: actions/upload-artifact@v4
        with:
          name: production-qualification-${{ github.run_attempt }}
          path: qualification.json
          if-no-files-found: error
