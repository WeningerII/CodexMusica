<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Traditions Atlas — Codex Musica</title>
    <meta
      name="description"
      content="An atlas of 2503 music traditions, coloured by the catalog's own taxonomy rather than by geography. Every pin opens its recording recipe in Codex Musica."
    />
    <link rel="canonical" href="./atlas.html" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Traditions Atlas — Codex Musica" />
    <meta property="og:description" content="2503 music traditions, mapped by sound rather than by border." />
    <meta property="og:url" content="https://codexmusica.com/atlas.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,30..100;1,9..144,400..700,30..100&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      /* Tokens mirror src/index.template.html so the atlas and the app read as
         one product. The two greys have no token in the template (the app uses
         literals); they are named here rather than repeated forty times. */
      :root {
        --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
        --font-body: 'IBM Plex Sans', 'Inter', system-ui, -apple-system, sans-serif;
        --font-mono: 'IBM Plex Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        --bg: #ffffff;
        --surface: #ffffff;
        --surface-sunken: #f8f9fa;
        --border: #e8eaed;
        --border-strong: #dadce0;
        --text: #202124;
        --muted: #5f6368;
        --muted-2: #70767b;
        --color-blue: #1a73e8;
        --color-blue-hover: #1765cc;
        --color-blue-soft: #e8f0fe;
        --accent: #c8504a;
        --shadow-modal: 0 16px 40px rgba(32, 33, 36, 0.12), 0 4px 12px rgba(32, 33, 36, 0.06);
        --shadow-pop: 0 8px 24px rgba(32, 33, 36, 0.18);
        --t-fast: 100ms;
        --ease: cubic-bezier(0.2, 0, 0, 1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: var(--font-body);
        font-size: 14px;
        line-height: 1.5;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      input {
        font: inherit;
        color: inherit;
      }
      a {
        color: var(--color-blue);
        text-decoration: none;
      }
      a:hover {
        color: var(--color-blue-hover);
      }
      :focus-visible {
        outline: 2px solid var(--color-blue);
        outline-offset: 2px;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border-radius: 3px;
      }
      @keyframes atlas-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .shell {
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg);
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(8px);
        z-index: 40;
        flex-shrink: 0;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .brand-name {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 18px;
        letter-spacing: -0.01em;
        font-variation-settings: 'SOFT' 50, 'opsz' 30;
        white-space: nowrap;
      }
      .brand-rule {
        display: inline-block;
        width: 1px;
        height: 16px;
        background: var(--muted-2);
        opacity: 0.5;
      }
      .brand-sub {
        font-family: var(--font-display);
        font-style: italic;
        font-size: 13px;
        color: var(--muted-2);
        white-space: nowrap;
      }
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .searchwrap {
        position: relative;
      }
      .searchwrap > svg {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
      }
      #search {
        width: 260px;
        padding: 8px 10px 8px 32px;
        font-size: 14px;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        background: var(--surface);
        outline: none;
      }
      #search:focus {
        border-color: var(--color-blue);
        box-shadow: 0 0 0 2px var(--color-blue-soft);
      }
      .pill {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--muted-2);
        background: var(--surface-sunken);
        border-radius: 999px;
        padding: 3px 10px;
        white-space: nowrap;
      }
      .btn-ghost {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        white-space: nowrap;
        background: var(--surface);
      }
      .btn-ghost:hover {
        background: var(--surface-sunken);
        color: var(--text);
      }

      .body {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      #list {
        width: 300px;
        flex-shrink: 0;
        border-right: 1px solid var(--border);
        overflow-y: auto;
        padding: 12px 8px 24px;
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--muted-2);
        padding: 4px 10px 8px;
      }
      .rowbtn {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 40px;
        padding: 5px 10px;
        border: none;
        background: transparent;
        border-radius: 6px;
        text-align: left;
      }
      .rowbtn:hover {
        background: var(--surface-sunken);
      }
      .rowbtn[aria-current='true'] {
        background: var(--color-blue-soft);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .rowtext {
        min-width: 0;
        flex: 1;
      }
      .rowname {
        display: block;
        font-size: 13px;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .rowplace {
        display: block;
        font-size: 11px;
        color: var(--muted-2);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      main {
        flex: 1;
        position: relative;
        min-width: 0;
        background: var(--bg);
      }
      #canvas-host {
        position: absolute;
        inset: 0;
        cursor: grab;
        touch-action: none;
      }
      .zoomstack {
        position: absolute;
        top: 12px;
        left: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        z-index: 30;
      }
      .zoombtn {
        width: 34px;
        height: 34px;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        background: var(--surface);
        font-size: 18px;
        line-height: 1;
        color: var(--muted);
        box-shadow: 0 1px 2px rgba(32, 33, 36, 0.08);
      }
      .zoombtn:hover {
        background: var(--surface-sunken);
      }
      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 11px;
        font-size: 12px;
        font-weight: 500;
        border: 1px solid var(--border-strong);
        border-radius: 999px;
        background: var(--surface);
        color: var(--text);
        white-space: nowrap;
        box-shadow: 0 1px 2px rgba(32, 33, 36, 0.08);
      }
      .toggle[aria-pressed='true'] {
        background: var(--text);
        color: #fff;
        border-color: var(--text);
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: 10px;
        box-shadow: var(--shadow-pop);
        padding: 6px;
      }
      .card {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 330px;
        max-height: calc(100% - 24px);
        overflow-y: auto;
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: 12px;
        box-shadow: var(--shadow-pop);
        z-index: 45;
        padding: 16px;
      }
      .card h2 {
        font-family: var(--font-display);
        font-size: 20px;
        font-weight: 600;
        line-height: 1.2;
        font-variation-settings: 'SOFT' 50, 'opsz' 30;
      }
      .closebtn {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 28px;
        height: 28px;
        border: none;
        background: transparent;
        border-radius: 6px;
        color: var(--muted-2);
        font-size: 16px;
        line-height: 1;
      }
      .closebtn:hover {
        background: var(--surface-sunken);
      }
      .label {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted-2);
      }
      .recipe {
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.6;
        color: var(--text);
        background: var(--surface-sunken);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px;
        max-height: 150px;
        overflow-y: auto;
        word-break: break-word;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        font-size: 12px;
        border: 1px solid var(--border-strong);
        border-radius: 999px;
        background: var(--surface);
        color: var(--text);
      }
      .chip:hover {
        border-color: var(--muted-2);
      }
      .btn-primary {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 9px 12px;
        font-size: 13px;
        font-weight: 500;
        color: #fff;
        background: var(--color-blue);
        border: none;
        border-radius: 6px;
      }
      .btn-primary:hover {
        background: var(--color-blue-hover);
        color: #fff;
      }
      .btn-secondary {
        flex: 1;
        padding: 9px 12px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: 6px;
      }
      .btn-secondary:hover {
        background: var(--surface-sunken);
      }

      /* The cluster popover — the answer to a bubble that cannot be zoomed
         apart. Real DOM, so it is focusable and screen-reader reachable, which
         is also the map's only keyboard path into a stacked pin. */
      #stack {
        position: absolute;
        z-index: 50;
        width: 320px;
        max-height: min(440px, calc(100% - 24px));
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: 12px;
        box-shadow: var(--shadow-modal);
        overflow: hidden;
      }
      #stack header {
        padding: 12px 14px 8px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      #stack .stack-count {
        font-family: var(--font-display);
        font-size: 16px;
        font-weight: 600;
        font-variation-settings: 'SOFT' 50, 'opsz' 30;
      }
      #stack .stack-place {
        font-size: 12px;
        color: var(--muted-2);
      }
      #stack-filter {
        width: 100%;
        margin-top: 8px;
        padding: 6px 9px;
        font-size: 13px;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        background: var(--surface);
        outline: none;
      }
      #stack-filter:focus {
        border-color: var(--color-blue);
        box-shadow: 0 0 0 2px var(--color-blue-soft);
      }
      #stack-list {
        overflow-y: auto;
        padding: 4px;
        flex: 1;
      }
      #stack-list .group-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 8px 3px;
      }
      #stack-list .group-name {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      #stack-list .group-n {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--muted-2);
      }
      #stack footer {
        border-top: 1px solid var(--border);
        padding: 8px;
        flex-shrink: 0;
      }
      #stack .empty {
        padding: 14px 10px;
        font-size: 13px;
        font-style: italic;
        color: var(--muted-2);
      }

      .tip {
        position: absolute;
        transform: translate(-50%, -130%);
        z-index: 35;
        pointer-events: none;
        background: var(--text);
        color: #fff;
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 4px;
        white-space: nowrap;
      }
      .provenance {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 25;
        max-width: 44%;
        text-align: right;
        font-size: 11px;
        color: var(--muted-2);
        background: rgba(255, 255, 255, 0.85);
        padding: 3px 8px;
        border-radius: 4px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      [hidden] {
        display: none !important;
      }

      @media (max-width: 860px) {
        #list {
          display: none;
        }
        .card {
          left: 8px;
          right: 8px;
          top: auto;
          bottom: 8px;
          width: auto;
          max-height: 52vh;
        }
        #search {
          width: 150px;
        }
        #stack {
          left: 8px !important;
          right: 8px;
          top: auto !important;
          bottom: 8px;
          width: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#1a73e8"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span class="brand-name">Codex Musica</span>
          <span class="brand-rule"></span>
          <span class="brand-sub">atlas of traditions</span>
        </div>
        <div class="topbar-actions">
          <div class="searchwrap">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#70767b"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <label class="sr-only" for="search">Search traditions</label>
            <input id="search" type="text" autocomplete="off" placeholder="Search traditions" />
            <div id="results" class="panel" hidden></div>
          </div>
          <span id="count" class="pill">…</span>
          <a class="btn-ghost" href="./codex.html">Open Codex <span style="color: var(--muted-2)">&#8599;</span></a>
        </div>
      </header>

      <div class="body">
        <aside id="list" aria-label="Traditions in view"></aside>
        <main>
          <div id="canvas-host"></div>
          <div id="loading" class="sr-only" role="status" aria-live="polite">Loading the catalog…</div>

          <div class="zoomstack">
            <button class="zoombtn" id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
            <button class="zoombtn" id="zoom-out" title="Zoom out" aria-label="Zoom out">&#8722;</button>
            <button class="zoombtn" id="zoom-reset" title="Reset view" aria-label="Reset view" style="font-size: 13px">
              &#8634;
            </button>
          </div>

          <div
            id="legendwrap"
            style="
              position: absolute;
              left: 12px;
              bottom: 12px;
              z-index: 30;
              display: flex;
              flex-direction: column-reverse;
              gap: 6px;
              align-items: flex-start;
              max-width: calc(100% - 24px);
            "
          >
            <div style="display: flex; gap: 4px; align-items: center; flex-wrap: wrap">
              <button class="toggle" id="t-territories" aria-pressed="false" aria-expanded="false">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                  <line x1="4" y1="6" x2="20" y2="6"></line>
                  <line x1="7" y1="12" x2="17" y2="12"></line>
                  <line x1="10" y1="18" x2="14" y2="18"></line>
                </svg>
                <span>Territories</span><span id="t-territories-badge"></span>
              </button>
              <button class="toggle" id="t-routes" aria-pressed="false">Routes</button>
              <button class="toggle" id="t-threads" aria-pressed="false" aria-expanded="false">Threads</button>
              <button class="toggle" id="t-density" aria-pressed="false">Density</button>
            </div>
            <div id="threads-panel" class="panel" style="width: 300px" hidden></div>
            <div id="legend-panel" class="panel" style="width: 280px; max-height: 38vh; overflow-y: auto" hidden></div>
          </div>

          <div class="provenance" id="provenance"></div>
          <div id="tip" class="tip" hidden></div>
          <div id="card" class="card" role="dialog" aria-label="Tradition detail" hidden></div>
          <div id="thread-card" class="card" style="z-index: 44" role="dialog" aria-label="Guided thread" hidden></div>
          <div id="stack" role="dialog" aria-modal="false" aria-labelledby="stack-title" hidden></div>
        </main>
      </div>
    </div>

    <noscript>
      <p style="padding: 24px">
        The atlas needs JavaScript to draw the map. The same catalog is available without it:
        <a href="./api/all.json">api/all.json</a> has every recipe in one fetch.
      </p>
    </noscript>

    <script src="src/atlas.js"></script>
  </body>
</html>
