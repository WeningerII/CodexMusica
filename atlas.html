<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Traditions Atlas — Codex Musica</title>
    <meta
      name="description"
      content="An atlas of 2588 music traditions, coloured by the catalog's own taxonomy rather than by geography. Every pin opens its recording recipe in Codex Musica."
    />
    <link rel="canonical" href="./atlas.html" />
    <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="assets/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
        <!-- The shared theme preference, applied before the first paint. -->
    <script src="src/theme.js"></script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Traditions Atlas — Codex Musica" />
    <meta property="og:description" content="2588 music traditions, mapped by sound rather than by border." />
    <meta property="og:url" content="https://codexmusica.com/atlas.html" />
    <style>
      /* Base only. Every colour, size and component style is in src/map.css,
         on the shared --cm-* tokens from src/theme.css (Light or Dark). */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      [hidden] {
        display: none !important;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <link rel="stylesheet" href="src/theme.css" />
    <link rel="stylesheet" href="src/map.css" />
    <link rel="stylesheet" href="src/layout.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="./codex.html">
          <img class="brand-mark" src="assets/icon-192.png" alt="" width="22" height="22" />
          <span class="brand-name">Codex Musica</span>
          <span class="brand-sub">Map</span>
        </a>
        <div class="searchwrap cm-search">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="20" y1="20" x2="16.2" y2="16.2"></line>
          </svg>
          <label class="sr-only" for="search">Search traditions</label>
          <input
            id="search"
            type="text"
            autocomplete="off"
            placeholder="Search traditions, places, or sound words…"
            aria-controls="results"
          />
          <div id="results" class="panel" hidden></div>
        </div>
        <div class="filterbar">
          <span id="no-filters" class="no-filters">No filters</span>
          <div id="active-filters" hidden>
            <span id="filter-summary" role="status"></span>
            <button id="clear-filters" type="button">Clear filters</button>
          </div>
        </div>
        <span id="count" class="pill" role="status">…</span>
        <button id="t-info" class="tool-btn" type="button" aria-expanded="false" aria-controls="provenance">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <line x1="12" y1="11" x2="12" y2="16.5"></line>
            <line x1="12" y1="7.5" x2="12" y2="7.6"></line>
          </svg>
          <span class="tool-label">Map information</span>
        </button>
        <a class="tool-btn open-codex" href="./codex.html">Open Codex Musica <span aria-hidden="true">&#8599;</span></a>
      </header>

      <div class="body">
        <aside id="side" aria-label="Map panels">
          <div class="side-head">
            <div class="side-tabs">
              <button class="cm-tab side-tab" id="t-territories" type="button" aria-expanded="false" aria-controls="legend-panel">
                <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 12l9-9h8v8l-9 9z"></path>
                  <circle cx="15.5" cy="8.5" r="1.5"></circle>
                </svg>
                <span>Genres</span><span id="t-territories-badge" class="tab-badge"></span>
              </button>
              <button class="cm-tab side-tab" id="t-routes" type="button" aria-expanded="false" aria-controls="routes-panel">
                <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="6" cy="18" r="2.5"></circle>
                  <circle cx="18" cy="6" r="2.5"></circle>
                  <path d="M8 16.5C13 14 11 8 15.8 7"></path>
                </svg>
                <span>Routes</span>
              </button>
              <button class="cm-tab side-tab" id="t-threads" type="button" aria-expanded="false" aria-controls="threads-panel">
                <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 3l9 5-9 5-9-5z"></path>
                  <path d="M3 13l9 5 9-5"></path>
                </svg>
                <span>Collections</span>
              </button>
              <button class="cm-tab side-tab side-inview" id="t-inview" type="button" aria-expanded="false" aria-controls="side-lower">
                <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
                  <line x1="8" y1="6" x2="20" y2="6"></line>
                  <line x1="8" y1="12" x2="20" y2="12"></line>
                  <line x1="8" y1="18" x2="20" y2="18"></line>
                  <circle cx="4" cy="6" r="1"></circle>
                  <circle cx="4" cy="12" r="1"></circle>
                  <circle cx="4" cy="18" r="1"></circle>
                </svg>
                <span>In view</span>
              </button>
            </div>
            <button id="t-collapse" class="icon-btn" type="button" aria-expanded="true" aria-controls="side-body" aria-label="Collapse map panels">
              <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
            </button>
          </div>
          <div id="side-body">
            <div id="legend-panel" class="side-panel" hidden></div>
            <div id="routes-panel" class="side-panel" hidden></div>
            <div id="threads-panel" class="side-panel" hidden></div>
            <div id="thread-card" class="side-card" role="region" aria-label="Genre collection" hidden></div>
            <div id="side-lower" class="side-lower">
              <div id="list" aria-label="Traditions in view"></div>
              <div id="stack" role="region" aria-labelledby="stack-title" hidden></div>
            </div>
          </div>
        </aside>

        <main id="map-main">
          <div
            id="canvas-host"
            tabindex="0"
            role="application"
            aria-roledescription="map"
            aria-label="World map of traditions. Arrow keys pan, plus and minus zoom, 0 resets the view."
          ></div>
          <div id="loading" class="map-loading" role="status" aria-live="polite">Loading the catalog…</div>
          <div id="route-chip" class="route-chip" hidden></div>
          <div id="legend-key" class="map-key" aria-label="Map key"></div>
          <div class="zoomstack">
            <div class="zoom-pair">
              <button class="zoombtn" id="zoom-in" type="button" title="Zoom in" aria-label="Zoom in">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              </button>
              <button class="zoombtn" id="zoom-out" type="button" title="Zoom out" aria-label="Zoom out">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              </button>
            </div>
            <button class="map-btn" id="zoom-reset" type="button" title="Show the whole world again">Reset view</button>
            <button class="map-btn" id="zoom-fit" type="button" hidden>Fit</button>
          </div>
          <div id="provenance" class="info-pop" role="dialog" aria-labelledby="info-title" hidden></div>
          <div id="tip" class="tip" hidden></div>
          <div id="map-live" class="sr-only" role="status" aria-live="polite"></div>
        </main>

        <aside id="card" class="inspector" role="region" aria-label="Tradition detail" hidden></aside>
      </div>
    </div>

    <noscript>
      <p style="padding: 24px">
        The atlas needs JavaScript to draw the map. The same catalog is available without it:
        <a href="./api/all.json">api/all.json</a> has every recipe in one fetch.
      </p>
    </noscript>

    <script src="src/layout.js"></script>
    <script src="src/atlas-tiles.js"></script>
    <script src="src/atlas.js"></script>
    <script src="src/map-ui.js"></script>
  </body>
</html>
