# Render Blueprint — deploys the CodexMusica MCP server as a Docker web service.
#
# Deploy: Render dashboard → New + → Blueprint → connect this repo → Apply.
# Endpoint after deploy: https://<service-name>.onrender.com/mcp
services:
  - type: web
    name: codex-musica-mcp
    runtime: docker
    dockerfilePath: ./mcp/Dockerfile
    dockerContext: .
    # Render deploys the service from this branch. Note: the Blueprint itself is
    # ALSO bound to a source branch in Render's UI — repoint that to main too
    # (Blueprint → settings) before deleting any feature branch.
    branch: main
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    # /mcp needs none of these — it is pure deterministic compute over the
    # bundled catalog. They exist for /chat, which is the one surface that
    # spends money. `sync: false` means Render PROMPTS for the value instead of
    # storing it here: a key committed to a public repo is a key that has been
    # published, and this repo is public.
    #
    # With GEMINI_API_KEY unset the chat endpoint answers 503 with a legible
    # reason and the page keeps its dock hidden. The connector is unaffected.
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      # Signs the conversation envelope. Unset is SAFE but not free: chat.js
      # generates one per boot, so every redeploy silently ends conversations
      # in flight (the next message starts a new recipe). Set it to survive
      # deploys. Any long random string.
      - key: CHAT_SECRET
        sync: false
      # Spend ceiling per UTC day, in USD, before /chat refuses. See
      # CHAT_LIMITS in mcp/chat.js for the rate limits this sits on top of.
      - key: CHAT_DAILY_USD
        value: '2'
      # The SECOND daily ceiling, counted in turns rather than dollars, and
      # deliberately independent of the pricing table: it still fires if the
      # cost arithmetic is ever wrong in the cheap direction. In normal
      # operation CHAT_DAILY_USD is what the service hits first.
      - key: CHAT_MAX_TURNS_PER_DAY
        value: '400'
      # What ONE turn may spend before it stops between hops. maxSteps bounds
      # the hop count, but every hop re-sends the whole transcript, so cost
      # grows faster than the step counter does. Measured worst prompt: $0.033.
      - key: CHAT_MAX_TURN_USD
        value: '0.1'
      # How many proxies sit in front of this process — Render is one. The per-IP
      # limiters count back this many entries from the RIGHT of X-Forwarded-For,
      # which is the part a caller cannot forge. Raising it above the real hop
      # count walks back into client-supplied text and makes every limit
      # opt-out, so only change it if the topology actually changes.
      - key: TRUSTED_PROXY_HOPS
        value: '1'
