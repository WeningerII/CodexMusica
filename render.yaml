# Render Blueprint — deploys the CodexMusica MCP server as a Docker web service.
#
# Deploy: Render dashboard → New + → Blueprint → connect this repo → Apply.
# Endpoint after deploy: https://<service-name>.onrender.com/mcp
services:
  - type: web
    name: codex-musica-mcp
    runtime: docker
    dockerfilePath: ./mcp/Dockerfile
    dockerContext: .
    # Render deploys the service from this branch. Note: the Blueprint itself is
    # ALSO bound to a source branch in Render's UI — repoint that to main too
    # (Blueprint → settings) before deleting any feature branch.
    branch: main
    # STANDARD (2 GB) BECAUSE STARTER (512 MB) CANNOT SERVE ONE CALL — M-157.
    # The flash battery's first two live rounds each OOM-killed the Starter
    # instance ("Instance failed: Ran out of memory (used over 512MB)", one
    # event per round, Render's own log), and the peaks were then measured
    # with the connector's exact argv: 826-882 MB for a single lyric_grade or
    # lyric_revise call, FLAT from the planner's 22-line floor to 50 lines —
    # the cost is the lexicon-wide candidate machinery, not the draft, so no
    # song the planner can emit fits 512 MB. scripts/check_deploy_memory.js
    # holds this line to the measured band (peak x declared margin) in CI;
    # scripts/measure_verb_memory.py re-derives the band. Changing this line
    # changes the service's billing tier when the Blueprint is synced — it is
    # a spending decision, and merging it is how the decision is made.
    plan: standard
    healthCheckPath: /health
    # OFF SINCE 2026-08-27, AND THE REPLACEMENT IS A WORKFLOW, NOT A DASHBOARD.
    #
    # `autoDeploy: true` fires on PUSH and knows nothing about GitHub Actions,
    # so a red main reached the live connector while the identical red main
    # could not reach the live page — sync-pages.yml has held the WEBSITE to
    # "green before live" since it was written, and this service had no
    # equivalent. The connector is the surface with the harness inside it (see
    # mcp/Dockerfile: it COPYs lyric-harness and runs it as python3
    # subprocesses), so it was the half where shipping a red tree costs more,
    # and it was the ungated half.
    #
    # NOT Render's own "deploy only after CI passes" toggle, for the reason
    # this file already gives twice below: a setting that lives only in the
    # dashboard is invisible to this repository. GEMINI_MODEL is pinned here
    # precisely because the deployed model used to be whatever the dashboard
    # happened to hold, and CHAT_DAILY_USD sat disarmed the same way.
    #
    # .github/workflows/deploy-connector.yml is the only path to a deploy now:
    # it triggers on CI *completion* for main, runs only when that run
    # SUCCEEDED, and POSTs the Render deploy hook pinned to the validated
    # commit. It needs the repository secret RENDER_DEPLOY_HOOK_URL (Render
    # dashboard -> this service -> Settings -> Deploy Hook), and it FAILS LOUD
    # rather than quietly not deploying if that secret is unset.
    autoDeploy: false
    # /mcp needs none of these — it is pure deterministic compute over the
    # bundled catalog. They exist for /chat, which is the one surface that
    # spends money. `sync: false` means Render PROMPTS for the value instead of
    # storing it here: a key committed to a public repo is a key that has been
    # published, and this repo is public.
    #
    # With GEMINI_API_KEY unset the chat endpoint answers 503 with a legible
    # reason and the page keeps its dock hidden. The connector is unaffected.
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      # Signs the conversation envelope. Unset is SAFE but not free: chat.js
      # generates one per boot, so every redeploy silently ends conversations
      # in flight (the next message starts a new recipe). Set it to survive
      # deploys. Any long random string.
      - key: CHAT_SECRET
        sync: false
      # The model the chat bar runs on, declared rather than defaulted.
      #
      # This was previously unset, so the deployed model was whatever
      # gemini_agent.js:DEFAULT_MODEL happened to be — and could be changed from
      # the Render dashboard with no trace anywhere in this repo. Nothing here
      # said what was live, which is the same invisibility that let the spend cap
      # sit disarmed: a model this repo has never heard of is exactly the input
      # that used to turn CHAT_DAILY_USD into decoration.
      #
      # It is pinned to the current default, so this changes no behaviour today.
      # What it changes is that swapping the model is now a REPO edit, reviewable
      # like any other, and mcp/test.mjs asserts the value named here is one the
      # pricing table can price — so a model swap that would disable the chat bar
      # fails in CI rather than at deploy.
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      # Longest message /chat will accept, in characters. Declared rather than
      # defaulted because the page's `maxlength` is the same bound written twice
      # — mcp/test.mjs asserts the two agree, and that assertion reads the repo,
      # so a value set only in the Render dashboard would move the server bound
      # while the field kept truncating and CI kept passing.
      #
      # ~1250 tokens at the deployed model's input price; re-sent on every hop of
      # a 12-step turn that is still under $0.002, against the $0.10 CHAT_MAX_TURN_USD
      # ceiling below. The turn cap is what bounds spend, not this.
      - key: CHAT_MAX_MESSAGE
        value: '5000'
      # Spend ceiling in USD before /chat refuses. See CHAT_LIMITS in mcp/chat.js
      # for the rate limits this sits on top of.
      #
      # READ THE NEXT BLOCK BEFORE TRUSTING THE WORD "DAY". With no
      # CHAT_SPEND_FILE this counter lives in process memory, and autoDeploy
      # below restarts the service on every push to main — so what this actually
      # bounds is an uptime period that happens to reset at UTC midnight too.
      # This used to be described here as a per-day cap with no qualification
      # (audit F128). /chat/status now reports `capDurable: false` and
      # `countingSince`, and the service logs the same thing at boot, so the
      # limitation is visible rather than inferred.
      - key: CHAT_DAILY_USD
        value: '2'
      # Where the daily counters live, so they survive a restart.
      #
      # UNSET TODAY, DELIBERATELY, because this blueprint declares no `disk:` —
      # Render rebuilds the container on deploy, so a path on the container
      # filesystem would reset on precisely the event that motivated the fix.
      # Pointing this at an unmounted path would be worse than leaving it unset:
      # the service would report `capDurable: true` and still lose the count.
      #
      # To make the cap real, add a disk to this service and point this at it:
      #
      #   disk:
      #     name: chat-spend
      #     mountPath: /data
      #     sizeGB: 1
      #   ...
      #   - key: CHAT_SPEND_FILE
      #     value: /data/spend.json
      #
      # A disk pins the service to a single instance, which costs nothing here:
      # CHAT_CONCURRENCY is 2 and the service has never needed to scale out. An
      # unusable path degrades to in-memory with a log line rather than failing
      # the endpoint (mcp/spend_store.js), and the counters are validated on read
      # so a corrupt file can never hand budget back.
      # - key: CHAT_SPEND_FILE
      #   value: /data/spend.json
      # The SECOND daily ceiling, counted in turns rather than dollars, and
      # deliberately independent of the pricing table: it still fires if the
      # cost arithmetic is ever wrong in the cheap direction. In normal
      # operation CHAT_DAILY_USD is what the service hits first.
      - key: CHAT_MAX_TURNS_PER_DAY
        value: '400'
      # What ONE turn may spend before it stops between hops. maxSteps bounds
      # the hop count, but every hop re-sends the whole transcript, so cost
      # grows faster than the step counter does. Measured worst prompt: $0.033.
      - key: CHAT_MAX_TURN_USD
        value: '0.1'
      # How many proxies sit in front of this process — Render is one. The per-IP
      # limiters count back this many entries from the RIGHT of X-Forwarded-For,
      # which is the part a caller cannot forge. Raising it above the real hop
      # count walks back into client-supplied text and makes every limit
      # opt-out, so only change it if the topology actually changes.
      - key: TRUSTED_PROXY_HOPS
        value: '1'
